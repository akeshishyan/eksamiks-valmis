"linnamüür","en":"town wall"},{"et":"torn","en":"tower"},{"et":"kitsas","en":"narrow"},{"et":"plats / väljak","en":"square (in a town)"},{"et":"loomelinnak","en":"creative quarter, creative city (arts district)"},{"et":"tehas","en":"factory"},{"et":"autogramm","en":"autograph"},{"et":"lehvitama","en":"to wave"},{"et":"sarnane","en":"similar"},{"et":"kuulus","en":"famous"},{"et":"(kellegi) moodi","en":"looks like (someone)"}],"questions":[{"type":"mc","q":"Mis kell Margus hommikul tõuseb?","q_en":"What time does Margus get up in the morning?","options":["kell viis","kell pool kuus","kell pool kaheksa"],"answer":0,"explanation_en":"At five. Half past five is when they are driving to Tallinn; half past seven is when they reach the airport.","evidence_et":"Hommikul tõusen vara, juba kell viis."},{"type":"tf","q":"Vanaisa sööb hommikul kuus võileiba.","q_en":"Grandfather eats six sandwiches in the morning.","options":["Õige","Vale"],"answer":1,"explanation_en":"False: Margus eats six sandwiches; grandfather eats nothing and only drinks tea (he is sad).","evidence_et":"söön kuus võileiba. ... Vanaisa ei söö mitte midagi."},{"type":"mc","q":"Kes juhib autot Tallinnasse?","q_en":"Who drives the car to Tallinn?","options":["Margus","Marta","vanaisa"],"answer":2,"explanation_en":"Grandfather drives; Marta sits in front next to him and Margus sits in the back.","evidence_et":"Vanaisa sõidab. Marta istub ette vanaisa kõrvale. Mina istun taha."},{"type":"mc","q":"Kuhu lendab vanaisa Tallinnast kõigepealt?","q_en":"Where does grandfather fly to first from Tallinn?","options":["Torontosse","Londonisse","Helsingisse"],"answer":1,"explanation_en":"First to London, then from London to Toronto. Helsinki is where the two tourists go next by ship.","evidence_et":"Vanaisa lendab Tallinnast Londonisse ja siis Londonist Torontosse."},{"type":"tf","q":"Mingmei ja Günther räägivad Margusega eesti keeles.","q_en":"Mingmei and Günther speak Estonian with Margus.","options":["Õige","Vale"],"answer":1,"explanation_en":"False: they speak English, because the tourists don't know Estonian.","evidence_et":"Räägime inglise keeles, sest nad on turistid ja ei oska eesti keelt."},{"type":"mc","q":"Mitu torni on Tallinna linnamüüris?","q_en":"How many towers are there in Tallinn's town wall?","options":["kaksteist","kakskümmend kaks","kolmkümmend kaks"],"answer":2,"explanation_en":"Thirty-two (kolmkümmend kaks). Watch the -teist (11–19) vs -kümmend (tens) endings.","evidence_et":"Tallinna linnamüüris on kokku kolmkümmend kaks torni!"},{"type":"mc","q":"Miks tüdrukud küsivad Marguselt autogrammi?","q_en":"Why do the girls ask Margus for an autograph?","options":["Nad arvavad, et ta on laulja Karl-Erik Taukar.","Nad teavad, et ta on kuulus itimees.","Nad arvavad, et ta on näitleja Kanadast."],"answer":0,"explanation_en":"Margus looks like (on ... moodi) the famous Estonian singer Karl-Erik Taukar, so the girls think he is the singer.","evidence_et":"Karl-Erik Taukar on üks Eesti laulja. Ta on väga kuulus."},{"type":"tf","q":"Karl-Erik Taukar annab neile kolm piletit oma kontserdile.","q_en":"Karl-Erik Taukar gives them three tickets to his concert.","options":["Õige","Vale"],"answer":0,"explanation_en":"True: the concert is at seven at Vaba Lava (a concert hall).","evidence_et":"Karl-Erik Taukar annab meile kolm piletit."}]}],"exam_tasks":[{"section":"kirjutamine","title":"Andmete kirjutamine visiitkaardilt (A) – Pille Talu, massöör","booklet_ref":"Kirjutamine, esimene ülesanne (A), lk 1","instructions_et":"Te näete visiitkaarti ühe inimese andmetega. Palun kirjutage:\n• Kellena ta töötab?\n• Kus ta töötab?\n• Millal ta töötab?\n• Kuidas saab temaga kontakti?\nTeksti pikkus peab olema vähemalt 25 sõna.","instructions_en":"You see a business card with one person's details. Write: What does she work as? Where does she work? When does she work? How can you contact her? At least 25 words.","converted_to_reading":false,"text_et":"AURA SALONG\nPille Talu\nmassöör\nMarja 28\nIII korrus\nTallinn\ntel 663 1751\nT, K, N 12–18","items":[{"type":"open","q":"Kirjutage tekst visiitkaardi põhjal (vähemalt 25 sõna).","options":[],"answer":"Pille Talu töötab massöörina. Ta töötab Aura salongis. Salong asub Tallinnas, Marja tänav 28, kolmandal korrusel. Pille töötab teisipäeval, kolmapäeval ja neljapäeval kella 12-st kuni 18-ni. Temaga saab kontakti telefoni teel. Tema telefoninumber on 663 1751.","explanation_en":"LEARNER'S ANSWER HAS PROBLEMS: (1) Only 19 words – below the required 25, which loses points. (2) Card data left out: the salon name (Aura salong), the city (Tallinn) and the person's name (Pille Talu). The task says to use the card's data, so use all of it. (3) 'Ta töötab Marja 28' needs a case/word: 'Ta töötab aadressil Marja 28' or 'Marja tänav 28'. (4) 'teisipäevast neljapäevani' is acceptable because T, K, N are three days in a row, but the safest is to list them: 'teisipäeval, kolmapäeval ja neljapäeval'. Good: 'massöörina' (essive -na after 'töötab') and '3. korrusel' are correct."}],"model_answer_et":"Pille Talu töötab massöörina. Ta töötab Aura salongis. Salong asub Tallinnas, Marja tänav 28, kolmandal korrusel. Pille töötab teisipäeval, kolmapäeval ja neljapäeval kella 12-st kuni 18-ni. Temaga saab kontakti telefoni teel. Tema telefoninumber on 663 1751.","checklist_en":["On topic: the text answers the task (Harno: 'tekst on teemakohane').","Right length: count the words; below the minimum costs points (Harno: 'õige pikkusega').","All content points (bullets) are covered (Harno: 'arvestatud etteantud sisupunkte').","The reader understands what you want to say; small spelling/grammar errors are tolerated at A2 if meaning is clear.","Every item on the card appears: name, job (massöörina), workplace (Aura salongis), city, street + number, floor, days, hours, phone.","Job with -na: 'Ta töötab massöörina'. Place with -s: 'Aura salongis', 'Tallinnas'.","Abbreviations expanded: T, K, N = teisipäeval, kolmapäeval, neljapäeval; III korrus = kolmandal korrusel.","Hours as 'kella 12-st kuni 18-ni' or 'kella kaheteistkümnest kuueni'."],"learner_answer_et":"Ta töötab massöörina. Ta töötab Marja 28, 3. korrusel teisipäevast neljapäevani kella 12.00-st kuni 18.00-ni. Tema telefoninumber on 6631751.","learner_word_count":19},{"section":"kirjutamine","title":"Andmete kirjutamine visiitkaardilt (B) – Lõuna Tervisekeskus","booklet_ref":"Kirjutamine, esimene ülesanne (B), lk 2","instructions_et":"Te näete visiitkaarti ühe asutuse andmetega. Palun kirjutage:\n• Mis asutus see on?\n• Kus see asub?\n• Mida seal teha saab?\n• Kuidas saab kontakti?\nTeksti pikkus peab olema vähemalt 25 sõna.","instructions_en":"You see a business card of an institution. Write: What institution is it? Where is it? What can you do there? How can you contact it? At least 25 words.","converted_to_reading":false,"text_et":"LÕUNA TERVISEKESKUS\nPEREARSTID • PEREÕED • HAMBARAVI • APTEEK\nRegistratuur tel 793 7783\nPeetri 4, Valga\ninfo@tervisekeskus.ee\nE−R 8−19","items":[{"type":"open","q":"Kirjutage tekst visiitkaardi põhjal (vähemalt 25 sõna).","options":[],"answer":"See on Lõuna Tervisekeskus. Tervisekeskus asub Valgas, Peetri tänav 4. Seal töötavad perearstid ja pereõed. Seal saab käia hambaarsti juures ja osta ravimeid apteegist. Tervisekeskus on avatud esmaspäevast reedeni kella 8-st 19-ni. Registratuuri telefon on 793 7783. Kirjutada saab aadressile info@tervisekeskus.ee.","explanation_en":"LEARNER'S ANSWER IS GOOD: all four questions answered with all card data, 42 words. Small fixes: (1) 'Asub Valgas' has no subject – write 'See asub Valgas' or 'Tervisekeskus asub Valgas'. (2) The last sentence has no full stop. (3) Structures like 'helistades', 'kirjutades' and 'saada hambaravi teenuseid' are above A2; they are correct here, but in the exam short simple sentences are safer."}],"model_answer_et":"See on Lõuna Tervisekeskus. Tervisekeskus asub Valgas, Peetri tänav 4. Seal töötavad perearstid ja pereõed. Seal saab käia hambaarsti juures ja osta ravimeid apteegist. Tervisekeskus on avatud esmaspäevast reedeni kella 8-st 19-ni. Registratuuri telefon on 793 7783. Kirjutada saab aadressile info@tervisekeskus.ee.","checklist_en":["On topic: the text answers the task (Harno: 'tekst on teemakohane').","Right length: count the words; below the minimum costs points (Harno: 'õige pikkusega').","All content points (bullets) are covered (Harno: 'arvestatud etteantud sisupunkte').","The reader understands what you want to say; small spelling/grammar errors are tolerated at A2 if meaning is clear.","All card data used: name, town, street + number, services (family doctors, nurses, dental care, pharmacy), phone, e-mail, opening hours.","Every sentence has a subject and verb ('See asub...', not 'Asub...').","E–R = esmaspäevast reedeni."],"learner_answer_et":"See asutus on Lõuna Tervisekeskus. Asub Valgas, aadressil Peetri 4. Seal saab käia perearsti ja pereõe vastuvõtul, saada hambaravi teenuseid ning külastada apteeki. Kontakti saab helistades registratuuri telefonil 793 7783 või kirjutades e-posti aadressile info@tervisekeskus.ee. Asutus on avatud esmaspäevast reedeni kell 8–19","learner_word_count":42},{"section":"kirjutamine","title":"Teade: leidsid sõbra rahakoti","booklet_ref":"Kirjutamine, teine ülesanne (A), lk 3","instructions_et":"Leidsite oma kodust sõbra rahakoti. Kirjutage talle teade:\n• Kust te rahakoti leidsite?\n• Milline rahakott on?\n• Kuidas sõber rahakoti tagasi saab?\nTeksti pikkus peab olema vähemalt 30 sõna.","instructions_en":"You found your friend's wallet in your home. Write them a message: Where did you find the wallet? What is the wallet like? How can your friend get it back? At least 30 words.","converted_to_reading":false,"text_et":"","items":[{"type":"open","q":"Kirjutage sõbrale teade (vähemalt 30 sõna).","options":[],"answer":"Tere, Kati!\nLeidsin täna oma elutoast diivani alt sinu rahakoti. Rahakott on väike ja must, see on nahast. Rahakotis on sinu pangakaart ja natuke raha. Ma olen homme terve päeva kodus. Tule mulle külla ja võta rahakott! Kui sul ei ole aega, toon selle sulle ise. Helista mulle!\nSinu Anna","explanation_en":"LEARNER'S ANSWER IS GOOD in content (52 words, all three bullets answered). Mistake: 'truubiga' – 'truup' means a culvert/drain pipe. The word for a snap button is 'trukk' -> 'trukiga'. ('väikese luku ja trukiga' = with a small zip and a snap.) Missing: the friend's name after 'Tere' and a sign-off with your name; a message/note normally has both."}],"model_answer_et":"Tere, Kati!\nLeidsin täna oma elutoast diivani alt sinu rahakoti. Rahakott on väike ja must, see on nahast. Rahakotis on sinu pangakaart ja natuke raha. Ma olen homme terve päeva kodus. Tule mulle külla ja võta rahakott! Kui sul ei ole aega, toon selle sulle ise. Helista mulle!\nSinu Anna","checklist_en":["On topic: the text answers the task (Harno: 'tekst on teemakohane').","Right length: count the words; below the minimum costs points (Harno: 'õige pikkusega').","All content points (bullets) are covered (Harno: 'arvestatud etteantud sisupunkte').","The reader understands what you want to say; small spelling/grammar errors are tolerated at A2 if meaning is clear.","Message form: greeting with name (Tere, Kati!) and sign-off with your name.","Bullet 1 – where: place words with -s / -lt / alt: 'elutoast', 'diivani alt', 'köögist laua pealt'.","Bullet 2 – what it looks like: colour, size, material ('nahast'), what is inside.","Bullet 3 – how to get it back: a time and a way ('Tule homme', 'Ma toon selle sulle', 'Helista mulle')."],"learner_answer_et":"Tere! Leidsin täna oma kodust elutoa diivani vahelt sinu rahakoti. See on mustast nahast, väikese luku ja truubiga. Saad sellele igal ajal järele tulla, kui oled minu kandis. Kui sul on sellega kiire, võin selle sulle täna õhtul ise ära tuua või kuskil kesklinnas kokku saada. Anna teada, kuidas sulle paremini sobib!","learner_word_count":52},{"section":"kirjutamine","title":"Kirjeldus: Minu nädalavahetus","booklet_ref":"Kirjutamine, teine ülesanne (B), lk 3","instructions_et":"Teie eesti keele õpetaja palus teil kirjeldada oma nädalavahetust. Kirjutage teemal: Minu nädalavahetus\n• Kus käite?\n• Mida teete?\n• Kellega kohtute?\nTeksti pikkus peab olema vähemalt 30 sõna.","instructions_en":"Your Estonian teacher asked you to describe your weekend. Write on the topic 'My weekend': Where do you go? What do you do? Whom do you meet? At least 30 words.","converted_to_reading":false,"text_et":"","items":[{"type":"open","q":"Kirjutage teemal „Minu nädalavahetus“ (vähemalt 30 sõna).","options":[],"answer":"Minu nädalavahetus on tavaliselt rahulik. Laupäeva hommikul käin turul ja poes. Pärast lõunat koristan kodu ja loen raamatut. Õhtul kohtun sõpradega kohvikus. Me räägime juttu ja joome kohvi. Pühapäeval sõidan maale vanemate juurde. Seal jalutame metsas ja sööme koos lõunat. Õhtul vaatan telerit ja puhkan.","explanation_en":"LEARNER'S ANSWER IS CORRECT and covers all three bullets (where: kinos, kohvikus, looduses/pargis; what: jalutan, sööme, räägime juttu; with whom: sõpradega, perega). Only 32 words, just over the minimum of 30 – aim for 40+ so a miscount cannot cost points."}],"model_answer_et":"Minu nädalavahetus on tavaliselt rahulik. Laupäeva hommikul käin turul ja poes. Pärast lõunat koristan kodu ja loen raamatut. Õhtul kohtun sõpradega kohvikus. Me räägime juttu ja joome kohvi. Pühapäeval sõidan maale vanemate juurde. Seal jalutame metsas ja sööme koos lõunat. Õhtul vaatan telerit ja puhkan.","checklist_en":["On topic: the text answers the task (Harno: 'tekst on teemakohane').","Right length: count the words; below the minimum costs points (Harno: 'õige pikkusega').","All content points (bullets) are covered (Harno: 'arvestatud etteantud sisupunkte').","The reader understands what you want to say; small spelling/grammar errors are tolerated at A2 if meaning is clear.","Kus käite? 'käin + -s' (käin poes, kinos, ujulas).","Mida teete? Present-tense verbs (loen, koristan, jalutan).","Kellega kohtute? 'kohtun + -ga' (sõpradega, emaga).","Time words to organise the text: laupäeval, pühapäeval, hommikul, õhtul, pärast lõunat."],"learner_answer_et":"Minu nädalavahetus on alati tore ja rahulik. Laupäeval käin ma sõpradega kinos või kohvikus ning pühapäeval jalutan looduses või pargis. Õhtuti kohtun oma perega, me sööme koos maitsvat õhtusööki ja räägime juttu.","learner_word_count":32},{"section":"kuulamine","title":"Kuulamine 1: lühikesed tekstid (küsimused 1–7)","booklet_ref":"Kuulamine, esimene ülesanne, lk 4–5","instructions_et":"Küsimused 1–7. Kuulake teksti ja tehke märge ✓ ruutu selle pildi, numbri või sõna all, mis sobib küsimuse vastuseks. Kõigepealt kuulete näidise teksti. Näidis on tähistatud 0-ga.","instructions_en":"Questions 1–7. Listen and tick the picture, number or word that answers the question. Example 0: 'Missugune ilm on hommikul?' – answer C (rain). In this app: no transcript exists in the booklet, so read the reconstructed text instead (see note).","converted_to_reading":true,"conversion_note":"NO TRANSCRIPT IN BOOKLET: the booklet prints only the questions, not what is said in the audio. text_et below is a reconstructed reading text written for this app so the task can be done as reading; it is built to agree with the booklet's official answer key, but it is NOT the original recording. Questions, options and answers are the booklet's own. The official audio is linked in audio_url (not verified to match this booklet version exactly).","audio_url":"https://projektid.edu.ee/download/attachments/343705183/A2_Konsultatsioon_kuulamistest_veebruar2024_3.mp3?version=1&modificationDate=1771319710518&api=v2","text_et":"0. Täna hommikul on ilm pilves ja sajab vihma. Pärastlõunal tuleb päike välja.\n\n1. Tähelepanu, autojuhid! Tallinna–Peterburi maanteel on teetööd. Tavaliselt võib seal sõita palju kiiremini, aga praegu ainult 40 kilomeetrit tunnis. Palun sõitke ettevaatlikult!\n\n2. Arst ütleb: „Piret, teil on gripp. See rohi on väga hea. Võtke seda kuus korda päevas, iga kahe tunni tagant. Ja jooge palju sooja teed!“\n\n3. Miia tavaliselt sõidab sünnipäeval reisile või sööb perega restoranis. Aga seekord on teisiti. Seekord teeb Miia suure peo ja kutsub sõbrad tantsima.\n\n4. – Tere! Ma soovin juustu. – Kui palju? Nelisada grammi? – Ei, natuke rohkem. Palun viissada grammi.\n\n5. – Mati, kas sul on kõik asjad kaasas? – Kindad on käes ja sall on kaelas. Aga oi, müts! Ma unustasin oma mütsi töö juurde.\n\n6. Tähelepanu! Tallinna–Narva rong väljub kell 20.05. Tallinna–Tartu rong väljub kell 20.25 teiselt platvormilt.\n\n7. Laural oli eile sünnipäev. Vanaema tõi talle suure tordi. Vanemad kinkisid Laurale pehme pruuni mängukaru. Jalgratast ta seekord ei saanud.","items":[{"type":"mc","q":"1. Kui kiiresti võib sõita Tallinna-Peterburi maanteel?","options":["A – 20 km/h","B – 30 km/h","C – 40 km/h"],"answer":2,"explanation_en":"Official key: C (40 km/h). 'Kui kiiresti võib sõita' = how fast may you drive. Learner's booklet answer: C (correct)."},{"type":"mc","q":"2. Mitu korda päevas peab Piret rohtu võtma?","options":["A – 2","B – 4","C – 6"],"answer":2,"explanation_en":"Official key: C (6). 'Mitu korda päevas' = how many times a day; 'rohtu võtma' = to take medicine. Learner's booklet answer: C (correct)."},{"type":"mc","q":"3. Mida teeb Miia seekord oma sünnipäeval?","options":["A – (pilt) naine kohvritega: sõidab reisile","B – (pilt) paarid tantsivad: teeb peo / tantsib","C – (pilt) restoran ja kokk: sööb restoranis"],"answer":1,"explanation_en":"Official key: B (the dancing picture). 'Seekord' = this time – the other options are what she usually does. Learner's booklet answer: B (correct)."},{"type":"mc","q":"4. Kui palju juustu sooviti osta?","options":["A – 400 g","B – 500 g","C – 600 g"],"answer":1,"explanation_en":"Official key: B (500 g = viissada grammi). 'sooviti' = was wanted (impersonal past of 'soovima'). Learner's booklet answer: B (correct)."},{"type":"mc" iin raamatud vähem kui poes.' (soodne = cheap, good price). In B the text says books in SHOPS are too expensive. Learner's booklet answer: A (correct)."},{"type":"match","q":"12. Siin käib hommikul vähe inimesi.","options":["A – rahvusraamatukogu raamatumüük","B – Rae raamatukogu","C – Rääma raamatukauplus"],"answer":1,"explanation_en":"Official key: B. B: 'Kõige rahulikum on siin enne lõunat.' (quietest before lunch = few people in the morning). Learner's booklet answer: B (correct)."}],"model_answer_et":"","checklist_en":[]},{"section":"lugemine","title":"Lugemine 3: teated ja selgitused (küsimused 13–17)","booklet_ref":"Lugemine, kolmas ülesanne, lk 11","instructions_et":"Küsimused 13–17. Lugege teateid ja nende selgitusi. Kirjutage iga teate (13–17) järele sobiva selgituse ees olev täht (A–I). Kaks lauset jääb üle. Näidis on tähistatud 0-ga.","instructions_en":"Questions 13–17. Match each notice to its explanation (A–I). Two explanations are left over. Example 0: 'Palun vaikust!' – A. (The booklet's letters skip G.)","converted_to_reading":false,"text_et":"","items":[{"type":"match","q":"13. Kuni 3-aastastele lastele!","options":["A Ei tohi kõvasti rääkida!","B Piletit ei tohi ära visata.","C Lastele on keelatud.","D Siin võivad olla väikesed lapsed.","E Sisse tohib tulla ainult piletiga.","F Siit ei pääse läbi.","H Siin peab olema väga ettevaatlik.","I Piletit ei pea ostma."],"answer":3,"explanation_en":"Official key: D. 'Kuni 3-aastastele' = for children up to 3 years old -> small children may be here. Unused: C and E. Learner's booklet answer: D (correct)."},{"type":"match","q":"14. Tasuta sissepääs!","options":["A Ei tohi kõvasti rääkida!","B Piletit ei tohi ära visata.","C Lastele on keelatud.","D Siin võivad olla väikesed lapsed.","E Sisse tohib tulla ainult piletiga.","F Siit ei pääse läbi.","H Siin peab olema väga ettevaatlik.","I Piletit ei pea ostma."],"answer":7,"explanation_en":"Official key: I. 'Tasuta' = free of charge -> you don't need to buy a ticket. (E is the opposite.) Unused: C and E. Learner's booklet answer: I (correct)."},{"type":"match","q":"15. Hoia pilet reisi lõpuni alles!","options":["A Ei tohi kõvasti rääkida!","B Piletit ei tohi ära visata.","C Lastele on keelatud.","D Siin võivad olla väikesed lapsed.","E Sisse tohib tulla ainult piletiga.","F Siit ei pääse läbi.","H Siin peab olema väga ettevaatlik.","I Piletit ei pea ostma."],"answer":1,"explanation_en":"Official key: B. 'Keep the ticket until the end of the trip' -> do not throw the ticket away. Unused: C and E. Learner's booklet answer: B (correct)."},{"type":"match","q":"16. Libe põrand!","options":["A Ei tohi kõvasti rääkida!","B Piletit ei tohi ära visata.","C Lastele on keelatud.","D Siin võivad olla väikesed lapsed.","E Sisse tohib tulla ainult piletiga.","F Siit ei pääse läbi.","H Siin peab olema väga ettevaatlik.","I Piletit ei pea ostma."],"answer":6,"explanation_en":"Official key: H. 'Slippery floor!' -> you must be very careful. Unused: C and E. Learner's booklet answer: H (correct)."},{"type":"match","q":"17. Tee on suletud!","options":["A Ei tohi kõvasti rääkida!","B Piletit ei tohi ära visata.","C Lastele on keelatud.","D Siin võivad olla väikesed lapsed.","E Sisse tohib tulla ainult piletiga.","F Siit ei pääse läbi.","H Siin peab olema väga ettevaatlik.","I Piletit ei pea ostma."],"answer":5,"explanation_en":"Official key: F. 'Road closed!' -> you cannot get through here. Unused: C and E. Learner's booklet answer: F (correct)."}],"model_answer_et":"","checklist_en":[]},{"section":"lugemine","title":"Lugemine 3 (B): kohad ja kirjeldused (küsimused 13–17) – lisaülesanne","booklet_ref":"Lugemine, kolmas ülesanne (B) – hidden alternative layer in the PDF (p. 10 text layer), not visible on the printed page","instructions_et":"Küsimused 13–17. Lugege kohtade nimetusi ja nende kirjeldusi. Märkige iga koha nimetuse (13–17) järele sobiva kirjelduse ees olev täht (A–I). Kaks lauset jääb üle. Näidis on tähistatud 0-ga.","instructions_en":"Questions 13–17 (variant B). Match each place name to its description (A–I). Two are left over. Example 0: 'Apteek' – A. EXTRA TASK: found only in the PDF's hidden text layer, with its own key (13 I, 14 H, 15 D, 16 C, 17 B), which was checked and is consistent. The learner did not do this task.","converted_to_reading":false,"text_et":"","items":[{"type":"match","q":"13. Autokool","options":["A Siit saab osta ravimeid.","B Siia saab jätta oma mantli.","C Siin saab remontida sõidukit.","D Siia saab panna oma auto.","E Siin saab õppida ametit.","F Siin saab riideid selga proovida.","H Siin saab olla enne sissekutsumist.","I Siin saab harjutada sõiduki juhtimist."],"answer":7,"explanation_en":"Key: I. Driving school -> you practise driving a vehicle (sõiduki juhtimist). Unused: E (learn a profession = kutsekool) and F (try on clothes = proovikabiin)."},{"type":"match","q":"14. Ooteruum","options":["A Siit saab osta ravimeid.","B Siia saab jätta oma mantli.","C Siin saab remontida sõidukit.","D Siia saab panna oma auto.","E Siin saab õppida ametit.","F Siin saab riideid selga proovida.","H Siin saab olla enne sissekutsumist.","I Siin saab harjutada sõiduki juhtimist."],"answer":6,"explanation_en":"Key: H. Waiting room -> where you are before being called in (sissekutsumine). Unused: E (learn a profession = kutsekool) and F (try on clothes = proovikabiin)."},{"type":"match","q":"15. Parkimismaja","options":["A Siit saab osta ravimeid.","B Siia saab jätta oma mantli.","C Siin saab remontida sõidukit.","D Siia saab panna oma auto.","E Siin saab õppida ametit.","F Siin saab riideid selga proovida.","H Siin saab olla enne sissekutsumist.","I Siin saab harjutada sõiduki juhtimist."],"answer":3,"explanation_en":"Key: D. Parking garage -> where you can put your car. Unused: E (learn a profession = kutsekool) and F (try on clothes = proovikabiin)."},{"type":"match","q":"16. Autoteenindus","options":["A Siit saab osta ravimeid.","B Siia saab jätta oma mantli.","C Siin saab remontida sõidukit.","D Siia saab panna oma auto.","E Siin saab õppida ametit.","F Siin saab riideid selga proovida.","H Siin saab olla enne sissekutsumist.","I Siin saab harjutada sõiduki juhtimist."],"answer":2,"explanation_en":"Key: C. Car service -> where a vehicle can be repaired. Unused: E (learn a profession = kutsekool) and F (try on clothes = proovikabiin)."},{"type":"match","q":"17. Riidehoid","options":["A Siit saab osta ravimeid.","B Siia saab jätta oma mantli.","C Siin saab remontida sõidukit.","D Siia saab panna oma auto.","E Siin saab õppida ametit.","F Siin saab riideid selga proovida.","H Siin saab olla enne sissekutsumist.","I Siin saab harjutada sõiduki juhtimist."],"answer":1,"explanation_en":"Key: B. Cloakroom -> where you can leave your coat. Unused: E (learn a profession = kutsekool) and F (try on clothes = proovikabiin)."}],"model_answer_et":"","checklist_en":[]},{"section":"lugemine","title":"Lugemine 4: Tiina üürib korteri (küsimused 18–22)","booklet_ref":"Lugemine, neljas ülesanne, lk 12","instructions_et":"Küsimused 18–22. Lugege teksti ja lauseid (18–22). Tehke märge ✓ sobiva vastuse (A, B või C) juures olevasse ruutu. Näidis on tähistatud 0-ga.","instructions_en":"Questions 18–22. Read the text and complete each sentence with A, B or C. Example 0: 'Tiina tahab panna uue tapeedi …' – A 'elutuppa'.","converted_to_reading":false,"text_et":"Tiina üürib korteri\n\nTiina tahab üürida ühetoalist korterit. Ta läheb seda vaatama. Tiina astub sisse ja märkab, et elutoas on kollane lilledega tapeet. Tiinale see ei meeldi. Ta tahab tapeedi ära vahetada. Elutoa mööbel ja köögi seinad on samuti kollast värvi. See Tiinat ei häiri. Vannituba on roheliseks värvitud. Tiina vaatab vannitoas ringi. Kapiuksed ei lähe korralikult kinni ja kapi värv on kulunud. Mööbel tuleb vannitoas kindlasti välja vahetada. Elutoa mööbel on veel päris korralik. Ka köögis on uued kapid. Tiina vaatab korteri aknaid. Köögi aknast näeb parki. Elutoa aken on ilus ja suur, kuid akna klaas on natuke katki. Selle peab kiiresti ära parandama. Vannitoa aken on tolmune ja must. Selle peseb Tiina homme puhtaks. Vannitoa uks on uus. Elutoas ei olegi ust. Köögi vana ukse asemele kavatseb Tiina uue ukse osta. Uut värvi vajab ka köögi sein. Vannitoa seinad on õnneks hiljuti värvitud. Tiina mõtleb, et värvi peab ostma ka elutoa põranda jaoks.","items":[{"type":"mc","q":"18. Kollast värvi ei ole …","options":["A – elutoas.","B – köögis.","C – vannitoas."],"answer":2,"explanation_en":"Official key: C. C: the living room has yellow wallpaper and furniture, the kitchen has yellow walls, but 'Vannituba on roheliseks värvitud' (green). Note the NEGATIVE question: 'ei ole'. Learner's booklet answer: C (correct)."},{"type":"mc","q":"19. Uut mööblit on tarvis …","options":["A – elutuppa.","B – kööki.","C – vannituppa."],"answer":2,"explanation_en":"Official key: C. C: 'Mööbel tuleb vannitoas kindlasti välja vahetada.' Living-room furniture is 'päris korralik', the kitchen has new cupboards. Learner's booklet answer: C (correct)."},{"type":"mc","q":"20. Aken vajab kohe remonti …","options":["A – elutoas.","B – köögis.","C – vannitoas."],"answer":0,"explanation_en":"Official key: A. A: 'Elutoa ... akna klaas on natuke katki. Selle peab kiiresti ära parandama.' The bathroom window only needs washing. Learner's booklet answer: A (correct)."},{"type":"mc","q":"21. Ukse peab ära vahetama …","options":["A – elutoas.","B – köögis.","C – vannitoas."],"answer":1,"explanation_en":"Official key: B. B: 'Köögi vana ukse asemele kavatseb Tiina uue ukse osta.' Bathroom door is new; the living room has no door. Learner's booklet answer: B (correct)."},{"type":"mc","q":"22. Seina peab värvima …","options":["A – elutoas.","B – köögis.","C – vannitoas."],"answer":1,"explanation_en":"Official key: B. B: 'Uut värvi vajab ka köögi sein.' Bathroom walls were recently painted; in the living room it is the FLOOR that needs paint. Learner's booklet answer: B (correct)."}],"model_answer_et":"","checklist_en":[]},{"section":"lugemine","title":"Lugemine 5: Laura kiri Kertule (lünktekst, küsimused 23–30)","booklet_ref":"Lugemine, viies ülesanne, lk 13","instructions_et":"Küsimused 23–30. Lugege teksti. Valige teksti alt lünka (23–30) sobiv sõna. Kirjutage igasse lünka valitud vastuse ees olev täht (A, B või C). Näidis on tähistatud 0-ga.","instructions_en":"Questions 23–30. Choose the word that fits each gap (A, B or C). Example 0: 'Kahjuks mu ... muutusid' – A 'plaanid'.","converted_to_reading":false,"text_et":"Tere, Kertu!\nPidin Sulle homme külla sõitma. Kahjuks mu (0) plaanid muutusid.\nEile (23) ________ ootamatult haigeks. Hommikul oli mul väga (24) ________ olla. Otsustasin, et ei lähe tööle. See oli õige mõte. Õhtuks tuli mul (25) ________ palavik. Helistasin kiirabisse ja kutsusin arsti koju. Arst arvas, et (26) ________ ei ole vaja minna. Ta käskis mul hoopis palju (27) ________ ja teed juua. Nüüd ravin ennast ja laman kodus voodis. Nädala pärast (28) ________ perearsti juurde tervist kontrollima.\nTahan ruttu terveks saada. Mul on (29) ________ väga kurb olla. Õues on juba päris ilus ja soe ilm. Ma loodan, et (30) ________ Sind varsti. Siis tervitame koos kevade saabumist!\nOle tubli!\nLaura","items":[{"type":"gap","q":"(23) ________","options":["A sain","B jäin","C võin"],"answer":1,"explanation_en":"Official key: B (jäin). Fixed phrase 'haigeks jääma' = to fall ill: 'Eile jäin ootamatult haigeks.' Learner's booklet answer: 'jäin' (correct)."},{"type":"gap","q":"(24) ________","options":["A hea","B paras","C halb"],"answer":2,"explanation_en":"Official key: C (halb). 'Mul on halb olla' = I feel sick/unwell. She is ill, so not 'hea'. Learner's booklet answer: 'halb' (correct)."},{"type":"gap","q":"(25) ________","options":["A tugev","B kõrge","C kiire"],"answer":1,"explanation_en":"Official key: B (kõrge). Fever is 'kõrge palavik' (high fever) in Estonian, not 'tugev'. Learner's booklet answer: 'kõrge' (correct)."},{"type":"gap","q":"(26) ________","options":["A haiglasse","B maale","C voodisse"],"answer":0,"explanation_en":"Official key: A (haiglasse). The doctor thought it was not necessary to go to hospital (haiglasse). Learner's booklet answer: 'haiglasse' (correct)."},{"type":"gap","q":"(27) ________","options":["A töötada","B jalutada","C magada"],"answer":2,"explanation_en":"Official key: C (magada). The doctor told her to sleep a lot (palju magada) and drink tea. Learner's booklet answer: 'magada' (correct)."},{"type":"gap","q":"(28) ________","options":["A lähen","B jätan","C panen"],"answer":0,"explanation_en":"Official key: A (lähen). 'Nädala pärast lähen perearsti juurde' = in a week I'll go to the family doctor. Learner's booklet answer: 'lähen' (correct)."},{"type":"gap","q":"(29) ________","options":["A elus","B toas","C väljas"],"answer":1,"explanation_en":"Official key: B (toas). She lies at home in bed: 'Mul on toas väga kurb olla' (it's sad to be indoors) while outside the weather is nice. Learner's booklet answer: 'toas' (correct)."},{"type":"gap","q":"(30) ________","options":["A loen","B pean","C näen"],"answer":2,"explanation_en":"Official key: C (näen). 'Ma loodan, et näen Sind varsti' = I hope to see you soon. Learner's booklet answer: 'näen' (correct)."}],"model_answer_et":"","checklist_en":[]},{"section":"rääkimine","title":"Pildi kirjeldamine: Pere ja sugulased (pilt 1)","booklet_ref":"Rääkimine, esimene ülesanne, I osa, lk 14 (pilt 1)","instructions_et":"Kirjeldage pilti. Teema: PERE JA SUGULASED (pilt 1).","instructions_en":"Describe the picture (topic: family and relatives). Picture 1 shows: a family in a bright bedroom or hotel room with warm lamps. A mother and two children (a girl and a boy) lie on a big bed and look at books and magazines together; the father sits in the background with a laptop.","converted_to_reading":false,"text_et":"(Pilt: pere magamistoas/hotellitoas. Ema, tüdruk ja poiss lamavad suurel voodil ja vaatavad raamatuid ja ajakirju. Isa istub tagaplaanil sülearvutiga. Toas põlevad lambid.)","items":[{"type":"open","q":"Kirjeldage pilti 1: kes on pildil, kus nad on, mida nad teevad, mis neil seljas on?","options":[],"answer":"(vt model_answer_et)","explanation_en":"Use the structure: who (Pildil on...), where (Nad on...), what they do (Nad loevad...), clothes and mood (Neil on hea tuju)."}],"model_answer_et":"Pildil on pere: ema, isa, tütar ja poeg. Nad on magamistoas, võib-olla hotellis. Ema ja lapsed lamavad suurel voodil. Nad vaatavad koos raamatut ja ajakirju. Tüdrukul on seljas roosa pluus ja poisil valge särk. Isa istub tagapool ja töötab arvutiga. Toas põlevad lambid, see on vist õhtu. Ma arvan, et neil on hea tuju, sest nad naeratavad.","checklist_en":["Speak in full sentences (subject + verb), not single words.","Keep talking: 4–6 sentences per picture or answer; add a reason with 'sest' or an opinion with 'Ma arvan, et ...'.","Pronunciation and grammar may have mistakes at A2, but the listener must understand you.","Note (harno.ee): speech is recorded and rated by two raters independently.","Use location phrases: voodil, toas, tagapool, akna juures.","Use present-tense verbs in 3rd person plural: lamavad, vaatavad, loevad, naeratavad."]},{"section":"rääkimine","title":"Pildi kirjeldamine: Pere ja sugulased (pilt 2)","booklet_ref":"Rääkimine, esimene ülesanne, I osa, lk 14 (pilt 2)","instructions_et":"Kirjeldage pilti. Teema: PERE JA SUGULASED (pilt 2).","instructions_en":"Describe the picture. Picture 2 shows: three generations at a table outdoors on a terrace in summer – a grandmother standing, a grandfather, a young man and a young woman, a little girl and a little boy. On the table: salad, bread, cherry tomatoes, fruit, glasses of water.","converted_to_reading":false,"text_et":"(Pilt: kolm põlvkonda söövad õues terrassil laua ääres. Vanaema seisab, vanaisa, noor mees ja noor naine, väike tüdruk ja väike poiss istuvad. Laual on salat, sai, tomatid, puuviljad ja klaasid veega.)","items":[{"type":"open","q":"Kirjeldage pilti 2: kes on pildil, kus nad on, mida nad teevad, mis on laual?","options":[],"answer":"(vt model_answer_et)","explanation_en":"Name family members (vanaema, vanaisa, ema, isa, lapsed), place (õues, aias, terrassil), action (söövad lõunat), food on the table, weather/season."}],"model_answer_et":"Pildil on suur pere. Seal on vanaema, vanaisa, ema, isa ja kaks last – tüdruk ja poiss. Nad on õues, aias või terrassil. On suvi ja ilm on ilus. Nad söövad koos lõunat. Laual on salat, sai, tomatid, puuviljad ja vesi. Vanaema seisab ja naeratab, teised istuvad laua ääres. Ma arvan, et see on pühapäev ja pere on vanavanemate juures külas.","checklist_en":["Speak in full sentences (subject + verb), not single words.","Keep talking: 4–6 sentences per picture or answer; add a reason with 'sest' or an opinion with 'Ma arvan, et ...'.","Pronunciation and grammar may have mistakes at A2, but the listener must understand you.","Note (harno.ee): speech is recorded and rated by two raters independently.","Family words: vanaema, vanaisa, vanavanemad, lapselapsed.","Food in partitive after 'söövad': söövad salatit, saia."]},{"section":"rääkimine","title":"Küsimused teemal: Pere ja sugulased (A ja B)","booklet_ref":"Rääkimine, esimene ülesanne, II osa, lk 15 (teemaleht läbiviijale)","instructions_et":"Eksamineerija valib teemalehelt küsimused ja palub testitavatel nendele vastata. TEEMA: PERE JA SUGULASED. Valik küsimusi A ja B.","instructions_en":"The examiner picks questions from this topic sheet (sets A and B) and you answer them. Answer each in 2–3 full sentences. The answers below are short examples – replace the facts with your own.","converted_to_reading":false,"text_et":"","items":[{"type":"open","q":"A: Kas teie elate üksinda või koos perega?","options":[],"answer":"Ma elan koos perega: mehe/naise ja kahe lapsega.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"A: Kui suur on teie pere? / Kui palju inimesi on teie peres?","options":[],"answer":"Minu pere on väike. Meie peres on neli inimest.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"A: Kes on teie pereliikmed?","options":[],"answer":"Minu pereliikmed on minu naine, poeg, tütar ja mina.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"A: Millega teie pereliikmed tegelevad? / Kus teie pereliikmed töötavad/õpivad?","options":[],"answer":"Minu naine töötab haiglas, ta on õde. Poeg käib koolis ja tütar käib lasteaias.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"A: Mida te koos perega nädalavahetusel teete?","options":[],"answer":"Nädalavahetusel jalutame pargis, käime poes ja vahel kinos.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"A: Kas te peate oma peres sünnipäevi? / Kelle sünnipäeva te viimati pidasite?","options":[],"answer":"Jah, peame. Viimati pidasime minu tütre sünnipäeva. Ta sai kuueaastaseks.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"A: Mida te talle sünnipäevaks kinkisite?","options":[],"answer":"Me kinkisime talle jalgratta.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"B: Kas teil on vähe või palju sugulasi?","options":[],"answer":"Mul on palju sugulasi.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"B: Kellega sugulastest te kõige rohkem suhtlete? … emaga? … pojaga? … tädiga?","options":[],"answer":"Ma suhtlen kõige rohkem emaga. Me räägime telefonis iga päev.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"B: Kus teie sugulased elavad? / Kas keegi teie sugulastest elab välismaal? Kus?","options":[],"answer":"Minu sugulased elavad Eestis ja välismaal. Minu vend elab Saksamaal.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"B: Kui sageli te oma sugulastega kohtute?","options":[],"answer":"Ma kohtun sugulastega umbes kord kuus.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"B: Mida te koos oma sugulastega teete?","options":[],"answer":"Me sööme koos, räägime juttu ja käime looduses.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"B: Kas te tähistate koos oma sugulastega jõulupühi? Kelle juures te jõulupühade ajal olete?","options":[],"answer":"Jah, tähistame. Jõulude ajal oleme vanemate juures maal.","explanation_en":"Example answer; reuse the question's verb in your answer."},{"type":"open","q":"B: Mida sugulased teile tavaliselt kingivad?","options":[],"answer":"Sugulased kingivad mulle tavaliselt raamatuid või sokke.","explanation_en":"Example answer; reuse the question's verb in your answer."}],"model_answer_et":"Ma elan koos perega. Meie peres on neli inimest: mina, minu naine, poeg ja tütar. Minu naine töötab haiglas, ta on õde. Poeg käib koolis ja tütar käib lasteaias. Nädalavahetusel jalutame koos pargis ja vahel käime kinos. Me peame alati sünnipäevi. Viimati pidasime tütre sünnipäeva ja kinkisime talle jalgratta.","checklist_en":["Speak in full sentences (subject + verb), not single words.","Keep talking: 4–6 sentences per picture or answer; add a reason with 'sest' or an opinion with 'Ma arvan, et ...'.","Pronunciation and grammar may have mistakes at A2, but the listener must understand you.","Note (harno.ee): speech is recorded and rated by two raters independently.","Answer the exact question (Kus? -> place; Kui sageli? -> frequency: iga päev, kord nädalas, kord kuus).","Past tense for 'viimati' questions: pidasime, kinkisime.","-ga for 'with whom': emaga, vennaga, sugulastega."]},{"section":"rääkimine","title":"Ideekaart A: SÖÖK – Küsige oma kaaslaselt, mida ta sööb ja millal","booklet_ref":"Rääkimine, teine ülesanne (A), lk 16 (ideekaart testitavatele)","instructions_et":"SÖÖK. Küsige oma kaaslaselt, mida ta sööb ja millal. Märksõnad: Kerge eine, Soe toit, Magustoit.","instructions_en":"Idea card 'Food': ask your partner what they eat and when; then answer their questions. Pictures on the card – Kerge eine (light meal): porridge with jam, fried egg, small open sandwiches. Soe toit (hot meal): rice with meat sauce and salad, soup, pizza. Magustoit (dessert): pancakes with berries, ice cream, a basket of fruit.","converted_to_reading":false,"text_et":"Kerge eine: puder moosiga, praemuna, võileivad\nSoe toit: riis liha ja salatiga, supp, pitsa\nMagustoit: pannkoogid marjadega, jäätis, puuviljad","items":[{"type":"open","q":"Küsi: Mida sa hommikul sööd?","options":[],"answer":"Hommikul söön tavaliselt putru moosiga või võileiba.","explanation_en":"Ask with 'Mida' + verb; answer with food in partitive (putru, võileiba)."},{"type":"open","q":"Küsi: Kas sa sööd hommikul muna?","options":[],"answer":"Jah, söön. Ma söön praemuna kaks korda nädalas.","explanation_en":"'Kas' questions need jah/ei + full sentence."},{"type":"open","q":"Küsi: Millal sa sööd sooja toitu?","options":[],"answer":"Sooja toitu söön lõunal ja õhtul.","explanation_en":"Time words: hommikul, lõunal, õhtul, pärast tööd."},{"type":"open","q":"Küsi: Kas sulle meeldib supp?","options":[],"answer":"Jah, mulle meeldib supp. Talvel söön suppi peaaegu iga päev.","explanation_en":"'Mulle meeldib' + nominative; 'söön suppi' partitive."},{"type":"open","q":"Küsi: Kui tihti sa sööd pitsat?","options":[],"answer":"Pitsat söön harva, umbes kord kuus.","explanation_en":"Frequency: iga päev, kord nädalas, harva, mitte kunagi."},{"type":"open","q":"Küsi: Mis on sinu lemmikmagustoit?","options":[],"answer":"Minu lemmikmagustoit on pannkoogid marjadega.","explanation_en":"'lemmik-' + noun = favourite ..."},{"type":"open","q":"Küsi: Kas sa sööd jäätist ka talvel?","options":[],"answer":"Ei, talvel ma jäätist ei söö. Söön jäätist ainult suvel.","explanation_en":"Negative: 'ma ei söö' + partitive (jäätist)."}],"model_answer_et":"– Mida sa hommikul sööd?\n– Hommikul söön tavaliselt putru moosiga. Vahel söön ka praemuna ja võileiba.\n– Millal sa sööd sooja toitu?\n– Sooja toitu söön lõunal tööl ja õhtul kodus. Mulle meeldib riis liha ja salatiga.\n– Kas sa sööd tihti pitsat?\n– Ei, pitsat söön harva, umbes kord kuus.\n– Mis on sinu lemmikmagustoit?\n– Minu lemmikmagustoit on pannkoogid marjadega. Suvel söön ka palju jäätist.","checklist_en":["Speak in full sentences (subject + verb), not single words.","Keep talking: 4–6 sentences per picture or answer; add a reason with 'sest' or an opinion with 'Ma arvan, et ...'.","Pronunciation and grammar may have mistakes at A2, but the listener must understand you.","Note (harno.ee): speech is recorded and rated by two raters independently.","You ASK questions (one partner asks, the other answers, then roles swap).","Use all three keywords on the card: kerge eine, soe toit, magustoit.","Question words: Mida? Millal? Kui tihti? Kas...? Mis on sinu lemmik...?","Food after 'söön' in partitive: putru, suppi, pitsat, jäätist, puuvilju."]},{"section":"rääkimine","title":"Ideekaart B: IGAPÄEVANE ELU – Küsige, mida kaaslane teeb ja kui tihti","booklet_ref":"Rääkimine, teine ülesanne (B), lk 17 (ideekaart testitavatele)","instructions_et":"IGAPÄEVANE ELU. Küsige oma kaaslaselt, mida ta oma igapäevases elus teeb ja kui tihti. Märksõnad: Kauplus, Teenindusasutus, Tervisekeskus.","instructions_en":"Idea card 'Daily life': ask your partner what they do in daily life and how often; then answer. Pictures – Kauplus (shop): supermarket checkout, clothes shop, household appliances store. Teenindusasutus (service): petrol station, barber/hairdresser, cash machine (ATM). Tervisekeskus (health centre): pharmacy, dentist, massage/physiotherapy.","converted_to_reading":false,"text_et":"Kauplus: toidupood (kassa), riidepood, kodumasinate pood\nTeenindusasutus: tankla, juuksur, pangaautomaat\nTervisekeskus: apteek, hambaarst, massöör","items":[{"type":"open","q":"Küsi: Kui tihti sa käid toidupoes?","options":[],"answer":"Ma käin toidupoes kaks-kolm korda nädalas.","explanation_en":"'käima + -s': käin poes, juuksuris, apteegis."},{"type":"open","q":"Küsi: Kas sa ostad riideid poest või internetist?","options":[],"answer":"Ma ostan riideid tavaliselt poest, vahel ka internetist.","explanation_en":"'poest' (from the shop) uses -st."},{"type":"open","q":"Küsi: Kui tihti sa käid juuksuris?","options":[],"answer":"Ma käin juuksuris umbes kord kuus.","explanation_en":"Frequency phrase: kord kuus = once a month."},{"type":"open","q":"Küsi: Kas sul on auto? Kui tihti sa tangid?","options":[],"answer":"Jah, mul on auto. Ma käin tanklas kord nädalas.","explanation_en":"'tankla' = petrol station; 'tankima' = to refuel."},{"type":"open","q":"Küsi: Kas sa võtad raha pangaautomaadist?","options":[],"answer":"Ei, ma maksan tavaliselt kaardiga. Sularaha võtan harva.","explanation_en":"'kaardiga' = by card; 'sularaha' = cash."},{"type":"open","q":"Küsi: Millal sa viimati käisid hambaarsti juures?","options":[],"answer":"Ma käisin hambaarsti juures eelmisel kuul.","explanation_en":"Past tense for 'viimati': käisin. 'arsti juures' = at the doctor's."},{"type":"open","q":"Küsi: Kas sa käid tihti apteegis?","options":[],"answer":"Ei, ma käin apteegis harva, ainult siis, kui olen haige.","explanation_en":"'harva' = rarely; 'kui olen haige' = when I am ill."}],"model_answer_et":"– Kui tihti sa käid toidupoes?\n– Ma käin toidupoes kaks-kolm korda nädalas, tavaliselt pärast tööd.\n– Kui tihti sa käid juuksuris?\n– Juuksuris käin umbes kord kuus.\n– Kas sa käid tihti tanklas?\n– Jah, mul on auto. Ma käin tanklas kord nädalas.\n– Millal sa viimati käisid hambaarsti juures?\n– Eelmisel kuul. Ma käin hambaarsti juures kaks korda aastas.\n– Kas sa käid tihti apteegis?\n– Ei, apteegis käin harva, ainult siis, kui olen haige.","checklist_en":["Speak in full sentences (subject + verb), not single words.","Keep talking: 4–6 sentences per picture or answer; add a reason with 'sest' or an opinion with 'Ma arvan, et ...'.","Pronunciation and grammar may have mistakes at A2, but the listener must understand you.","Note (harno.ee): speech is recorded and rated by two raters independently.","Every answer has a frequency: iga päev, kord nädalas, kaks korda kuus, harva, mitte kunagi.","Cover all three keywords: kauplus, teenindusasutus, tervisekeskus.","Place cases: käin poes / juuksuris / apteegis (-s), hambaarsti juures."]}],"exam_format":{"exam":"Eesti keele A2-taseme eksam (Harno / Haridus- ja Noorteamet)","sources":{"booklet":"A2 konsultatsioonivihik (A2 exam consultation booklet, 18 pages, PDF fillable version)","harno_page":"https://harno.ee/eesti-keele-tasemeeksamid","harno_page_fetched":"2026-10-25","note":"The booklet itself contains only the practice tasks and the answer key. It does NOT state minutes, points or the pass rule. Those values come from the official Harno A2 page and are marked with source='harno.ee' below. Re-check that page before exam day in case rules changed."},"parts":[{"order":1,"name_et":"Kirjutamine","name_en":"Writing","minutes":30,"points":20,"minutes_points_source":"harno.ee (not stated in booklet)","written_or_oral":"written (first part of the written session)","task_types":[{"name":"Esimene ülesanne: andmete kirjutamine visiitkaardilt (info ülekanne)","description_en":"You see a business card (variant A: a person; variant B: an institution) and write a text answering 4 given questions using the card's data. Minimum 25 words. Booklet variant A: 'Kellena ta töötab? Kus ta töötab? Millal ta töötab? Kuidas saab temaga kontakti?'. Variant B: 'Mis asutus see on? Kus see asub? Mida seal teha saab? Kuidas saab kontakti?'","tip":"Use EVERY piece of data on the card (name, company/salon name, street + house number, floor, city, days, hours, phone/e-mail) in full sentences, and count your words: at least 25. Spell out abbreviations: T, K, N = teisipäeval, kolmapäeval, neljapäeval; E–R = esmaspäevast reedeni; III korrus = kolmandal korrusel."},{"name":"Teine ülesanne (A): teade (sõnum, kutse)","description_en":"Write a short message/note/invitation for a situation, covering 3 given bullet points. Minimum 30 words. Booklet example: you found your friend's wallet at your home.","tip":"Start with a greeting (Tere, Mari!), answer all three bullets in order, end with a sign-off and name. Simple present-tense sentences are enough."},{"name":"Teine ülesanne (B): kirjeldus etteantud teemal (loovtekst)","description_en":"Write a short description on a given topic covering 3 bullet points. Minimum 30 words. Booklet example: 'Minu nädalavahetus' (Kus käite? Mida teete? Kellega kohtute?).","tip":"One or two sentences per bullet, plus an opening and closing sentence. Aim for 40-60 words so you are safely above the minimum."}],"notes":["Harno (official sample-performance PDF): a writing task is well done when the text is on topic, of the right length, covers the given content points, and the reader can understand what the writer wants to say. Some spelling/grammar mistakes are tolerated at A2 if meaning is clear.","Uncertain: whether variant A or B (or both) appears in a given exam. The Harno page says the second task is 'either a) a message/short note/invitation or b) a creative text'. The booklet prints both A and B variants of each task for practice."]},{"order":2,"name_et":"Kuulamine","name_en":"Listening","minutes":30,"points":20,"minutes_points_source":"harno.ee (not stated in booklet)","written_or_oral":"written","item_count_in_booklet":25,"task_types":[{"name":"Esimene ülesanne (küsimused 1–7): valikvastused piltide/numbrite/sõnadega","description_en":"7 short monologues (about 20–30 s each: announcements, instructions, short descriptions). For each question tick one of three options A/B/C shown as pictures, numbers or words.","tip":"Read the question and the three options before the audio starts and guess what words you will hear (numbers, clothes, food). Distractor numbers are often mentioned too; listen for the one that answers the exact question."},{"name":"Teine ülesanne (küsimused 8–13): õige/vale","description_en":"A dialogue/interview of about 2 minutes (booklet topic: 'Uus kodu'). Decide if each of 6 statements is true (A, õige) or false (B, vale).","tip":"The statements follow the order of the dialogue. Watch for small changes: a different number, a different vehicle, 'sageli' vs 'harva'."},{"name":"Kolmas ülesanne (küsimused 14–19): lühivastus","description_en":"A monologue of 1–1.5 minutes (booklet topic: 'Laevareis', an announcement on a ship). Write a 1–2 word answer (word or number) to each of 6 questions.","tip":"Write only the key word or number. Harno: any answer with the right content counts; spelling/grammar mistakes that do not block understanding are not penalised (the key accepts e.g. '4' and 'neli', 'kell 13' and 'kell üks')."},{"name":"Neljas ülesanne (küsimused 20–25): sobitamine","description_en":"A dialogue of 2–2.5 minutes about personal life (booklet: what someone does on each day of the week). Match each item (weekday) to one of the lettered options (activities A–K). Two options are left over.","tip":"Before listening, read all options aloud in your head. Cross out each option once used; two are distractors and may even be mentioned and rejected in the dialogue."}],"notes":["Harno: each listening text is played twice, and there is a pause before each task to read the questions.","The booklet has no transcripts. The official audio for the consultation listening test is linked on the Harno page as 'A2 kuulamistest': https://projektid.edu.ee/download/attachments/343705183/A2_Konsultatsioon_kuulamistest_veebruar2024_3.mp3?version=1&modificationDate=1771319710518&api=v2 (about 59 MB, dated February 2024). UNCERTAIN: not verified that this recording matches every question in this booklet version (the PDF also contains hidden alternative versions of listening questions 6 and 7)."]},{"order":3,"name_et":"Lugemine","name_en":"Reading","minutes":50,"points":20,"minutes_points_source":"harno.ee (not stated in booklet)","written_or_oral":"written","item_count_in_booklet":30,"task_types":[{"name":"Esimene ülesanne (1–6): sobiv repliik","description_en":"6 everyday phrases/situations; choose the fitting reply from 3 options (A/B/C). Tests everyday phrases and politeness (etiquette).","tip":"Learn fixed reactions: Palju õnne! (congratulations), Jõudu! (good luck with work), Pole viga (not bad), Kohe tulen! (coming right away), Olgu nii (OK, let it be so), Aitäh! (thanks)."},{"name":"Teine ülesanne (7–12): lause ja tekst","description_en":"Read three short texts (A, B, C; about 60 words each: ads, notices, newspaper items) and decide which text each of 6 sentences matches.","tip":"Underline key facts in each text (free/expensive, new/old, morning/evening). The sentences paraphrase the text, so look for synonyms (tasuta = ei pea maksma, soodne = odav)."},{"name":"Kolmas ülesanne (13–17): teade + selgitus või koht + kirjeldus","description_en":"Match 5 public notices (signs, warnings) to their explanations, OR 5 place names to descriptions (A–I). Two options are left over.","tip":"Know common signs: Tasuta sissepääs, Libe põrand, Tee on suletud, Palun vaikust, Riidehoid, Ooteruum, Autokool."},{"name":"Neljas ülesanne (18–22): tekst + valikvastused","description_en":"Read a text of about 150 words and complete 5 sentences by choosing A, B or C.","tip":"Make a small table while reading (e.g. room / what is wrong / what to do). Read negative questions carefully ('Kollast värvi EI OLE ...')."},{"name":"Viies ülesanne (23–30): lünktekst","description_en":"A personal letter of about 100 words with 8 gaps; choose the word for each gap from 3 options (A, B, C).","tip":"Check grammar AND meaning: fixed phrases like 'jäin haigeks', 'kõrge palavik', 'mul on halb olla', 'näen sind varsti'."}],"notes":["Harno: the reading test has five tasks and lasts 50 minutes."]},{"order":4,"name_et":"Rääkimine","name_en":"Speaking","minutes":15,"points":20,"minutes_points_source":"harno.ee (approx. 15 min; not stated in booklet)","written_or_oral":"oral (separate session, usually two candidates + examiner)","task_types":[{"name":"Sissejuhatav vestlus","description_en":"Short warm-up: the examiner asks each candidate to introduce themselves and answer a few questions (from harno.ee; not in the booklet).","tip":"Prepare 5-6 sentences about yourself: name, where you are from, where you live, work/study, family, hobbies."},{"name":"Esimene ülesanne, I osa: pildi kirjeldamine","description_en":"Each candidate describes one picture. The pictures share a topic (booklet: 'Pere ja sugulased', two family photos) but differ. About 6–7 minutes for parts I and II together.","tip":"Use a fixed plan: Pildil on... (who) / Nad on... (where) / Nad teevad... (what) / Neil on seljas... (clothes) / Ma arvan, et... (your guess, mood)."},{"name":"Esimene ülesanne, II osa: küsimused teemal","description_en":"The examiner picks questions from a topic sheet (booklet: 'Pere ja sugulased', question sets A and B) and each candidate answers.","tip":"Answer in 2-3 full sentences, not one word. Reuse the verb from the question: 'Kus teie sugulased elavad?' -> 'Minu sugulased elavad...'."},{"name":"Teine ülesanne: ideekaart (küsimine ja vastamine)","description_en":"Candidates get an idea card with keywords and pictures (booklet: A 'Söök' - ask what your partner eats and when; B 'Igapäevane elu' - ask what your partner does in daily life and how often). One asks, the other answers, then roles swap with a new card. About 5–6 minutes.","tip":"You must ASK questions too. Practise question words: Mida? Millal? Kui tihti? Kus? Kellega? Kas sa...? Miks? Use frequency words in answers: iga päev, kord nädalas, mõnikord, harva, mitte kunagi."}],"notes":["Harno: speech is recorded and each candidate is rated independently by two raters. If the number of candidates is odd, a candidate talks with the examiner."]}],"pass_rule":"Total 80 points (each of the four parts gives 20). The exam is passed with at least 60% of the total, i.e. at least 48/80, AND no part may score 0 points. Source: harno.ee A2 section ('Kokku on A2-taseme testi eest võimalik saada 80 punkti. Iga osa annab 20 punkti. Eksam loetakse sooritatuks, kui testitav on kogunud vähemalt 60% võimalikust punktisummast, kusjuures ühegi osa tulemus ei tohi olla 0 punkti.'). Not stated in the booklet.","notes":["Order and timing on the day: the written part is kirjutamine, kuulamine, lugemine (30 + 30 + 50 min per harno.ee); speaking (about 15 min) is a separate oral part.","Booklet answers are given as letters for multiple-choice tasks; in the exam you tick boxes (✓) for listening task 1, listening task 2, reading task 1 and reading task 4, and write letters/words in boxes or gaps for the others.","Every task starts with a worked example marked 0 ('Näidis on tähistatud 0-ga').","UNCERTAIN: how raw item scores (25 listening items, 30 reading items) are converted to 20 points per part. For B1, Harno says raw points are weighted; for A2 the page only says each part gives 20 points.","Retake rule (harno.ee, all levels): a candidate who scores below 45% of the total, or misses the exam without good reason, can retake only after six months.","Topics listed by harno.ee for A2: personal data, house and home, surroundings, daily life, free time and entertainment, travel, relations with other people, health and body care, education, shopping, food and drink, services, places, language, weather.","The PDF of the filled booklet contains hidden alternative text layers (not visible when printed): listening Q6 'Mis kell väljub Tallinna-Moskva rong?' and Q7 'Mille kilo maksab 70 senti?', and a reading task 3 variant B (place names). Only reading 3B can be verified without audio; it is included in exam_tasks.json as an extra task."]},"research":{"exam":{"date_note":"Next A2 exam per harno.ee: Saturday 07.11.2026, start 10:00 sharp (late arrivals not admitted; arrive 15-20 min early). Written part first (one sitting, ~1h50), speaking starts 15-20 min after the written part, candidates called in list order (can mean a long wait).","parts":[{"name_et":"Kirjutamine","name_en":"Writing","order":1,"minutes":30,"points":20,"tasks":["Task 1 (esimene ülesanne): 'Andmete kirjutamine visiitkaardilt' - turn a business card into full sentences answering 4 prompts. Person card: Kellena ta töötab? Kus ta töötab? Millal ta töötab? Kuidas saab temaga kontakti? Institution card: Mis asutus see on? Kus see asub? Mida seal teha saab? Kuidas saab kontakti? Minimum 25 words.","Task 2 (teine ülesanne), one of: (A) 'Teade (sõnum, kutse)' - a note/short message/invitation covering 3 bullet points, e.g. you found a friend's wallet: where, what it looks like, how they get it back; or (B) 'Kirjeldus etteantud teemal' / loovtekst - short description on a given topic covering 3 keyword prompts, e.g. 'Minu nädalavahetus' (Kus käite? Mida teete? Kellega kohtute?) or 'Minu tööpäev' (koht? aeg? tegevused?). Minimum 30 words.","Assessment (Harno sooritusnäidis): task is well done if the text is on topic, of the right length, covers ALL given content points (sisupunktid/märksõnad) and the reader can understand what you mean. A2 texts may contain spelling and basic grammar mistakes as long as they don't (or only occasionally) hinder understanding; sentences joined with simple 'ja' are acceptable.","Write legibly in handwritten letters (kirjatähed) with a black/blue pen; pencil or pen-over-pencil invalidates the work; no correction fluid/tape; cross out whole words to correct."],"tips":["Count words: aim for 35-45 words in task 1 and 40-60 in task 2 - under the minimum costs points, a little over is safe.","Answer every bullet point with at least one full sentence; use the bullet as a skeleton (one bullet = 1-2 sentences).","For the business card: convert abbreviations into words - E-K = esmaspäevast kolmapäevani, L = laupäeval, 11-18 = kella üheteistkümnest kuueni (or kella 11-st 18-ni). Use 'Ta töötab fotograafina' (essive -na), 'Ta töötab fotostuudios ...', 'Temaga saab kontakti e-posti teel / telefonil ...'.","For the message: open with a greeting, close with a sign-off and name; for the description use simple present tense and 'Ma ...' sentences.","Reuse words from the prompt (they are spelled correctly for you) rather than inventing risky vocabulary.","Spend ~10 min on task 1 and ~15 min on task 2, leaving 5 min to re-read for verb endings (ma -n, sa -d, ta -b, me -me, te -te, nad -vad).","Write the draft on scratch paper only if time allows - drafts are not graded."]},{"name_et":"Kuulamine","name_en":"Listening","order":2,"minutes":30,"points":20,"tasks":["4 tasks, 25 questions in the 2026 consultation booklet; every recording is played TWICE, with a pause beforehand to read the questions.","Task 1: 7 questions - short monologues (~20-30 s each), pick one of 3 pictures/numbers/words (e.g. speed limit, how many times a day to take medicine, train departure time 20.05/20.15/20.25, grams of cheese).","Task 2: 6 true/false (õige/vale) statements about a dialogue of ~2 min (e.g. 'Uus kodu').","Task 3: 6 questions answered with 1-2 words or a number, monologue ~1-1.5 min (e.g. ferry announcement 'Laevareis': how many hours, what can you eat, what time the children's show starts).","Task 4: 6 matching items, dialogue ~2-2.5 min (e.g. weekdays matched to activities A-K, two options left over)."],"tips":["Use the pre-listening pause to underline question words (Kui palju? Mis kell? Mitu korda?) and predict the word type you need (number, time, food, place).","Drill numbers, clock times, weekdays, months, prices and grams - they carry many points in task 1 and 3.","First listening: answer what you can; second listening: confirm and fill gaps. Never leave a blank - guess.","In task 3 the spelling does not need to be perfect if the word is recognisable; numbers may be written as digits (the answer key accepts '13', 'kell 13', 'kolmteist') (spelling tolerance unverified).","Watch for distractors: speakers often mention a wrong option first and then correct it ('ei, mitte kolmapäeval, vaid neljapäeval').","Choose a seat close to the speaker/audio player if seating is free (ERR test-taker tip, B1 exam).","Write multiple-choice letters as clear CAPITALS; marking two answers = wrong."]},{"name_et":"Lugemine","name_en":"Reading","order":3,"minutes":50,"points":20,"tasks":["5 tasks, 30 questions in the 2026 consultation booklet.","Task 1: 6 questions - everyday phrases/politeness formulas; pick the right reply of 3 (e.g. 'Kuidas sul läheb?' -> 'Pole viga.'; 'Mul sündis eile tütar.' -> 'Palju õnne!'; 'Mul on praegu palju tööd.' -> 'Jõudu!').","Task 2: 3 short texts (~60 words each, A/B/C) and 6 statements - match each statement to a text.","Task 3: 5 signs/notices (e.g. 'Libe põrand!', 'Tasuta sissepääs!', 'Tee on suletud!') matched to explanations A-I, two left over.","Task 4: ~150-word text, 5 three-option multiple-choice questions (e.g. 'Tiina üürib korteri').","Task 5: personal letter ~100 words with 8 gaps (cloze), 3 word options each - tests grammar and collocations (e.g. 'jäin haigeks', 'kõrge palavik')."],"tips":["Do task 1 and 3 fast (they are phrase/sign recognition) and bank time for tasks 2, 4 and 5.","Learn the fixed politeness reactions: Palju õnne! / Jõudu! / Pole viga / Pole tänu väärt / Head aega! / Jätku leiba! / Terviseks! / Kahju!","In matching tasks, cross off used options; in task 2 a statement often paraphrases a sentence with synonyms (tasuta = ei pea maksma, soodne = odav).","In the cloze (task 5) read the whole sentence before choosing; check fixed expressions: haigeks jääma, palavik on kõrge, arsti juurde minema, kodus voodis lamama.","Reading is the longest section (50 min) and you may leave early - use spare time to re-check, especially negations (ei, mitte, keelatud).","Transfer answers clearly; no blanks."]},{"name_et":"Rääkimine","name_en":"Speaking","order":4,"minutes":15,"points":20,"tasks":["Intro: examiner leads a short warm-up - introduce yourself and answer a few general questions (name, where you live, work, family, hobbies).","Task 1, part I (~6-7 min total for task 1): each candidate describes ONE picture; both pictures are on the same topic but differ (sample topic 'Pere ja sugulased': family reading in bed / family meal outdoors).","Task 1, part II: the examiner picks questions from a topic sheet (teemaleht) and you answer them, e.g. Kas te elate üksinda või koos perega? Kui suur on teie pere? Mida te koos perega nädalavahetusel teete? Kui sageli te oma sugulastega kohtute?","Task 2 (~5-6 min): idea card (ideekaart) with keywords and pictures. One candidate asks the partner topic-related questions, the partner answers; then roles swap with a new card. Sample cards: 'SÖÖK - Küsige oma kaaslaselt, mida ta sööb ja millal' (kerge eine / soe toit / magustoit); 'IGAPÄEVANE ELU - Küsige ... mida ta oma igapäevases elus teeb ja kui tihti' (kaupluses / teenindusasutuses / tervisekeskuses).","Recorded; each candidate scored independently by two raters."],"tips":["Prepare a 45-60 s memorised self-introduction (name, origin, how long in Estonia, where you live, job, family, hobby, why learning Estonian).","Picture description formula: Pildil on ... (who) -> Nad on ... (where: köögis, aias, toas) -> Nad ... (what they do: söövad, loevad, naeravad) -> Ilm/aeg ... -> Minu arvates ... (feeling/opinion) -> link to yourself ('Minu pere ka ...'). Aim for 6-8 sentences.","Answer in full sentences and add one extra detail (because/when): 'Jah, ma elan koos perega, sest ...'. One-word answers score low.","Task 2 is about ASKING: drill question words (Mis? Mida? Kes? Kus? Kuhu? Kust? Millal? Kui tihti? Kui palju? Miks? Kellega? Kas ...?) and ask one question per picture on the card, using 'teie/sa' forms correctly ('Mida sa hommikul sööd?', 'Kui tihti sa käid juuksuris?').","React to your partner's answers ('Aa, huvitav!', 'Mina ka.', 'Tõesti?') - interaction counts.","If you don't understand, ask: 'Vabandust, kas te saaksite korrata?' - asking is better than silence.","Don't over-extend; if the examiner moves on, stop (ERR test-taker tip). Speak slowly and clearly; it is recorded.","With an odd number of candidates the examiner may act as your partner."]}],"total_points":80,"pass_rule":"Pass = at least 60% of the total, i.e. 48/80 points, AND no single skill may score 0 (no other per-part minimum). Per-skill bands shown on the certificate: 0% and 1-49% = does not meet requirements; 50-59% nõrk (weak); 60-75% rahuldav; 76-90% hea; 91-100% väga hea. Each part is worth 20 points (the 25 listening and 30 reading items are presumably converted to 20 points - conversion method (unverified)).","allowed":"No aids: dictionaries, textbooks, phones, smartwatches, any watch (must be removed), headphones are forbidden. Bring a valid ID card, passport or residence permit (driving licence NOT accepted). Write with black or blue ink/ballpoint pen only - no pencil, no erasable or glitter ink, no correction tape; multiple-choice answers in clear capital letters. Scratch paper (mustand) is provided but not graded. Toilet only escorted, between booklet 1 and 2 of the written part.","speaking_format":"Pairs: one examiner (eksamineerija) + two candidates; odd number -> one candidate with the examiner. ~15 minutes total: introductory chat, Task 1 (picture description + answering examiner's topic questions, ~6-7 min), Task 2 (asking/answering questions with an idea card, roles swap, ~5-6 min). Recorded; two independent raters. No preparation time is mentioned officially.","topics":["isikuandmed (personal information)","maja ja kodu (house and home)","ümbruskond (surroundings/neighbourhood)","igapäevaelu (daily life)","vaba aeg ja meelelahutus (free time and entertainment)","reisimine (travel)","suhted teiste inimestega (relationships, family, relatives)","tervis ja kehahooldus (health and body care)","haridus (education)","sisseostude tegemine (shopping)","söök ja jook (food and drink)","teenused (services)","kohad (places)","keel (language)","ilm (weather)"],"results_and_retakes":"Exam is free of charge. Results within 40 days (by e-mail/letter, EIS, eesti.ee; not by phone). Certificate is electronic only. Appeal within 30 days. If you score below 45% or skip without valid reason, you must wait 6 months before retaking; you can cancel registration up to 4 working days before without penalty. Exams are held quarterly; you can only register for an exam whose registration is open, and not before previous results are published."},"strategy":[{"title":"Know the pass maths","tip":"You need 48/80 overall, no zero part. Writing and speaking are the most 'trainable' in 12 days with templates - secure ~14-16/20 there, so listening/reading only need ~9-10/20 each."},{"title":"Cover every content point","tip":"Harno's writing criteria reward relevance, length and covering all given keywords. A short, simple text that answers every bullet beats a long, fancy text that skips one."},{"title":"Respect minimum word counts","tip":"25 words (business card) and 30 words (message/description) are minimums - count them. Target ~40 and ~50."},{"title":"Template the business card task","tip":"It is formulaic: '[Nimi] töötab [amet]-na. Ta töötab [koht]-s, mis asub [aadress]. Ta töötab esmaspäevast reedeni kella ... kuni ... Temaga saab kontakti telefoni või e-posti teel: ...' Practise with 5-6 different cards."},{"title":"Use the exam's own words","tip":"Prompts and pictures give you correctly spelled vocabulary - recycle it in your answer."},{"title":"Simple grammar, done right","tip":"Use present tense, short SVO sentences, and connectors ja/aga/sest/siis/kui. Check verb endings and that the subject matches the verb (A2 raters note these as typical errors)."},{"title":"Listening: read first, listen twice","tip":"Use pauses to read questions and predict answers; first play = answer, second play = verify. Never leave blanks."},{"title":"Numbers and time are free points","tip":"Drill numbers 1-1000, prices, grams, clock times (kell pool kaks = 1:30!), weekdays and months - Estonian 'pool kaks' means half past one."},{"title":"Reading: bank time","tip":"50 minutes is generous. Do the phrase and sign tasks quickly, spend time on the 150-word text and the cloze letter, then re-check negations."},{"title":"Speaking: prepare chunks, not scripts","tip":"Memorise a self-intro, a picture-description frame, and 2-3 sentences about each of the 15 topics. Speak in full sentences, add 'sest ...' to extend."},{"title":"Speaking task 2 is about asking","tip":"Practise forming questions from keywords on picture cards (food, daily life, shopping, services, health). Ask, listen, react, ask a follow-up."},{"title":"Never stay silent","tip":"Use fillers and repair phrases ('Hmm, las ma mõtlen...', 'Kuidas seda öelda...', 'Kas te saaksite korrata?'). Silence is what loses points."},{"title":"Exam-day logistics","tip":"Arrive 15-20 min before 10:00 (late = not admitted). Bring ID card/passport/residence permit, 2-3 blue/black pens, water and a snack - speaking may be hours later. Remove watch, phone off."},{"title":"Use the official materials","tip":"Do the full Harno konsultatsioonivihik + MP3 under timed conditions; it is a mini mock exam with an answer key (page 'Ülesannete vastused')."},{"title":"Handwriting matters","tip":"Unclear letters count as errors; write in clear handwritten letters, cross out whole words neatly, no correction tape."}],"phrase_bank":{"letter_openings":[{"et":"Tere, Mari!","en":"Hi, Mari! (informal)"},{"et":"Hei, Kalle!","en":"Hey, Kalle! (very informal)"},{"et":"Kallis Anna!","en":"Dear Anna!"},{"et":"Lugupeetud härra Tamm!","en":"Dear Mr Tamm (formal)"},{"et":"Lugupeetud proua Kask!","en":"Dear Mrs Kask (formal)"},{"et":"Head kolleegid!","en":"Dear colleagues"},{"et":"Kirjutan sulle, sest ...","en":"I'm writing to you because ..."},{"et":"Tahan sind kutsuda ...","en":"I want to invite you ..."},{"et":"Aitäh kirja eest!","en":"Thanks for the letter!"}],"letter_closings":[{"et":"Kohtumiseni!","en":"See you!"},{"et":"Näeme!","en":"See you!"},{"et":"Head päeva!","en":"Have a nice day!"},{"et":"Parimate soovidega, [nimi]","en":"Best wishes, [name]"},{"et":"Lugupidamisega, ...","en":"Respectfully / Yours sincerely (formal)"},{"et":"Tervitades, ...","en":"Greetings / Regards"},{"et":"Kallistusi!","en":"Hugs!"},{"et":"Ootan vastust!","en":"I'm waiting for your reply!"},{"et":"Helista mulle!","en":"Call me!"},{"et":"Ole tubli!","en":"Take care! (used in the official sample letter)"}],"speaking_fillers":[{"et":"Hmm, las ma mõtlen ...","en":"Hmm, let me think ..."},{"et":"Noh ...","en":"Well ..."},{"et":"Tähendab ...","en":"I mean ..."},{"et":"Kuidas seda öelda ...","en":"How to say it ..."},{"et":"Ma arvan, et ...","en":"I think that ..."},{"et":"Tavaliselt ...","en":"Usually ..."},{"et":"Näiteks ...","en":"For example ..."},{"et":"Pildil on ...","en":"In the picture there is/are ..."},{"et":"Pildi keskel / vasakul / paremal ...","en":"In the middle / on the left / on the right of the picture ..."},{"et":"Tundub, et nad ...","en":"It seems that they ..."},{"et":"Aa, huvitav!","en":"Oh, interesting!"},{"et":"Mina ka.","en":"Me too."},{"et":"Tõesti?","en":"Really?"}],"asking_for_help":[{"et":"Vabandust, ma ei saanud aru.","en":"Sorry, I didn't understand."},{"et":"Kas te saaksite korrata?","en":"Could you repeat?"},{"et":"Palun korrake.","en":"Please repeat."},{"et":"Kas te saaksite aeglasemalt rääkida?","en":"Could you speak more slowly?"},{"et":"Mida see sõna tähendab?","en":"What does this word mean?"},{"et":"Ma ei tea, kuidas seda eesti keeles öelda.","en":"I don't know how to say this in Estonian."},{"et":"Kas te mõtlete, et ...?","en":"Do you mean that ...?"},{"et":"Kas ma võin alustada?","en":"May I start?"}],"opinions":[{"et":"Minu arvates ...","en":"In my opinion ..."},{"et":"Ma arvan, et ...","en":"I think that ..."},{"et":"Mulle meeldib ..., sest ...","en":"I like ..., because ..."},{"et":"Mulle ei meeldi ...","en":"I don't like ..."},{"et":"Mulle meeldib rohkem ...","en":"I prefer ..."},{"et":"See on hea / huvitav / tore / igav.","en":"It's good / interesting / nice / boring."},{"et":"Ma olen nõus.","en":"I agree."},{"et":"Ma ei ole nõus.","en":"I don't agree."},{"et":"Minu jaoks on oluline ...","en":"For me ... is important."}],"connectors":[{"et":"ja","en":"and"},{"et":"aga","en":"but"},{"et":"sest / kuna","en":"because"},{"et":"siis","en":"then"},{"et":"pärast seda","en":"after that"},{"et":"kõigepealt","en":"first of all"},{"et":"lõpuks","en":"finally"},{"et":"kui","en":"when / if"},{"et":"et","en":"that"},{"et":"või","en":"or"},{"et":"ka","en":"also"},{"et":"näiteks","en":"for example"},{"et":"seepärast","en":"therefore"},{"et":"tavaliselt","en":"usually"},{"et":"vahel / mõnikord","en":"sometimes"},{"et":"tihti / sageli","en":"often"}]},"twelve_day_plan":[{"day":1,"focus":"Diagnose with the official mock","tasks":["Do the Harno A2 konsultatsioonivihik listening (MP3) + reading timed (30 + 50 min) and check with the answer key","Write both writing tasks from the booklet (30 min) and count words","Note weak areas; read the A2 page on harno.ee (structure, topics)"]},{"day":2,"focus":"Writing task 1 (business card) + numbers/time","tasks":["Learn the business-card template; write 3 cards (person + institution), >=35 words each","Drill weekdays (E T K N R L P), months, clock times, phone numbers, addresses","Keeleklikk: lessons on numbers/time"]},{"day":3,"focus":"Speaking intro + topics 1-5","tasks":["Write and memorise a 60-s self-introduction; record yourself","Prepare 3-4 sentences each: isikuandmed, maja ja kodu, ümbruskond, igapäevaelu, vaba aeg","Listening: official task 1 sample + MP3"]},{"day":4,"focus":"Writing task 2 (message/invitation)","tasks":["Memorise opening/closing formulas","Write 3 messages: invitation to birthday, cancelling a meeting, found item / borrowed item","Reading: official task 1 (phrases) + task 3 (signs); learn politeness reactions"]},{"day":5,"focus":"Picture description","tasks":["Learn the picture frame (Pildil on... / Nad on... / Nad teevad... / Minu arvates...)","Describe 5 photos aloud on topics family, food, shopping, health, travel - 1 min each, record","Listening: official task 2 (true/false) + MP3"]},{"day":6,"focus":"Speaking topics 6-10 + question forms","tasks":["Prepare sentences for reisimine, suhted, tervis, haridus, sisseostud","Drill question words; write 10 questions for the 'SÖÖK' and 'IGAPÄEVANE ELU' idea cards","Writing: one description text 'Minu tööpäev' (compare with Harno sooritusnäidis)"]},{"day":7,"focus":"Mid-point mini mock","tasks":["Timed: writing 30 min + listening (official samples) + reading 50 min","Self-check against answer key and word counts","Speaking: simulate with a partner/tutor or record yourself answering teemaleht questions"]},{"day":8,"focus":"Speaking topics 11-15 + idea cards","tasks":["Prepare söök ja jook, teenused, kohad, keel, ilm","Make your own idea cards (3 keywords + pictures) and practise asking/answering with a partner (language café, tutor, friend)","Listening: official task 3 (short answers) + MP3; drill spelling of common nouns"]},{"day":9,"focus":"Reading depth + grammar for the cloze","tasks":["Official reading tasks 2, 4, 5; EIS public e-tasks / web.meis.ee/testest A2 test","Revise: verb endings, ma/sa/ta forms, place cases (-s, -sse, -st, -l, -le, -lt), essive -na","Write 1 invitation + 1 description, check endings"]},{"day":10,"focus":"Listening intensity","tasks":["Official task 4 (matching) + replay all official MP3s","Listen to slow/simple Estonian audio (Keeleklikk dialogues; ERR/Vikerraadio clips) 20-30 min","Speaking: full 15-min simulation including intro, picture, questions, idea card"]},{"day":11,"focus":"Full mock under exam conditions","tasks":["Redo the whole konsultatsioonivihik in one sitting at 10:00 with pen, no phone (1h50)","Then a 15-min recorded speaking mock","Fix the 3 most common errors you see"]},{"day":12,"focus":"Light review and logistics","tasks":["Re-read phrase bank, templates, self-intro and question words","Write one last business card and one message (no new material)","Prepare ID/passport/residence permit, 2-3 blue/black pens, water, snack; check exam location and the e-mailed exam notice; sleep early"]}],"resources":[{"name":"Harno - Eesti keele tasemeeksamid (A2 section)","url":"https://harno.ee/eesti-keele-tasemeeksamid","why":"Official structure, durations, points, topics, dates, locations and all sample tasks with MP3s"},{"name":"Harno - English page on Estonian language proficiency exams","url":"https://harno.ee/en/examinations-tests-and-studies/examinations-tests-and-certificates/estonian-language-proficiency","why":"Official rules in English (registration, fees, results, retakes)"},{"name":"A2 konsultatsioonivihik 2026 (PDF)","url":"https://harno.ee/sites/default/files/documents/2026-01/A2_konsultatsioonivihik.pdf","why":"Full mini mock test (writing, listening, reading, speaking) with answer key"},{"name":"A2 konsultatsioonivihik - fillable on computer (PDF)","url":"https://harno.ee/sites/default/files/documents/2026-01/A2_konsultatsioonivihik%20arvutis%20t%C3%A4itmiseks%20%281%29.pdf","why":"Same booklet, typeable"},{"name":"A2 consultation listening test (MP3)","url":"https://projektid.edu.ee/download/attachments/343705183/A2_Konsultatsioon_kuulamistest_veebruar2024_3.mp3?version=1&modificationDate=1771319710518&api=v2","why":"Audio for the booklet listening section"},{"name":"A2 writing performance samples with comments (sooritusnäidis)","url":"https://harno.ee/sites/default/files/documents/2021-07/A2-taseme-sooritusnaidis.pdf","why":"Shows what a passing A2 text looks like and how it's judged"},{"name":"A2 w
