%20tasemeeksami%20sooritajale%202025.pdf","why":"Official exam-day rules: ID, pens, forbidden aids, timings, results, retakes"},{"name":"Keeleklikk","url":"https://www.keeleklikk.ee/","why":"Free state e-course A0-A2 with English interface (keeletee.ee redirects here; Keeletee = B1) (free: unverified on page)"},{"name":"EIS - public e-tasks","url":"https://eis.harno.ee/","why":"Official public e-tests; also where results/certificate appear"},{"name":"Web-based Estonian level tests (MEIS testest)","url":"http://web.meis.ee/testest/","why":"Linked by Harno for self-testing"},{"name":"Integration Foundation (Integratsiooni Sihtasutus)","url":"https://www.integratsioon.ee/","why":"Free language cafés / Estonian Language Houses (Tallinn, Narva) for speaking practice (current schedules unverified)"},{"name":"Algaja keelekasutaja. A2-taseme eesti keele oskus (2008)","url":"https://harno.ee/sites/default/files/documents/2021-06/Algaja-keelekasutaja.-A2-tase.pdf","why":"Official A2 level description incl. vocabulary/grammar scope"}],"sources":[{"title":"Harno - Eesti keele tasemeeksamid (A2 structure, topics, scoring, dates)","url":"https://harno.ee/eesti-keele-tasemeeksamid"},{"title":"Harno - Estonian language proficiency (English)","url":"https://harno.ee/en/examinations-tests-and-studies/examinations-tests-and-certificates/estonian-language-proficiency"},{"title":"Harno - Teabeleht tasemeeksami sooritajale 2025","url":"https://harno.ee/sites/default/files/documents/2025-01/Teabeleht%20tasemeeksami%20sooritajale%202025.pdf"},{"title":"Harno - A2 konsultatsioonivihik 2026","url":"https://harno.ee/sites/default/files/documents/2026-01/A2_konsultatsioonivihik.pdf"},{"title":"Harno - A2 kirjutamisosa sooritusnäidised","url":"https://harno.ee/sites/default/files/documents/2021-07/A2-taseme-sooritusnaidis.pdf"},{"title":"Harno - A2 rääkimine, esimene ülesanne","url":"https://harno.ee/sites/default/files/documents/2021-06/A2_R%C3%A4%C3%A4kimine_Esimene_%C3%BClesanne.pdf"},{"title":"Harno - A2 rääkimine, teine ülesanne","url":"https://harno.ee/sites/default/files/documents/2021-06/A2_R%C3%A4%C3%A4kimine_Teine_%C3%BClesamnne.pdf"},{"title":"Harno - A2 kirjutamine, esimene ülesanne","url":"https://harno.ee/sites/default/files/documents/2021-06/A2_Kirjutamine_Esimene_%C3%BClesanne2.pdf"},{"title":"Harno - A2 kirjutamine, teine ülesanne A","url":"https://harno.ee/sites/default/files/documents/2021-06/A2_Kirjutamine_Teine_%C3%BClesanne_A_teade.%20l%C3%BChis%C3%B5num.pdf"},{"title":"ERR News - B1 Estonian exam, Part 2 (test-taker experience; B1 but same exam-day format)","url":"https://news.err.ee/880613/b1-estonian-exam-part-2-coordination-conversation-and-coffee"},{"title":"Keeleklikk","url":"https://www.keeleklikk.ee/"}],"notes":["Today is 2026-10-25; the next official A2 exam date on harno.ee is 07.11.2026 (13 days away). The 12-day plan ends the day before.","Third-party sites (open-exam-prep.com) claim a 35% retake threshold; the official Harno teabeleht says 45% - use 45%.","Officially there is no stated preparation time for A2 speaking tasks.","No Reddit threads could be fetched (reddit.com is blocked for the crawler); no ERR 'Uudised lihtsas eesti keeles' / slow-news programme could be confirmed - omitted from resources.","Phrase bank, 12-day plan and most strategy tips are compiled/derived from the official task formats, not quoted from examiners (unverified as examiner advice)."]},"extra":{"speaking_topics":[{"et":"Isikuandmed","en":"Personal details","q":["Mis su nimi on?","Kust sa pärit oled?","Kus sa praegu elad?","Mis keeli sa räägid?","Mis on sinu amet?","Kui kaua sa oled Eestis elanud?","Miks sa elad Eestis?"],"starters":["Minu nimi on …","Ma olen pärit …st.","Ma elan …s.","Ma räägin inglise ja … keelt.","Ma töötan …na.","Ma olen Eestis elanud … aastat."]},{"et":"Maja ja kodu","en":"House and home","q":["Kas sa elad majas või korteris?","Mitmendal korrusel sa elad?","Mitu tuba sinu korteris on?","Milline on sinu lemmiktuba? Miks?","Mis mööbel on sinu elutoas?","Kas sinu kodus on rõdu või aed?","Mis sulle sinu kodus meeldib?"],"starters":["Ma elan korteris / majas.","Ma elan kolmandal korrusel.","Minu korteris on kaks tuba ja köök.","Elutoas on diivan, laud ja kaks tooli.","Mulle meeldib minu köök, sest see on suur ja valge."]},{"et":"Ümbruskond","en":"Neighbourhood","q":["Milline on sinu kodukoht?","Mis on sinu kodu lähedal?","Kas sinu kodu lähedal on pood?","Kuidas sa tööle või kooli lähed?","Kas sinu kodukoht on vaikne või lärmakas?"],"starters":["Minu kodu lähedal on pood, park ja bussipeatus.","Ma lähen tööle bussiga / jalgsi / autoga.","Minu kodukoht on vaikne ja roheline."]},{"et":"Igapäevaelu","en":"Daily life","q":["Mis kell sa hommikul ärkad?","Mida sa hommikul sööd?","Mis kell sa tööle lähed?","Milline on sinu tavaline tööpäev?","Mida sa õhtul teed?","Mis kell sa magama lähed?"],"starters":["Ma ärkan kell seitse.","Hommikul ma joon kohvi ja söön putru.","Ma töötan kella üheksast viieni.","Õhtul ma teen süüa ja vaatan telekat.","Ma lähen magama kell üksteist."]},{"et":"Vaba aeg ja meelelahutus","en":"Free time","q":["Mida sa vabal ajal teed?","Mida sa nädalavahetusel teed?","Kas sa teed sporti?","Kas sa käid kinos või teatris?","Mis muusika sulle meeldib?","Mis on sinu hobi?"],"starters":["Vabal ajal ma loen raamatuid ja jalutan.","Nädalavahetusel ma käin sõpradega kohvikus.","Ma käin kaks korda nädalas jõusaalis.","Mulle meeldib rokkmuusika."]},{"et":"Reisimine","en":"Travel","q":["Kus sa oled reisinud?","Kuhu sa tahaksid reisida?","Kuidas sulle meeldib reisida: lennuki, rongi või autoga?","Kas sa oled Eestis reisinud?","Milline Eesti linn sulle meeldib?"],"starters":["Ma olen käinud Soomes ja Lätis.","Ma tahaksin sõita Itaaliasse.","Mulle meeldib reisida rongiga, sest see on mugav.","Mulle meeldib Tartu, sest see on ilus ja rahulik linn."]},{"et":"Suhted teiste inimestega","en":"Family and relationships","q":["Räägi oma perest.","Kas sul on vendi või õdesid?","Kus sinu vanemad elavad?","Kes on sinu parim sõber?","Kuidas sa oma sünnipäeva tähistad?"],"starters":["Minu pere on väike: mina, mu naine/mees ja meie poeg.","Mul on üks vend ja üks õde.","Minu vanemad elavad …s.","Minu parim sõber on …. Ta on rõõmsameelne ja abivalmis."]},{"et":"Tervis ja kehahooldus","en":"Health","q":["Kuidas su tervis on?","Mida sa teed, kui sa oled haige?","Kui tihti sa käid arsti juures?","Mida sa teed, et terve olla?","Mis sul valutab, kui sa oled haige?"],"starters":["Mu tervis on hea.","Kui ma olen haige, ma jään koju ja joon teed.","Ma käin arsti juures üks kord aastas.","Ma söön palju puuvilju ja teen sporti."]},{"et":"Haridus","en":"Education","q":["Kus sa oled õppinud?","Mida sa ülikoolis õppisid?","Kus sa eesti keelt õpid?","Mis on eesti keeles kõige raskem?","Kas sulle meeldib õppida?"],"starters":["Ma õppisin ülikoolis …","Ma õpin eesti keelt keelekursusel.","Eesti keeles on käänded rasked."]},{"et":"Sisseostude tegemine","en":"Shopping","q":["Kus sa tavaliselt toitu ostad?","Mida sa poest ostad?","Kas sa ostad riideid internetist?","Mis on sinu lemmikpood?","Mis kell sinu lähedal olev pood avatakse?"],"starters":["Ma ostan toitu supermarketist.","Ma ostan leiba, piima, juustu ja puuvilju.","Pood on avatud kaheksast kümneni."]},{"et":"Söök ja jook","en":"Food and drink","q":["Mis on sinu lemmiktoit?","Mida sa hommikusöögiks sööd?","Kas sa oskad süüa teha?","Kas sa käid tihti restoranis?","Mida sa meelsasti jood?"],"starters":["Minu lemmiktoit on …","Hommikusöögiks ma söön võileiba.","Ma oskan teha suppi.","Ma käin restoranis üks kord kuus."]},{"et":"Teenused","en":"Services","q":["Kas sa käid juuksuris? Kui tihti?","Kuidas sa arsti juurde aja paned?","Kas sa kasutad internetipanka?","Kus on sinu kodu lähedal pakiautomaat?"],"starters":["Ma käin juuksuris üks kord kuus.","Ma helistan perearstile ja panen aja.","Pakiautomaat on poe kõrval."]},{"et":"Kohad","en":"Places","q":["Mis on sinu lemmikkoht oma linnas?","Kus sa tavaliselt sõpradega kohtud?","Mis const norm = s => String(s ?? "").toLowerCase().replace(/[.,!?;:"“”„«»()\[\]]/g, " ").replace(/[–—-]/g, "-").replace(/\s+/g, " ").trim();

  const g = norm(given);

  const list = answers.filter(a => a != null && String(a).trim() !== "");

  if (list.some(a => flat(a) === flat(given))) return "almost";
  return "wrong";
}
const altsOf = et => {
  const base = String(et).replace(/\([^)]*\)/g, "");
  const parts = base.split(/\s*[\/;]\s*/).map(s => s.trim()).filter(Boolean);
  return parts.length ? parts : [String(et)];

const words = s => (String(s).trim().match(/[\p{L}\p{N}][\p{L}\p{N}'’.-]*/gu) || []).length;

document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) say(b.dataset.say) });

/* ---------- state: browser copy for speed, account copy (db) to sync devices ---------- */

}

function aiError(e) {
  const A = window.Anthropic;
  if (A && e instanceof A.AuthenticationError) return "Your API key was rejected. Check it in Settings.";
  if (A && e instanceof A.PermissionDeniedError) return "This API key isn't allowed to use Claude Opus 5.5. Check your Anthropic Console.";

    return "The AI check didn't complete. Try again in a moment.";

AFTER.grammar = () => { const i = $("#g-in"); if (i && !V.g.res) i.focus() };
function gramCheck(skip) {
  const g = V.g;
  if (g.res) { g.i++; g.res = null; g.given = ""; render(); return }
  const d = g.queue[g.i]; const given = skip ? "" : $("#g-in").value;
  g.given = given; g.res = skip ? "wrong" : grade(given, [d.answer].concat(d.accept || []));
  const st = S.gram[g.id] = S.gram[g.id] || { r: 0, w: 0 };
  if (g.res !== "wrong") { g.right++; st.r++ } else { st.w++; addMistake("grammar", d.prompt, d.answer, given || "(skipped)", d.en || "") }
  save(); render();
}

function readCheck() {
  const r = V.r, s = READ_SETS.find(x => x.id === r.id);
  r.checked = true;
  let score = 0, scored = 0;
  s.items.forEach((q, k) => {
    const given = r.ans[k];
    if (q.options.length) {
      const ai = answerIndex(q); if (ai < 0) return; scored++;
      if (+given === ai && given !== undefined) score++; else addMistake("reading", `${s.title}: ${q.q}`, q.options[ai], given !== undefined ? q.options[+given] : "(no answer)", q.explanation_en || "");
    } else if (q.type === "gap" || q.type === "short") {
      scored++; if (grade(given || "", [q.answer].concat(q.accept || [])) !== "wrong") score++; else addMistake("reading", `${s.title}: ${q.q}`, q.answer, given || "(no answer)");
    }
  });
  if (scored) S.read[s.id] = Math.max(S.read[s.id] || 0, score / scored); else S.read[s.id] = S.read[s.id] ?? 1;
  save(); render();
}

async function writeAI() {
  const x = V.x, t = WRITE_TASKS.find(w => w.id === x.id);
  if (!sample || x.busy) return;
  x.busy = true; x.err = ""; render();
  const prompt = `You are an experienced examiner for the Estonian state A2 language exam (Harno). Assess a learner's answer to a writing task. The learner's native language is English; write all explanations in simple English.

TASK (Estonian): ${t.task}
${t.card ? "BUSINESS CARD: " + t.card.card.join(" | ") + "\n" : ""}CONTENT POINTS TO COVER: ${t.points.join("; ")}
MINIMUM WORDS: ${t.min}

LEARNER'S TEXT:
"""${x.text}"""

Harno A2 criteria: on topic, meets the word count, covers every content point, understandable; small A2-level grammar/spelling slips are tolerated.
Return ONLY JSON:
{"score": integer 0-10 (rough estimate of this task's quality against the criteria),
 "points": [{"point": "content point in English", "covered": true|false}],
 "errors": [{"wrong": "exact wrong fragment", "right": "corrected fragment", "why": "short English reason, name the case/rule"}] (max 8, most important first; only real errors),
 "corrected": "the learner's text with errors fixed, keeping their ideas and A2 simplicity",
 "tip": "one concrete tip in English"}`;
  try {
    const r = await sample(prompt, SCHEMA.writing, "medium");
    x.fb = r;
    S.writes.unshift({ id: t.id, title: t.title, text: x.text, score: r.score, corrected: r.corrected, t: Date.now() });
    S.writes = S.writes.slice(0, 30);
    (r.errors || []).slice(0, 5).forEach(er => addMistake("writing", `Fix: “${er.wrong}”`, er.right, er.wrong, er.why));
    save();
  } catch (e) { x.err = aiError(e) }
  x.busy = false; render();
}

const EXAMINER = topic => `You are a friendly examiner in the oral part of the Estonian state A2 language exam (Harno). Topic: "${topic.et}" (${topic.en}). Ask ONE short, simple A2-level question at a time in Estonian, like a real examiner (follow up naturally on the candidate's answers; vary question words). After each candidate answer, give brief feedback.
Reply ONLY with JSON: {"feedback": "1-2 short sentences in English on the candidate's last answer: praise or the main error (empty string for the first turn)", "corrected": "the candidate's last answer corrected in natural A2 Estonian, or empty if it was already correct or this is the first turn", "question": "your next question in Estonian", "question_en": "English translation of the question"}`;
async function chatTurn(userText) {
  const s = V.s; if (!sample || s.busy) return;
  s.busy = true; s.err = ""; render();
  const topic = TOPICS[s.chatTopic];
  if (userText != null) s.chat.push({ role: "user", content: userText, shown: userText });
  const msgs = [{ role: "user", content: "Alustame. (Start now with a greeting and your first question.)" }].concat(s.chat.map(m => ({ role: m.role, content: m.content })));
  try {
    const r = await sample(msgs, SCHEMA.examiner, "low", EXAMINER(topic));
    s.chat.push({ role: "assistant", content: JSON.stringify(r) });
    if (userText != null && r.corrected && norm(r.corrected) !== norm(userText)) { addMistake("speaking", r.feedback || "Speaking answer", r.corrected, userText); save() }
    s.draft = "";
  } catch (e) { s.err = aiError(e); if (userText != null) { s.chat.pop(); s.draft = userText } }
  s.busy = false; render();
  const c = $("#s-chat-in"); if (c) c.focus();
}
async function introAI() {
  const s = V.s; if (!sample || s.busy || !S.intro.trim()) return;
  s.busy = true; s.err = ""; render();
  try {
    s.introFb = await sample(`An English-speaking learner wrote a self-introduction to say aloud at the start of the Estonian A2 oral exam (Harno). Correct it and make it natural but keep it simple A2 Estonian, 6-9 short sentences, easy to memorise. Keep their personal facts.
TEXT: """${S.intro}"""
Return JSON: {"errors": [{"wrong": "...", "right": "...", "why": "short English reason"}] (max 8), "corrected": "full polished text", "tip": "one English tip, e.g. a sentence worth adding"}`, SCHEMA.intro, "medium");
  } catch (e) { s.err = aiError(e) }
  s.busy = false; render();
}

const KIND = { word: "Word", grammar: "Grammar", reading: "Reading", writing: "Writing", speaking: "Speaking" };
VIEWS.mistakes = () => {
  const m = V.m;
  if (m.drill) {
    const d = m.drill[m.i];
    if (!d) { m.drill = null; return VIEWS.mistakes() }
    return `<div class="row"><button class="btn ghost" data-act="m-stop">← Back to the list</button></div>
    <div class="card"><div class="progress"><span class="small muted num">${m.i + 1}/${m.drill.length}</span><div class="bar"><i style="width:${m.i / m.drill.length * 100}%"></i></div><span class="pill">${KIND[d.kind]}</span></div>
      <form class="stack" data-form="m-check"><p style="font-size:1.15rem"><b>${esc(d.prompt)}</b></p>${d.extra ? `<p class="small muted">${esc(d.extra)}</p>` : ""}
      <input type="text" id="m-in" class="${m.res || ""}" value="${esc(m.given)}" ${m.res ? "readonly" : ""} autocomplete="off" spellcheck="false" placeholder="Type the correct answer">
      ${m.res ? `<div class="fb ${m.res}">${m.res === "wrong" ? `Answer: <b>${esc(d.answer)}</b>. It stays on your list.` : "Correct, so it's off your list."}</div><button class="btn primary" type="button" data-act="m-next">Next</button>` : `${keysHtml()}<button class="btn primary">Check</button>`}

  }
  if (!S.mistakes.length) return `<div class="intro"><h2>Mistakes</h2></div><div class="card empty"><h3>No mistakes saved yet</h3><p>Anything you get wrong in Words, Grammar, Reading, Writing or Speaking lands here so you can drill it until it sticks.</p></div>`;
  return `<div class="intro"><h2>Mistakes</h2><p class="muted">Everything you got wrong, newest first. Drill them: a correct answer removes the item.</p></div>
  <div class="row"><button class="btn primary" data-act="m-drill">Drill ${Math.min(20, S.mistakes.length)} mistakes</button><button class="btn ghost" data-act="m-clear">${V.m.confirm ? "Tap again to clear all" : "Clear all"}</button></div>
  <div class="card"><div class="scroll"><table class="list"><thead><tr><th>Type</th><th>Question</th><th>Correct</th><th>You wrote</th></tr></thead><tbody>
  ${S.mistakes.slice(0, 120).map(x => `<tr><td><span class="pill">${KIND[x.kind] || x.kind}</span></td><td>${esc(x.prompt)}${x.extra ? `<div class="small muted">${esc(x.extra)}</div>` : ""}</td><td><b style="color:var(--good)">${esc(x.answer)}</b></td><td class="muted">${esc(x.given)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
};
function misCheck() {
  const m = V.m;
  if (m.res) { m.i++; m.res = null; m.given = ""; render(); return }
  const d = m.drill[m.i]; m.given = $("#m-in").value; m.res = grade(m.given, [d.answer]);
  if (m.res !== "wrong") { S.mistakes = S.mistakes.filter(x => x !== d && !(x.kind === d.kind && x.prompt === d.prompt)); save() }
  render();
}
AFTER.mistakes = () => { const i = $("#m-in"); if (i && !V.m.res) i.focus() };
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]")?.dataset.act; if (!a || !a.startsWith("m-")) return;
  if (a === "m-drill") { V.m = { drill: shuffle(S.mistakes.filter(x => x.answer)).slice(0, 20), i: 0, res: null, given: "" }; render() }
  if (a === "m-next") misCheck();
  if (a === "m-stop") { V.m.drill = null; render() }
  if (a === "m-clear") { if (V.m.confirm) { S.mistakes = []; V.m.confirm = false; save() } else V.m.confirm = true; render() }
});

async function testKey(key) {
  const st = V.set; st.busy = true; st.msg = ""; render();
  try {
    if (!window.Anthropic) throw { code: "sdk" };
    const c = new window.Anthropic({ apiKey: key, dangerouslyAllowBrowser: true, maxRetries: 0 });
    await c.messages.create({ model: MODEL, max_tokens: 16, output_config: { effort: "low" }, messages: [{ role: "user", content: "Say OK." }] });
    apiKey = key; try { localStorage.setItem(KEY_LS, key) } catch {}
    setupAI(); st.ok = true; st.msg = "Key works. AI feedback is on.";
  } catch (e) { st.ok = false; st.msg = e?.code === "sdk" ? "The Claude library hasn't loaded. Connect to the internet and reopen the app." : aiError(e) }
  st.busy = false; render();
}
