home. I now live almost in the countryside. My address is 19 Seene Street. This here is my house. The house has two floors: the first floor and the second floor. On the first floor there is a small entrance hall and a corridor. On the first floor there is also a living room, a study and a kitchen. On the second floor there is a big bedroom, a bathroom and a toilet. I also have a beautiful balcony and a big cellar. In the cellar there is my home cinema, a gym and a library. And I have a garden behind the house! In the garden there are big apple trees. In autumn I make apple wine. I'm so happy! My house is very big – 140 square metres including the garage! My house is white, but the roof is brown. Near my house there is a park, a grocery store and a lake.","questions":[{"q":"Mis tänaval ta elab?","options":["Kirsi tänaval","Seene tänaval","Marja tänaval","Pargi tänaval"],"answer":1},{"q":"Mitu korrust majas on?","options":["üks","kaks","kolm","kümme"],"answer":1},{"q":"Mitmendal korrusel on magamistuba?","options":["esimesel","teisel","keldris","kolmandal"],"answer":1},{"q":"Mis on keldris?","options":["köök ja WC","kodukino, jõusaal ja raamatukogu","garaaž","magamistuba"],"answer":1},{"q":"Mis värvi on maja katus?","options":["valge","punane","pruun","must"],"answer":2},{"q":"Kui suur on maja koos garaažiga?","options":["40 ruutmeetrit","104 ruutmeetrit","140 ruutmeetrit","90 ruutmeetrit"],"answer":2}]},{"lesson":4,"title":"Üürile anda: uus korter kesklinnas","text_et":"ÜÜRILE ANDA UUS KORTER KESKLINNAS\nKorter asub kesklinnas, lähedal on kauplus, kool, lasteaed ja turg. Lähedal on ka meri. Korteris on magamistuba, elutuba ja väike köök.\nHind: 350 eurot kuus. Korrus: 5. Üldpind: 34 m². Ehitusaasta: 2020. Tubade arv: 2 (magamistuba ja elutuba). WC ja vannituba koos, köök 8 m².\nLisainfo: parkimine tasuta, digi-TV, internet, elektripliit, trepikoda lukus, dušš, uus mööbel, lifti ei ole.","text_en":"NEW FLAT IN THE CITY CENTRE FOR RENT\nThe flat is in the city centre; nearby there is a shop, a school, a kindergarten and a market. The sea is also nearby. The flat has a bedroom, a living room and a small kitchen.\nPrice: 350 euros a month. Floor: 5. Total area: 34 m². Year built: 2020. Number of rooms: 2 (bedroom and living room). Toilet and bathroom together, kitchen 8 m².\nAdditional info: free parking, digital TV, internet, electric stove, locked stairwell, shower, new furniture, no lift.","questions":[{"q":"Kui suur on üür?","options":["250 eurot kuus","350 eurot kuus","700 eurot kuus","34 eurot kuus"],"answer":1},{"q":"Mitmendal korrusel korter on?","options":["esimesel","kolmandal","viiendal","kaheksandal"],"answer":2},{"q":"Mitu tuba on korteris?","options":["üks","kaks","kolm","neli"],"answer":1},{"q":"Kas majas on lift?","options":["Jah, on küll.","Ei, ei ole."],"answer":1},{"q":"Mis on korteri lähedal?","options":["kaubanduskeskus ja kino","kauplus, kool, lasteaed ja turg","lennujaam","mets ja järv"],"answer":1}]},{"lesson":4,"title":"Üürile anda: ilus korter vanas majas","text_et":"ÜÜRILE ANDA ILUS KORTER VANAS MAJAS\nKorter asub äärelinnas, kesklinna umbes 45 minutit autoga, lähedal on uus kaubanduskeskus, kino, park, mänguväljak. Korteris on 4 tuba, moodne köök ja suur esik, vannituba, WC.\nHind: 700 eurot kuus. Korrus: 1. Üldpind: 90 m². Ehitusaasta: 1920. Tubade arv: 4 (2 magamistuba, elutuba, töötuba). WC ja vannituba eraldi.\nLisainfo: digi-TV, internet, gaasipliit, trepikoda lukus, vann ja dušikabiin, naaber on sõbralik.","text_en":"BEAUTIFUL FLAT IN AN OLD BUILDING FOR RENT\nThe flat is in the suburbs, about 45 minutes by car to the city centre; nearby there is a new shopping centre, a cinema, a park and a playground. The flat has 4 rooms, a modern kitchen and a big entrance hall, bathroom and toilet.\nPrice: 700 euros a month. Floor: 1. Total area: 90 m². Year built: 1920. Number of rooms: 4 (2 bedrooms, living room, study). Toilet and bathroom separate.\nAdditional info: digital TV, internet, gas stove, locked stairwell, bathtub and shower cabin, the neighbour is friendly.","questions":[{"q":"Kus korter asub?","options":["kesklinnas","äärelinnas","vanalinnas","maal"],"answer":1},{"q":"Mis on ehitusaasta?","options":["2020","1933","1920","1990"],"answer":2},{"q":"Mul on kolm last ja koer. Kumb korter sobib mulle?","options":["korter kesklinnas","korter vanas majas"],"answer":1},{"q":"Ma töötan kodukontoris. Kumb korter sobib mulle?","options":["korter kesklinnas","korter vanas majas"],"answer":1},{"q":"Mis pliit on köögis?","options":["elektripliit","gaasipliit"],"answer":1}]},{"lesson":5,"title":"Loe ja joonista! (a room)","text_et":"Toa keskel on väike voodi. Nurgas on suur kass. Seinal on vana foto. Akna all on jalgratas. Põrandal on ilus vaip. Laes on moodne lamp. Ukse juures on nagi.","text_en":"In the middle of the room there is a small bed. In the corner there is a big cat. On the wall there is an old photo. Under the window there is a bicycle. On the floor there is a beautiful rug. On the ceiling there is a modern lamp. By the door there is a coat rack.","questions":[{"q":"Mis on toa keskel?","options":["suur kass","väike voodi","jalgratas","nagi"],"answer":1},{"q":"Kus on kass?","options":["voodi peal","nurgas","akna all","ukse juures"],"answer":1},{"q":"Mis on akna all?","options":["vaip","foto","jalgratas","lamp"],"answer":2},{"q":"Kus on nagi?","options":["seinal","laes","ukse juures","toa keskel"],"answer":2},{"q":"What does 'Laes on moodne lamp' mean?","options":["There is a modern lamp on the ceiling.","There is a modern lamp on the floor.","There is an old lamp on the wall.","The lamp is next to the bed."],"answer":0}]},{"lesson":6,"title":"Horoskoop (four signs)","text_et":"JÄÄR (21. märts – 20. aprill). Jäär on väga ambitsioonikas ja töökas. Ta on alati tööl ja talle väga meeldib töötada. Kodus on jäär mõnikord laisk, talle ei meeldi koristada. Ta võiks töötada poliitikuna.\nSÕNN (21. aprill – 21. mai). Sõnn on väga sportlik ja sõbralik. Talle meeldib trennis käia ja puuvilja süüa. Sõnn on tugev nagu Kalevipoeg! Ta võiks töötada personaaltreenerina.\nVÄHK (22. juuni – 23. juuli). Vähk on vaikne ja intelligentne. Talle meeldib raamatuid lugeda ja üksinda kunstinäitusel käia. Ta võiks töötada professorina.\nKALJUKITS (22. detsember – 20. jaanuar). Kaljukits on julge ja temperamentne. Talle meeldib jalgpalli mängida ja pärast saunas käia. Talle meeldib ka talvel meres ujuda. Ta võiks töötada kaskadöörina.","text_en":"ARIES (21 March – 20 April). Aries is very ambitious and hard-working. He/She is always at work and really likes working. At home Aries is sometimes lazy and doesn't like cleaning. He/She could work as a politician.\nTAURUS (21 April – 21 May). Taurus is very sporty and friendly. He/She likes going to training and eating fruit. Taurus is as strong as Kalevipoeg! He/She could work as a personal trainer.\nCANCER (22 June – 23 July). Cancer is quiet and intelligent. He/She likes reading books and going to art exhibitions alone. He/She could work as a professor.\nCAPRICORN (22 December – 20 January). Capricorn is brave and temperamental. He/She likes playing football and going to the sauna afterwards. He/She also likes swimming in the sea in winter. He/She could work as a stuntman.","questions":[{"q":"Missugune on jäär kodus?","options":["töökas","mõnikord laisk","väga sportlik","vaikne"],"answer":1},{"q":"Mis sõnnile meeldib?","options":["raamatuid lugeda","trennis käia ja puuvilja süüa","jalgpalli mängida","koristada"],"answer":1},{"q":"Missugune on vähk?","options":["julge ja temperamentne","vaikne ja intelligentne","sportlik ja sõbralik","ambitsioonikas ja töökas"],"answer":1},{"q":"Kes võiks töötada kaskadöörina?","options":["jäär","sõnn","vähk","kaljukits"],"answer":3},{"q":"Millal meeldib kaljukitsele meres ujuda?","options":["suvel","talvel","kevadel","sügisel"],"answer":1}]},{"lesson":7,"title":"Kas sa oled abielus? (listening dialogue; gaps reconstructed)","text_et":"Triinu: Kas sa oled abielus?\nPaul: Jah, olen küll.\nTriinu: Mis su naise nimi on?\nPaul: Janne.\nTriinu: Päriselt? See on väga ilus nimi! Kas te olete õnnelikud?\nPaul: Jah! Me oleme väga õnnelikud. Kas sina oled abielus?\nTriinu: Ei, ei ole. Aga mul on poiss-sõber juba pool aastat. Me elame koos.\nPaul: Mis su poiss-sõbra nimi on?\nTriinu: Tead, tema nimi on ka Janne.\nPaul: Janne? Aga Janne on ju naise nimi.\nTriinu: Ma tean. Aga tema on mees. Minu Janne on soomlane.\nPaul: Huvitav!","text_en":"Triinu: Are you married?\nPaul: Yes, I am.\nTriinu: What's your wife's name?\nPaul: Janne.\nTriinu: Really? That's a very beautiful name! Are you happy?\nPaul: Yes! We are very happy. Are you married?\nTriinu: No, I'm not. But I've had a boyfriend for half a year already. We live together.\nPaul: What's your boyfriend's name?\nTriinu: You know, his name is Janne too.\nPaul: Janne? But Janne is a woman's name.\nTriinu: I know. But he is a man. My Janne is a Finn.\nPaul: Interesting!","questions":[{"q":"Kas Paul on abielus?","options":["Jah, on küll.","Ei, ei ole."],"answer":0},{"q":"Mis on Pauli naise nimi?","options":["Jaanika","Janne","Triinu","Janek"],"answer":1},{"q":"Kas Triinu on abielus?","options":["Jah, on küll.","Ei, ei ole."],"answer":1},{"q":"Kui kaua on Triinul poiss-sõber?","options":["üks aasta","pool aastat","kaks aastat","üks kuu"],"answer":1},{"q":"Mis rahvusest on Triinu poiss-sõber?","options":["eestlane","lätlane","soomlane","venelane"],"answer":2}]},{"lesson":7,"title":"Rollikaardid: Indrek, Karin ja Jaanus","text_et":"Minu nimi on Indrek. Ma olen 45 aastat vana. Ma elan Tallinnas. Minu aadress on Marja tänav 17. Mul on kaks tütart ja üks poeg. Ma olen abielus. Ma töötan haiglas, olen arst ja minu naine on meditsiiniõde.\n\nMina olen Karin. Ma olen 12 aastat vana. Ma käin koolis. Mul on üks õde, tema on 8 aastat vana, ja mul on üks vend. Minu vend õpib Tartu Ülikoolis. Ta elab Tartus. Minu ema on meditsiiniõde. Minu isa on arst.\n\nMina olen Jaanus. Ma olen 19 aastat vana. Ma elan praegu Tartus, aga ma olen pärit Tallinnast. Tallinnas elavad minu vanemad ja kaks õde. Minu isa on arst ja minu ema on meditsiiniõde. Mina õpin Tartu Ülikoolis füüsikat.","text_en":"My name is Indrek. I am 45 years old. I live in Tallinn. My address is 17 Marja Street. I have two daughters and one son. I am married. I work in a hospital, I'm a doctor and my wife is a nurse.\n\nI am Karin. I am 12 years old. I go to school. I have one sister, she is 8 years old, and I have one brother. My brother studies at the University of Tartu. He lives in Tartu. My mother is a nurse. My father is a doctor.\n\nI am Jaanus. I am 19 years old. I live in Tartu now, but I'm from Tallinn. My parents and two sisters live in Tallinn. My father is a doctor and my mother is a nurse. I study physics at the University of Tartu.","questions":[{"q":"Mitu last on Indrekul?","options":["kaks","kolm","neli","üks"],"answer":1},{"q":"Kus Indrek töötab?","options":["koolis","ülikoolis","haiglas","poes"],"answer":2},{"q":"Kui vana on Karini õde?","options":["8 aastat","12 aastat","19 aastat","45 aastat"],"answer":0},{"q":"Mida Jaanus õpib?","options":["eesti keelt","füüsikat","meditsiini","muusikat"],"answer":1},{"q":"Kes on Jaanuse isa?","options":["Indrek","Karin","Tarmo","Leo"],"answer":0}]},{"lesson":8,"title":"Mida sa tavaliselt iseseisvuspäeval teed?","text_et":"Eesti iseseisvuspäeval ma ei tööta ja tavaliselt ma olen kodus. Ma ärkan vara ja lähen hommikul Toompeale. Ma laulan seal Eesti hümni. Käin kohvikus ja söön hernesuppi. Siis ma jalutan linnas ja vaatan paraadi. Siis ma sõidan bussiga koju. Käin toidupoes ja ostan süüa. Kodus teen süüa. Ma ei korista, sest on pidupäev! Pärastlõunal kuulan natuke klassikalist muusikat, istun arvutis ja loen uudiseid. Võib-olla magan natuke. Õhtul vaatan televiisorit ja kuulan presidendi kõnet. Joon šampust ja söön kiluvõileiba. Helistan emale ja soovin: „Head vabariigi aastapäeva!”","text_en":"On Estonian Independence Day I don't work and usually I'm at home. I wake up early and in the morning I go to Toompea. There I sing the Estonian anthem. I go to a café and eat pea soup. Then I walk around town and watch the parade. Then I go home by bus. I go to the grocery store and buy food. At home I cook. I don't clean, because it's a holiday! In the afternoon I listen to a little classical music, sit at the computer and read the news. Maybe I sleep a little. In the evening I watch TV and listen to the president's speech. I drink champagne and eat a sprat sandwich. I call my mother and wish her 'Happy anniversary of the Republic!'","questions":[{"q":"Kuhu ta hommikul läheb?","options":["tööle","Toompeale","toidupoodi","emale külla"],"answer":1},{"q":"Mida ta kohvikus sööb?","options":["kiluvõileiba","hernesuppi","jäätist","kooki"],"answer":1},{"q":"Miks ta ei korista?","options":["Ta on väsinud.","Ta on haige.","On pidupäev.","Ta ei ole kodus."],"answer":2},{"q":"Mida ta õhtul kuulab?","options":["presidendi kõnet","rokkmuusikat","raadiot","emat"],"answer":0},{"q":"Kellele ta helistab?","options":["sõbrale","kolleegile","emale","vennale"],"answer":2}]},{"lesson":8,"title":"Meie pere traditsioonid","text_et":"Sünnipäeva hommikul me helistame emale. Sünnipäeva hommikul me laulame emale sünnipäevalaulu. Sünnipäeva õhtul läheme emale külla. Sünnipäeval kingime emale lilled. Sünnipäeval kirjutame kolleegile sünnipäevakaardi. Jõulude ajal saadame vanaemale jõulukaardi. Jõulude ajal soovime emale ja isale „Häid pühi!”.","text_en":"On the morning of the birthday we call mother. On the morning of the birthday we sing mother a birthday song. On the evening of the birthday we go to visit mother. On the birthday we give mother flowers. On a birthday we write a colleague a birthday card. At Christmas we send grandmother a Christmas card. At Christmas we wish mother and father 'Happy holidays!'.","questions":[{"q":"Kellele nad saadavad jõulukaardi?","options":["emale","vanaemale","kolleegile","isale"],"answer":1},{"q":"Mida nad kingivad emale sünnipäeval?","options":["šokolaadi","raamatu","lilled","jõulukaardi"],"answer":2},{"q":"Mida nad soovivad jõulude ajal?","options":["Palju õnne!","Head reisi!","Häid pühi!","Head isu!"],"answer":2},{"q":"Millal nad lähevad emale külla?","options":["sünnipäeva hommikul","sünnipäeva õhtul","jõulude ajal","nädalavahetusel"],"answer":1}]},{"lesson":9,"title":"Loe! Leia õige pilt! (descriptions)","text_et":"A. Tal on habe ja vuntsid ja tal on prillid. Ta on kiilakas.\nB. Tal on pruunid silmad ja lühikesed tumedad juuksed. Tal on prillid.\nC. Tal on sinised silmad ja lühikesed hallid juuksed. Tal on vuntsid, habe ja prillid.\nD. Tal on hallid silmad ja lühikesed lokkis hallid juuksed. Tal on prillid.\nE. Tal on pruunid silmad ja lühikesed tumedad juuksed. Tal on ainult vuntsid.\nG. Tal on pruunid silmad ja tumedad poolpikad väga lokkis juuksed.\nH. Tal on sinised silmad ja pikad punased lokkis juuksed.\nI. Tal on helepruunid silmad ja pikad helepruunid juuksed. Tal on tukk ja hobusesaba.","text_en":"A. This person has a beard and a moustache and wears glasses. He is bald.\nB. This person has brown eyes and short dark hair and wears glasses.\nC. This person has blue eyes and short grey hair, a moustache, a beard and glasses.\nD. This person has grey eyes and short curly grey hair and wears glasses.\nE. This person has brown eyes and short dark hair, and only a moustache.\nG. This person has brown eyes and dark, medium-length, very curly hair.\nH. This person has blue eyes and long red curly hair.\nI. This person has light brown eyes and long light brown hair, with a fringe and a ponytail.","questions":[{"q":"Kes on kiilakas?","options":["A","B","D","H"],"answer":0},{"q":"Kellel on pikad punased lokkis juuksed?","options":["D","G","H","I"],"answer":2},{"q":"Kellel on tukk ja hobusesaba?","options":["C","E","G","I"],"answer":3},{"q":"Mis värvi silmad on C-l?","options":["pruunid","sinised","hallid","rohelised"],"answer":1},{"q":"What does 'Tal on ainult vuntsid' mean?","options":["He only has a beard.","He only has a moustache.","He only has glasses.","He has no hair."],"answer":1}]},{"lesson":10,"title":"Kliendikaart (listening dialogue; gaps partly reconstructed)","text_et":"Klient: Tere!\nTeenindaja: Tere! Kas teil kliendikaart on?\nKlient: Ei, ei ole.\nTeenindaja: Kas te soovite kliendikaarti?\nKlient: Võib-olla. Kui palju see maksab?\nTeenindaja: See on tasuta.\nKlient: Väga hea! Siis muidugi soovin.\nTeenindaja: Täitke palun see ankeet!\nKlient: Oi, ma ei näe. Mu prillid on kodus.\nTeenindaja: Pole midagi! Siia kirjutage oma eesnimi! Siia kirjutage perekonnanimi! Ja siia kirjutage palun e-posti aadress! Siia kirjutage palun kuupäev! Ja siia kirjutage allkiri!\nKlient: Hästi!\nTeenindaja: Tänan. Palun, siin on teie kliendikaart.\nKlient: Väga hea! Aitäh! Nägemist!","text_en":"Customer: Hello!\nAssistant: Hello! Do you have a loyalty card?\nCustomer: No, I don't.\nAssistant: Would you like a loyalty card?\nCustomer: Maybe. How much does it cost?\nAssistant: It's free.\nCustomer: Very good! Then of course I'd like one.\nAssistant: Please fill in this form!\nCustomer: Oh, I can't see. My glasses are at home.\nAssistant: Never mind! Write your first name here! Write your surname here! And please write your e-mail address here! Please write the date here! And write your signature here!\nCustomer: Fine!\nAssistant: Thank you. Here is your loyalty card.\nCustomer: Very good! Thank you! Goodbye!","questions":[{"q":"Kas kliendil on kliendikaart?","options":["Jah, on küll.","Ei, ei ole."],"answer":1},{"q":"Kui palju kliendikaart maksab?","options":["5 eurot","10 eurot","See on tasuta.","1 euro"],"answer":2},{"q":"Kus on kliendi prillid?","options":["tööl","kodus","autos","poes"],"answer":1},{"q":"What does 'Pole midagi!' mean here?","options":["Nothing is there.","Never mind! / No problem!","I have nothing.","It's closed."],"answer":1}]},{"lesson":10,"title":"Raamatupood (shop sign from the workbook; last sentence added)","text_et":"RAAMATUPOOD – 2. KORRUS\nAVATUD E–R 10.00–18.00\nL, P SULETUD\n\nRaamatupood asub teisel korrusel. Pood on avatud esmaspäevast reedeni kümnest kuueni. Laupäeval ja pühapäeval on raamatupood suletud. Toidupood asub esimesel korrusel ja on avatud iga päev kaheksast üheksani.","text_en":"BOOKSHOP – 2ND FLOOR\nOPEN MON–FRI 10.00–18.00\nSAT, SUN CLOSED\n\nThe bookshop is on the second floor. The shop is open from Monday to Friday from ten to six. On Saturday and Sunday the bookshop is closed. The grocery store is on the first floor and is open every day from eight to nine.","questions":[{"q":"Mitmendal korrusel asub raamatupood?","options":["esimesel","teisel","kolmandal","viiendal"],"answer":1},{"q":"Kas raamatupood on laupäeval avatud?","options":["Jah, on küll.","Ei, ei ole."],"answer":1},{"q":"Mis kellast on raamatupood esmaspäeval avatud?","options":["kaheksast","üheksast","kümnest","kuuest"],"answer":2},{"q":"Mis kellani on raamatupood esmaspäeval avatud?","options":["viieni","kuueni","seitsmeni","kümneni"],"answer":1},{"q":"Millal on toidupood avatud?","options":["esmaspäevast reedeni","iga päev kaheksast üheksani","laupäeval ja pühapäeval","kümnest kuueni"],"answer":1}]}],"reader":[{"chapter":1,"title":"KES ON MARTA?","text_et":"Tere!\n\nMina olen Margus. Olen kakskümmend kuus aastat vana. Olen sündinud Kanadas, Torontos. Mu isa ja ema elavad Torontos. Neil on seal suur maja, ilus aed ja kaks koera. Ka mu noorem õde Hille elab veel kodus. Aga mina elan Eestis! Juba kaks kuud. Minu kodu on nüüd siin, Kaarupis – väikeses Eesti külas. Miks ma elan Eestis ja mitte Kanadas? Oh, see on pikk lugu. Minu vanaisa Mart on eestlane. Ta on sündinud siin, Kaarupis. Siin on tema lapsepõlvekodu – tema kodu, kui ta oli laps. See maja on meie perekonna oma. Ka vanaisa tahab elada Eestis, aga ta on väga vana ja haige, ta on praegu haiglas. Ka mu isa ja ema ei ela Eestis. Mu ema Kai töötab Torontos, ta on õpetaja. Minu isal Paulil on väike firma, mis teeb õlut ja limonaadi. Tema õlu on väga maitsev! Mu vanemad elavad Torontos, sest nad käivad tööl. Mu õde Hille käib veel ülikoolis ja õpib meditsiini. Temast saab arst. Mul on üks vana perepilt. Sellel pildil olen mina kuusteist aastat vana. Hille on siin kümneaastane. Pildil on veel mu ema Kai, isa Paul ja vanaisa Mart. Vanaema Vaike on surnud.\n\nMina olen programmeerija. Eestlased ütlevad: IT-mees või itimees. See tähendab, et ma töötan arvutiga. Minu töö on Torontos, aga mina töötan Kaarupis – oma kodus. Mul on vaja kolme asja: arvutit, internetti ja elektrit.\n\nMinu vanaisa lapsepõlvekodu meeldib mulle. Väikeses kollases puumajas on kolm tuba ja köök. Maja on metsa sees, jõe ääres. Maja all on suur kelder. Majal on ka pööning – see on nagu teine korrus. Maja kõrval on saun. Sauna ees on suur kivi ja sauna taga on minu õunaaed.\n\nJust praegu korjan oma aias õunu.\n\n***\n\nTelefon heliseb. See on minu ema. Ta helistab mulle Torontost.\n\n– Halloo! Margus kuuleb.\n\n– Tere, kallis poeg! Kuidas sul läheb? Mis uudist?\n\n– Tere, ema! Kõik on hästi. Täna on ilus ilm. Olen aias ja korjan õunu. Kuidas teie elate?\n\n– Meil on ka kõik hästi. Oleme Hillega kodus, ta tervitab sind. Isa on juba tööl.\n\n– Mis kell teil praegu on? Teil on vist hommik. Eestis on kell neli päeval.\n\n– Meil Torontos on praegu kell üheksa hommikul. Sööme Hillega hommikust ja joome kohvi. Minu tunnid algavad kell üksteist. Hille läheb täna ülikooli pärast lõunat, kell kaks.\n\n– Meil on täna ilus ilm, päike paistab. Sooja on kakskümmend kraadi. Kuidas on ilm Torontos?\n\n– Täna sajab vihma ja on tuuline. Aga homme tuleb soe ja ilus ilm.\n\n– Ema, täna on teisipäev, miks sa täna helistad? Sa helistad ju alati laupäeva hommikul. Kas kõik on ikka hästi?\n\n– Kõik on hästi, ära muretse. Ainult üks väike asi. Vanaisa tervitab sind. Pööningul on tema asjad, üks suur pruun kast. Ole hea poiss ja mine pööningule. Vaata, mis on selle kasti sees. Sinu vanaisa palub seda. Tal on seal vist üks saladus.\n\n– Hästi, kohe lähen ja vaatan. Tervitan teid kõiki!\n\n– Kallistan sind, pojake! Head aega!\n\nMulle ei meeldi, kui mu ema ütleb mulle pojake. Olen juba 26-aastane ja 188 sentimeetrit pikk. Olen suur ja tugev mees, mitte väike pojake.\n\n***\n\nKas vanaisal on pööningul saladus? Väga huvitav! Pööningul on pime, aga minu telefonis on ka lamp. Suur pruun kast on pööningu keskel. Selles on vanad fotod, raamatud ja ajalehed. Kastis on ka vanad kirjad. Need kirjad on vist väga vanad. Kui vanad? Kelle kirjad need on? Võtan kirjad ja lähen tagasi tuppa.\n\nPanen kirjad lauale – kokku on kaksteist kirja. Ma istun diivanile ja võtan ühe kirja. Hakkan lugema.\n\n12. juuni 1943, Tallinnas\n\nTere, armas sõber Mart!\n\nKuidas sa elad? Mina elan hästi. Olen juba kaks päeva tädi Johanna juures. Siin Tallinnas on väga huvitav. Tädi Johannal on suur korter kesklinnas, Harju tänaval. Mul on siin oma tuba. Päeval käime tädiga muuseumis või kinos, õhtul on Kadrioru pargis mõni kontsert või jalutame tädiga mere ääres. Mulle väga meeldib Tallinn. Tädi Johannal on palju raamatuid. Mõned raamatud on väga igavad, mõned on saksa, vene või inglise keeles. Ma loen praegu Juhan Liivi luuletusi. Need on ilusad ja meeldivad mulle väga. Kõige rohkem meeldib mulle tema luuletus „Üle vee“.\n\nÜks laevuke läeb üle vee\nläeb üle vee ja lainete.\nKui valge luik kaob üle vee,\nkaob üle vee ja lainete.\nMu armuke, mu kullake\nläks üle vee ja lainete...\n\nKirjuta mulle, kuidas Sina elad ja mida Sa oma kodus teed. Mis on Kaarupis uudist?\n\nTervitan Sind ja Kaarupit!\nSinu sõber Marta\n\n***\n\n17. juuni 1943, Tallinnas\n\nArmas Mart!\n\nSuur tänu Sulle kirja eest! See on väga huvitav. Sa kirjutad, et sinu koeral Muril on nüüd kolm väikest kutsikat. Mis värvi nad on? Kas Sa annad ühe kutsika minule? Sünnipäevaks?\n\nSest täna on minu sünnipäev. Tädi Johanna teeb kooki ja õhtul läheme temaga restorani. Kõige parem restoran Tallinnas on „Kuld Lõvi“. Tädi peigmees Ruudi töötab seal. Ta on kokk. Ruudi meeldib mulle. Ta laulab väga hästi. Ruudi käib meil külas. Ta toob tädile alati lilli ja veini, aga minule šokolaadi.\n\nSaadan Sulle oma pildi. Sellel pildil on mul seljas tädi triibuline kleit ja jalas uued mustad kingad.\n\nKirjuta mulle, kuidas Sa elad ja mis on Kaarupis uudist.\nSinu sõber Marta\n\nRuudi on tädi peigmees. Mis asi on peigmees? Vaatan seda sõna Sõnaveebist (https://sonaveeb.ee/lite). Peigmees on naise armuke ehk kallike, tema mees-sõber. Praegu ütlevad eestlased: poiss-sõber.\n\n***\n\n22. juuni 1943, Tallinnas\n\nTere, armas sõber Mart!\n\nAitäh kirja eest! Sinu kirjad on alati väga huvitavad. Tore, et Kaarupis on laupäeviti kino ja rahvamajas on iga nädal peod. Siin Tallinnas on ka väga huvitav, aga ma igatsen nüüd Kaarupisse, koju. Tulen Tallinnast koju tagasi alles augustis.\n\nTäna läheme tädiga Ruudile külla. Ruudi elab Nõmmel, tema perekonnal on seal suur maja ja väga ilus aed. Tal on ka kaks kassi ja koer. Mulle meeldivad kassid ja koerad. Ootan juba väga! Ruudi teeb meile õhtusööki. Sõidame tema juurde autoga. Tädi Johannal on punane auto. Tädile maitseb lambaliha kartulipudruga. Ruudi teeb ka väga head rosoljet ja kartulisalatit.\n\nÜks suur uudis on veel! Ruudi õde Liidia õpetab mulle prantsuse keelt. Oskan juba natuke prantsuse keelt – see on raske, aga ilus keel. Kui suureks saan, siis lähen Prantsusmaale, näiteks Pariisi.\n\nHüvasti! Pean nüüd minema. Tädi juba ootab mind. Panen veel täna Sinu kirja posti.\n\nKirjuta mulle, kuidas Sa elad. Ootan Sinu kirja!\nSinu sõber Marta\n\nP.S. Aitäh, et annad ühe kutsika minule. Mulle meeldib kõige rohkem see must kutsikas. See, kellel on valge saba ja kes on kõige väiksem.\n\n***\n\nVanad kirjad on nii huvitavad! See väike poiss Mart on ju minu vanaisa! Ta on sündinud 1933. aastal, praegu on ta juba väga vana. Aastal 1943 oli ta veel väike poiss. Ta oli siis ainult 10-aastane! Minu vanaema on surnud, tema nimi oli Vaike. Aga kes on Marta? Kus ta elab, mida ta praegu teeb? Kas Marta on vanaisa saladus?\n\nHelistan oma naabrile. Naabri nimi on Merike, ta töötab Kaarupi poes. Ta on väga tore ja sõbralik 50-aastane naine. Merike kindlasti teab, kes on Marta.\n\n***\n\n– Halloo! Merike kuuleb!\n\n– Tere, siin Margus, sinu uus naaber. Mis sa teed? Kas sa oled tööl?\n\n– Ah Margus! Kuidas sul läheb? Täna ma ei tööta, olen kodus ja pesen pesu.\n\n– Mul on üks küsimus. Kas sa tead, kes on Marta? Ta on sündinud Kaarupis ja on praegu juba vana naine.\n\n– Marta? Seda ma küll ei tea. Kaarupis ei ela mitte kedagi, kelle nimi on Marta. Miks sa seda küsid?\n\n– Ma loen vanaisa kirju. Marta oli 1943. aastal väike tüdruk. Ta oli minu vanaisa sõber.\n\n– Väga huvitav. Ma lähen homme tööle ja siis küsin kõigilt, kes tulevad poodi.\n\n– Aitäh sulle! Helista mulle siis.\n\n– Teeme nii. Kõike head!\n\n– Kuulmiseni!\n\n***\n\nTäna sajab vihma. Istun elutoas diivanil ja loen raamatut. Mul on väga mugav ja kena elutuba. Seinal on pildid. Minu tädi Anu on kunstnik. Anu on ema õde. Tema elab ka Torontos. Ta kingib mulle igal aastal ühe oma pildi. Talle meeldib loodus. Vahel ta joonistab ka linna. Mul on kaks pilti Eestist. Ühel pildil on Tallinna teletorn ja teisel pildil on Tartu ülikooli raamatukogu. Minu tädile meeldib moodne arhitektuur. Ma ei saa temast aru! Minule meeldivad vanad majad, nagu Tallinna või Tartu raekoda, Narva linnus või Kadrioru loss. Kanadas ei ole nii vanu maju.\n\nDiivani kõrval on raamaturiiul. See on üsna tühi, sest ma loen palju e-raamatuid telefonis või arvutis. Riiulis on ainult mõned vanad raamatud ja ajakirjad. Diivani ees on väike laud. Laual on lilled ja punane kohvitass. Joon kohvi kolm korda päevas, see maitseb mulle väga.\n\nAkna kõrval on kapp. Selle peal on telekas ja kaks kaktust. Mulle meeldivad kaktused, sest nad tahavad vähe vett. Ma unustan vahel, et mul on taimed. Põrandal on triibuline vaip. Vaibal magab minu kass Murri. Murri on paks ja laisk kass, ta sööb palju ja talle meeldib magada. Joon kohvi ja loen arvutist uudiseid. Kõik on nii mõnus ja kodune.\n\nJust siis heliseb mu telefon. Helistab naaber Merike. Ta ütleb, et Kaarupis ei tunne keegi Martat. Kaarupi on väike küla, siin elab ainult sada kakskümmend inimest. Kaarupis ei ela mitte ühtegi Martat.\n\nKas Marta on surnud? Või elab Marta välismaal, nagu minu vanaisa ja meie pere? Aga kus?\n\nVõtan paberi ja kirjutan:\nMarta, kes sa oled?\nMarta, kus sa oled?\n\n***\n\nTäna keedan õunamoosi. Kas sa oskad teha head õunamoosi? See on väga lihtne. Mul on vanaema Vaike õunamoosi retsept.\n\nVANAEMA ÕUNAMOOS\npool klaasi vett\n2 kilo õunu\n1 kilo suhkrut\nTükelda õunad, pane potti ja lisa vesi. Keeda umbes 20 minutit.\nSiis pane potti suhkur ja keeda veel 20 minutit. Pane moos purki.\nPane purk külmikusse või keldrisse.\n\nMulle maitseb kaerahelbepuder õunamoosiga. Keedan putru igal hommikul. Ainult mõnikord olen väga laisk, siis söön võileiba.\n\nMaitsen moosi. Oh, see on nii maitsev! Maitsen veel ja veel... Telefon heliseb.\n\n– Halloo, Margus kuuleb!\n\n– Tere, Margus, siin Merike! Kas sa otsid veel Martat?\n\n– Jah. Kas sa tead, kes ta on?\n\n– Kaarupi koolis töötab üks vana naine, Adeele. Tema teab, kes on Marta. Marta ei ela Kaarupis, ta elab juba nelikümmend aastat Tartus. Ta oli Tartu Ülikoolis bioloog, aga nüüd on ta pensionil. Mul on ka tema aadress. Kas soovid?\n\n– Jah, muidugi. Ma kirjutan talle.\n\n– Tema nimi on Marta Suurmets. Aadress on: Tartu, Tiigi tänav 23, korter 38.\n\n– Suur tänu sulle, Merike! Teen just praegu õunamoosi. Kas toon sulle ka?\n\n– Mul on ka aias palju õunu. Teen moosi ülehomme, kui mul on vaba päev. Too jah mulle oma moosi, ma annan sulle siis ülehomme oma moosi. Siis vaatame, kelle moos on maitsvam.\n\n– Hahahaa! Minu moos on kindlasti maitsvam. Mul on väga hea retsept! Vanaema oma. Vanaema õunamoos on kõige parem, maailma parim!\n\n– Elame-näeme! Ilusat õhtut sulle!\n\n– Sulle ka!\n\n***\n\nTäna õhtul kirjutan Martale kirja:\n\nLugupeetud Marta Suurmets!\n\nKirjutan Teile Kaarupist. Minu nimi on Margus Mustikas. Elan Kaarupis juba kaks kuud, aga olen pärit Torontost. Olen Mart Mustika pojapoeg. Meie maja pööningul on Teie vanad kirjad. Teie olete minu vanaisa sõber. Mu vanaisa on praegu Torontos haiglas. Saadan Teile tema aadressi. Kirjutage talle! Tal on kindlasti hea meel.\nTervitades\nMargus Mustikas\nKaarupist\n\n***\n\nTäna keedan jälle õunamoosi. Mul on keldris juba kakskümmend seitse purki õunamoosi. Aga Eestis on pikk ja külm talv. Mis on talvel kõige parem hommikusöök? Puder õunamoosiga! Eestlased armastavad putru, eriti kaerahelbeputru. Mina armastan ka putru. Eestlased söövad veel palju mannaputru, tatraputru, tanguputru ja riisiputru.\n\nTelefon heliseb. See on minu ema.\n\n– Tere, kallis pojake!\n\n(Miks ta ütleb mulle alati kallis pojake?! Ema teab, et mulle see ei meeldi.)\n\n– Tere, ema! Mis Torontos uudist?\n\n– Sinu vanaisa ei ole enam haiglas, ta on nüüd jälle kodus. Tal on palju parem. Just praegu loeb ta kirja oma sõbralt Martalt! Aitäh sulle abi eest!\n\n– See on tore! Mida Marta talle kirjutab?\n\nTelefonis on vaikus. Ootan. Kuulen, et ema ja vanaisa räägivad. Ema hääl on närviline.\n\n– Margus, appi! Marta kutsub sinu vanaisa Eestisse! Ta ootab sinu vanaisa Tartusse külla. Ja vanaisa ütleb, et ostab homme lennupileti. Sinu vanaisa sõidab Eestisse... Appi!!!\n\n– Aga ema, see on ju tore!\n\n– See ei ole tore! Sinu vanaisa on vana ja haige! Mida ta teeb Tartus?\n\n– Ema, kõik on hästi. See on vanaisale hea! Las ta läheb.\n\n***\n\nMul on keldris juba nelikümmend kaheksa purki õunamoosi. Olen väsinud. Aga aias ei ole enam ühtegi õuna. Õnneks!\n\nTäna hommikul saan postkaardi. Kaardil on Tartu Raekoja plats. Kirjutab minu vanaisa.\n\nArmas pojapoeg!\n\nOlen Tartus. Olen siin koos Martaga. Elan Marta väikeses korteris Tiigi tänaval. Nii tore on Martat jälle näha. Me räägime oma elust ja oma lapsepõlvest. Vaatame Marta fotoalbumit. Marta mees on surnud. Minu naine Vaike, sinu vanaema on ka surnud. Aga meie oleme elus! Tartus on väga tore – iga päev jalutame Toomemäel ja Emajõe pargis, sööme Werneri kohvikus kooki ja joome teed. Õhtul käime teatris ja kinos. Täna õhtul läheme kontserdile.\n\nTuleme Kaarupisse järgmisel nädalal. Siis saad sina ka Martaga tuttavaks. Suur tänu ja kohtumiseni!\n\nSinu vanaisa\n\n***\n\nVanaisa tuleb mulle külla! Nii tore!\n\nVaatan keldris õunamoosi purke. Mul on juba nelikümmend kaheksa purki õunamoosi! Loodan, et Martale ja vanaisale maitseb minu õunamoos.","word_count":2168,"glossary":[{"et":"lapsepõlvekodu","en":"childhood home"},{"et":"pööning","en":"attic"},{"et":"kelder","en":"cellar, basement"},{"et":"korjama (õunu)","en":"to pick, gather (apples)"},{"et":"helisema (telefon heliseb)","en":"to ring (the phone rings)"},{"et":"saladus","en":"secret"},{"et":"kast","en":"box"},{"et":"kiri, kirja","en":"letter"},{"et":"peigmees","en":"fiancé; (old-fashioned) boyfriend"},{"et":"kutsikas","en":"puppy"},{"et":"igatsema","en":"to miss, long for"},{"et":"naaber","en":"neighbour"},{"et":"pojapoeg","en":"grandson (son's son)"},{"et":"retsept","en":"recipe"},{"et":"tükeldama","en":"to chop into pieces"},{"et":"purk","en":"jar"},{"et":"keetma (moosi, putru)","en":"to boil, cook (jam, porridge)"},{"et":"pensionil","en":"retired"},{"et":"lennupilet","en":"plane ticket"},{"et":"närviline","en":"nervous"}],"questions":[{"type":"mc","q":"Kus on Margus sündinud?","q_en":"Where was Margus born?","options":["Tallinnas","Torontos","Tartus"],"answer":1,"explanation_en":"He says he was born in Canada, in Toronto. Tallinn and Tartu are where Marta lived later.","evidence_et":"Olen sündinud Kanadas, Torontos."},{"type":"tf","q":"Margus töötab Kaarupis oma kodus.","q_en":"Margus works from his home in Kaarupi.","options":["Õige","Vale"],"answer":0,"explanation_en":"True: his employer is in Toronto, but he works remotely from his home in Kaarupi.","evidence_et":"Minu töö on Torontos, aga mina töötan Kaarupis – oma kodus."},{"type":"mc","q":"Mis on pööningul suures pruunis kastis?","q_en":"What is in the big brown box in the attic?","options":["vanad fotod, raamatud, ajalehed ja kirjad","õunamoosi purgid","vanaisa riided"],"answer":0,"explanation_en":"The box holds old photos, books, newspapers and old letters. The jam jars are in the cellar.","evidence_et":"Selles on vanad fotod, raamatud ja ajalehed. Kastis on ka vanad kirjad."},{"type":"tf","q":"Marta kirjutas oma kirjad 1943. aastal Tartus.","q_en":"Marta wrote her letters in Tartu in 1943.","options":["Õige","Vale"],"answer":1,"explanation_en":"False: the letters were written in Tallinn, at aunt Johanna's. Marta lives in Tartu only now, as an old woman.","evidence_et":"12. juuni 1943, Tallinnas"},{"type":"mc","q":"Kes teab, kus Marta praegu elab?","q_en":"Who knows where Marta lives now?","options":["naaber Merike","Adeele, kes töötab Kaarupi koolis","Marguse ema"],"answer":1,"explanation_en":"Merike first doesn't know; she finds out from Adeele, an old woman who works at the Kaarupi school.","evidence_et":"Kaarupi koolis töötab üks vana naine, Adeele. Tema teab, kes on Marta."},{"type":"tf","q":"Marta elab juba nelikümmend aastat Tartus.","q_en":"Marta has lived in Tartu for forty years already.","options":["Õige","Vale"],"answer":0,"explanation_en":"True: 'juba nelikümmend aastat' = already forty years.","evidence_et":"ta elab juba nelikümmend aastat Tartus"},{"type":"mc","q":"Mitu purki õunamoosi on Margusel lõpuks keldris?","q_en":"How many jars of apple jam does Margus have in the cellar in the end?","options":["27","48","12"],"answer":1,"explanation_en":"In the end there are 48 jars (nelikümmend kaheksa). 27 was an earlier count; 12 is the number of letters.","evidence_et":"Mul on keldris juba nelikümmend kaheksa purki õunamoosi."},{"type":"tf","q":"Ema arvab, et vanaisa reis Eestisse on tore mõte.","q_en":"Mum thinks grandfather's trip to Estonia is a nice idea.","options":["Õige","Vale"],"answer":1,"explanation_en":"False: Margus says it is nice, but his mother is worried because grandfather is old and ill.","evidence_et":"See ei ole tore! Sinu vanaisa on vana ja haige!"}]},{"chapter":2,"title":"KUS ON MURRI?","text_et":"Täna on soe ja ilus ilm. Päike paistab. Istun sauna ees suure kivi peal. Joon kohvi ja loen oma e-maile. Mul on praegu vähe tööd. See on tore, sest mul on palju vaba aega. Teen õunakooki, loen raamatut ja sõidan jalgrattaga.\n\nMilline on minu päev? Mida ma tavaliselt teen? Hommikul teen trenni – sõidan jalgrattaga, tavaliselt umbes kümme kilomeetrit. Ma ei jookse, sest mulle ei meeldi joosta. Suvel ujun Kaarupi järves või sõidan paadiga. Mu naabril Merikesel on paat. Ta kutsub mind ka kalale, aga ma ei ole kalamees – mulle ei meeldi kala püüda. Aga mulle meeldib kala süüa, nagu ka kass Murrile. Päeval ma töötan. Vahel ma töötan seitse või kaheksa tundi. Praegu on vähe tööd, töötan päevas ainult kaks või kolm tundi. Mulle ei meeldi pikad tööpäevad.\n\nÕhtul loen raamatuid. Mulle meeldivad raamatud. Praegu loen raamatuid Eestist – Eesti loodusest ja kultuurist. Mind huvitab, milline on elu Eestis. Mul on palju e-raamatuid, neid ma loen arvutis või telefonis. Ma käin ka Kaarupi raamatukogus. Toas laual on praegu üks huvitav raamat „Eesti mets“. Eestis on palju metsa – umbes pool ehk 50% Eestist on mets. See raamat on Eesti loodusest, taimedest ja loomadest. Loen seda kindlasti täna õhtul.\n\n***\n\nKohvitass on tühi, kohv on otsas. Lähen kööki ja võtan veel kohvi. Mulle maitseb kohv piima ja suhkruga. Suhkur ei ole tervislik, aga see on kohvi sees nii hea! Võtan veel ühe tüki õunakooki. Elu on ilus!\n\nPanen ka kassi taldrikule kassitoitu. Murri on suur ja paks kass, talle meeldib süüa. Tema lemmik on kassitoit kalast. Murri tuleb alati ruttu sööma. Täna hommikul Murri ei tule.\n\n„Murri, tule sööma! Kus sa oled, Murri!“ Murrit ei ole. Ootan kümme minutit. Murri ei tule sööma.\n\nLähen välja. Seisan maja ees trepil ja kutsun: „Murri, Murri, kiisu-kiisu! Tule sööma!“ Murrit ei ole ikka veel. See on väga imelik. Aga ehk ta tuleb varsti. Lähen tuppa ja töötan natuke.\n\n***\n\nTöötan kolm tundi ja unustan kassi.\n\nOn pärastlõuna, kell on kolm. Lähen kööki. Avan külmkapi ukse. Külmkapis on üks viiner ja natuke kartulisalatit. Söön viinerit salatiga. Mul on kõht väga tühi.\n\nPõrandal on Murri taldrik. Tema taldrikul on kassitoit. Kas Murril ei ole kõht tühi? Väga imelik! Kus Murri on?\n\nLähen tuppa. Vaatan diivani alla, riiuli taha, laua alla ja isegi kappi. Murrit ei ole elutoas. Siis lähen magamistuppa. Vaatan kardina taha ja voodi alla, kapi peale ja tooli alla. Murrit ei ole magamistoas. Lähen vannituppa. Murrit ei ole ka vannitoas. Lähen trepist üles pööningule. Otsin Murrit pööningul, aga Murrit ei ole ka seal.\n\nLähen välja. Lähen sauna juurde. Otsin Murrit. Vaatan saunas igale poole. Murrit ei ole saunas. Lähen sauna taha aeda. Aias on kaksteist õunapuud. Murrile meeldivad puud. Ta ronib vahel õunapuu otsa. Murrit ei ole ka aias. Aia taga on mets.\n\n***\n\nLähen tuppa. Loodan, et ehk Murri tuleb varsti koju.\n\nIstun diivanil ja loen. Loen raamatut „Eesti mets“. Eestis on palju metsa – pool Eestimaast ehk 50% on mets. Metsas kasvavad puud – kuused, kased ja männid. Eesti metsas elab palju loomi. Metsloomad on jänes, põder, metskits, rebane, hunt, karu ja ilves. Ma tean ühte laulu: „Põdra maja“. Minu teine vanaema, Selma, laulab vahel seda laulu. Selma on minu ema ema, ta elab ka Torontos. Laulan:\n\nPõdral maja metsa sees,\nväiksest aknast välja vaatab.\nJänes jookseb kõigest väest,\nlävel seisma jääb.\nKopp-kopp, lahti tee!\nMetsas kuri jahimees.\nJänes, tuppa tule sa.\nAnna käppa ka!\n\n***\n\nÕhtul helistab mulle sõber Ants Torontost. Ta on mu koolivend Toronto Eesti Koolist. Me oleme sõbrad juba kaksteist aastat. Ants räägib, et tal on uus tüdruksõber ja nad tulevad suvel Eestisse. See on tore, et nad tulevad mulle külla! Mul on suur maja, palju ruumi. Ja mulle meeldivad külalised.\n\n***\n\nHommikul lähen kööki. Murrit ei ole ikka veel. Söön kaerahelbeputru ja joon kohvi. Siis lähen välja.\n\nMinu naaber Merike elab punases puumajas. Tema maja ees on lilled ja kaks suurt tammepuud. Merike on kodus. Ta istub köögis ja vaatab aknast välja.\n\n– Tere, Merike! Kuidas läheb?\n\nMerike naerab.\n\n– Tere-tere! Kas kõik on korras? Kell on alles pool üheksa. Sa magad hommikul tavaliselt kaua. Miks sa nii vara siin oled?\n\n– Murrit ei ole. Kas sa tead, kus ta on? Kas Murri on sinu juures?\n\n– Ei ole. Ma ei tea, kus Murri on. Võib-olla ta on metsas.\n\n– Metsas???!!! Appi! Metsas elavad ju hundid ja karud! Ja rebased! Nad söövad liha. Neile maitseb kindlasti ka kassiliha… ühe paksu kassi liha... Appi!\n\n***\n\nMinu sauna taga ongi mets. Seal on suured kuused ja männid ja teised puud, mille nime ma ei tea. Lähen metsa.\n\n„Murri! Tule koju! Kiisu-kiisu-kiisu!“\n\nMurrit ei ole. Ei ole ka ühtegi karu, hunti ega rebast. Õnneks! Jalutan metsas ja korjan seeni. Kaarupi metsas kasvavad kukeseened, puravikud ja riisikad. Mulle maitsevad seened. Kodus teen seenesalatit. Mul on üks hea retsept: vanaema Selma seenesalat. Siin on nii palju seeni! Unustan Murri.\n\nVANAEMA SELMA\nSEENESALAT\nVõta 200 grammi seeni,\n1 muna ja 1 väike sibul,\nhapukoort ja natuke soola.\nKeeda seened ja muna.\nTükelda seened, muna ja sibul,\nsega need hapukoore ja soolaga.\nHead isu!\n\n***\n\nTean veel ühte laulu metsast:\n\nKes elab metsa sees?\nKes elab paksu metsa sees?\nKes elab metsa sees?\nSeal elab päkapikk.\nSeal elab väike päkapikk.\nSeal elab päkapikk.\nMis teeb see päkapikk?\nMis teeb see väike päkapikk?\nMis teeb see päkapikk?\n\nMida see päkapikk metsas teeb? Ma ei mäleta, kuidas laul lõppeb. Võtan telefoni ja guugeldan. Internetis on kõike! Nüüd ma tean, kuidas see laul lõppeb: Päkapikk elab metsas, ta küpsetab saia. Siis ta müüb saia. Kui palju maksab üks sai? Viis pikka paid. Huvitav, kas üks pai on odav või kallis? Aga viis paid?\n\nTelefon heliseb. See on minu kolleeg Mike Kanadast. Räägime tööst ja elust. Mike küsib, kus ma praegu olen. Ma olen metsas ja korjan seeni. Õigus, ma otsin ju Murrit...\n\nKell on juba kaks. Mul on kõht tühi. Vihma sajab ja on külm. Aga kus on mu kodu? Ma ei tea. Olen suures metsas, olen eksinud. Õnneks on mul telefonis GPS. GPS teab, kus on mu kodu. Vaene Murri, tal ei ole telefoni, tal ei ole GPS-i... Kus ta küll on?\n\n***\n\nÕhtul lähen Kaarupi raamatukokku. Mulle meeldib lugeda, mulle meeldivad raamatud. Käin raamatukogus iga nädal. Jalutan Kaarupis ja vaatan maju. Kaarupi on väike küla, siin elab ainult sada kakskümmend inimest. Mulle meeldivad Eesti puumajad. Merikese maja on punane, külas on veel neli punast, kaks rohelist, üks pruun ja kolm kollast puumaja. On ka üks sinine kivimaja. Selles elab üks vana mees. Ma ei tea, mis ta nimi on. Raamatukogu on vanas kivimajas.\n\nRaamatukogu kõrval on üks uus valge kivimaja. Majal on suured aknad ja ilus punane uks. Aknal on kaks toalille ja .... Murri! Minu kass Murri istub aknal ja vaatab välja. Ta vaatab mind.\n\nMul on nii hea meel! Minu Murri ei olegi metsas! Rebased ja karud ja ilvesed ei ole Murrit ära söönud!\n\nMurri vaatab mind ja läheb siis ära.\n\n– Murri! See olen ju mina, Margus! Murri!!! Kas sa ei tunne mind? Kuhu sa lähed?\n\n***\n\nKoputan valge maja uksele. Ootan. Uksele tuleb üks tüdruk. Tal on pikad heledad juuksed ja sinised silmad.\n\n– Tere!\n\n– Tere õhtust! Olen Margus Mustikas. Elan metsa ääres kollases majas.\n\n– Ah sina oled see uus poiss? Sa oled pärit Kanadast? Nii huvitav! Mina olen Liisa-Krõõt. Tore tutvuda!\n\nTüdruk vaatab mind.\n\n– Aga miks sa siin oled? Mida sa tahad?\n\n– Minu kass Murri on kadunud. See tähendab, ta ei ole kadunud, ta on siin – teie maja aknal.\n\n– Sinu kass? See ei ole Murri, see on Miisu! Ta on minu kass. Ta on nüüd jälle kodus. Miisu oli kadunud kaks kuud. Vist oli metsas.\n\n– Metsas?\n\n– Ma ei tea, kus ta oli. Miisu on nii paks! Metsas ei ole ju süüa. Mida kassid metsas söövad? Nüüd on Miisu kodus dieedil...\n\n– See kass on Murri, ta on olnud kaks kuud minu juures. Ta elab koos minuga kollases majas.\n\n– Kas Miisu oli sinu juures? Kui tore! Aitäh sulle, Margus!\n\n– Ole hea!\n\n– Aga Miisu sööb liiga palju. Ta on paks!\n\n– Jah. Talle maitsevad kassikonservid. Eriti kalast.\n\n– Vabandust, aga mul ei ole aega. Lähen nüüd tuppa, mu ema ootab. Nägemiseni!\n\nTüdruk läheb tuppa. Vaatan valge maja akent. Murrit ei ole enam aknal... Lähen koju. Mul on paha tuju. Olen kurb.\n\n***\n\nOn kena hommik, päike paistab. Istun köögis ja joon kohvi. Maja uks on lahti. Ma ei ole köögis üksi.\n\n– Näu!\n\nSee on Murri! Või Miisu. Ta seisab ukse juures ja vaatab oma taldrikut. Taldrik on tühi. Lähen külmkapi juurde, võtan külmkapist kassitoidu. Murri jookseb minu juurde.\n\n– Näu, näu, näu-näu-näu!!!!\n\n– Kas sa oled näljane? Palun! Siin on sinu toit. Sinu lemmiktoit kalaga. Head isu, Murri!\n\nSee ei ole Miisu, see on Murri! Minu kallis Murri!\n\nMurri sööb. Mina vaatan Murrit.\n\nJoon kohvi. Mul on hea tuju. Täna on ilus päev.\n\n***\n\nKaks tundi hiljem tuleb Liisa-Krõõt. Näen teda aknast. Liisa-Krõõt koputab uksele. Teen ukse lahti.\n\n– Tere, Margus! Miisut ei ole kodus. Ta on kadunud. Kas Miisu on siin?\n\n– On küll. Ta on köögis ja sööb. Tule sisse. Kas sa soovid kohvi või teed?\n\n– Teed palun.\n\n– Mis teed sa soovid? Mul on musta ja rohelist teed. On veel kibuvitsateed, Merikese kummeliteed ja piparmünditeed.\n\nMerikesel on aias kummel ja piparmünt. Ta toob mulle alati natuke teed, kui ta külla tuleb. Kummel ja piparmünt on ravimtaimed – need on head, kui oled haige.\n\n– Mulle maitseb piparmünditee. Aitäh!\n\n– Mul on ka õunakooki. Kas soovid?\n\nKeedan vett. Siis joome teed, sööme kooki ja räägime juttu. Murri (alias Miisu) istub köögis laua all. Liisa-Krõõdale maitseb minu õunakook. Annan talle vanaema õunakoogi retsepti.\n\n***\n\nLiisa-Krõõt on kakskümmend neli aastat vana. Ta töötab Kaarupi koolis õpetajana. Ta õpetab keemiat ja füüsikat. Ka tema vanemad elavad Kaarupis. Ema on arst ja isa on autojuht.\n\nMiisu või Murri vaatab meid. Kas ta naeratab? Ma arvan, et ta on õnnelik.\n\n– Margus, kas sulle meeldivad kassid?\n\n– Jah, meeldivad küll. Ja mina meeldin Murrile. Vabandust, Miisule. Kas ta võib minu juures olla?\n\n– Meie kodus oli Miisu dieedil. Ta on ju nii paks! Ma arvan, et Miisu on siin, sest sinu juures on palju süüa. Sina söödad teda.\n\nNaerame.\n\n***\n\nLiisa-Krõõt helistab mulle õhtul. Ta küsib, kuidas elab Miisu ja mida ma homme teen. Homme on laupäev, siis on Kaarupi rahvamajas kino. Sel nädalal on kinos Eesti film „Mandariinid“. Liisa-Krõõt ütleb, et see on hea film. Kas kohtume homme kell kuus ja läheme koos kinno? Jah, muidugi!\n\nMul ei olegi Kaarupis sõpra. On ainult naaber Merike, aga tema on 50-aastane. Merike on väga tore, aga ta on nii vana! Mul on hea meel, et Kaarupis elab Liisa-Krõõt. Homme lähen temaga kinno. Liisa-Krõõt meeldib mulle.\n\nAitäh sulle, Murri-Miisu! Mul on nüüd Kaarupis sõber.","word_count":1792,"glossary":[{"et":"trenni tegema","en":"to work out, exercise"},{"et":"jalgrattaga sõitma","en":"to ride a bicycle"},{"et":"kala püüdma","en":"to fish, catch fish"},{"et":"tööpäev","en":"working day"},{"et":"taldrik","en":"plate"},{"et":"imelik","en":"strange"},{"et":"külmkapp","en":"fridge"},{"et":"õunapuu","en":"apple tree"},{"et":"metsloomad","en":"wild animals"},{"et":"põder","en":"moose, elk"},{"et":"rebane","en":"fox"},{"et":"hunt","en":"wolf"},{"et":"karu","en":"bear"},{"et":"seeni korjama","en":"to pick mushrooms"},{"et":"eksinud","en":"lost (lost one's way)"},{"et":"koputama","en":"to knock"},{"et":"kadunud","en":"missing, lost"},{"et":"dieedil","en":"on a diet"},{"et":"paha tuju","en":"bad mood"},{"et":"näljane","en":"hungry"}],"questions":[{"type":"mc","q":"Mida Margus hommikul trenniks teeb?","q_en":"What does Margus do for exercise in the morning?","options":["jookseb","sõidab jalgrattaga","ujub järves"],"answer":1,"explanation_en":"He cycles about ten kilometres. He says he does not run; he swims in the lake in summer, not every morning.","evidence_et":"Hommikul teen trenni – sõidan jalgrattaga"},{"type":"tf","q":"Margusele meeldib kala püüda.","q_en":"Margus likes fishing.","options":["Õige","Vale"],"answer":1,"explanation_en":"False: he doesn't like catching fish, but he likes eating fish.","evidence_et":"mulle ei meeldi kala püüda. Aga mulle meeldib kala süüa"},{"type":"tf","q":"Margus eksib metsas ära, aga telefon aitab tal koju leida.","q_en":"Margus gets lost in the forest, but his phone helps him find home.","options":["Õige","Vale"],"answer":0,"explanation_en":"True: 'olen eksinud' = I am lost; the GPS in his phone knows where home is.","evidence_et":"Olen suures metsas, olen eksinud. Õnneks on mul telefonis GPS."},{"type":"mc","q":"Kus Margus õhtul Murrit näeb?","q_en":"Where does Margus see Murri in the evening?","options":["Merikese köögis","uue valge kivimaja aknal","raamatukogu riiulil"],"answer":1,"explanation_en":"The cat sits on the window sill of the new white stone house next to the library.","evidence_et":"Raamatukogu kõrval on üks uus valge kivimaja. ... Minu kass Murri istub aknal ja vaatab välja."},{"type":"tf","q":"Liisa-Krõõt ütleb, et see kass on tema kass Miisu.","q_en":"Liisa-Krõõt says the cat is her cat Miisu.","options":["Õige","Vale"],"answer":0,"explanation_en":"True: Murri and Miisu are the same cat – it had been living with Margus for two months.","evidence_et":"See ei ole Murri, see on Miisu! Ta on minu kass."},{"type":"mc","q":"Mis teed Liisa-Krõõt Marguse juures joob?","q_en":"What tea does Liisa-Krõõt drink at Margus's place?","options":["musta teed","kummeliteed","piparmünditeed"],"answer":2,"explanation_en":"She chooses peppermint tea (piparmünditee). Black, green, rosehip and camomile tea were also offered.","evidence_et":"Mulle maitseb piparmünditee. Aitäh!"},{"type":"mc","q":"Kellena töötab Liisa-Krõõt?","q_en":"What does Liisa-Krõõt work as?","options":["arstina","õpetajana","autojuhina"],"answer":1,"explanation_en":"She is a teacher (chemistry and physics). Her mother is a doctor (arst) and her father a driver (autojuht).","evidence_et":"Ta töötab Kaarupi koolis õpetajana."},{"type":"tf","q":"Laupäeval lähevad Margus ja Liisa-Krõõt koos kinno.","q_en":"On Saturday Margus and Liisa-Krõõt go to the cinema together.","options":["Õige","Vale"],"answer":0,"explanation_en":"True: tomorrow is Saturday, there is a film at the Kaarupi community house, and they agree to go at six.","evidence_et":"Kas kohtume homme kell kuus ja läheme koos kinno? Jah, muidugi!"}]},{"chapter":3,"title":"NATÜÜRMORT PUNASE VAASIGA","text_et":"Täna on pühapäev ja ilm on ilus. Kell on üks. Istun maja ees trepil ja ootan. Liisa-Krõõt tuleb täna kell kaks minu juurde. Tal on ka jalgratas ja me läheme rattaga sõitma. Ma veel ei tea, kuhu me sõidame. Liisa-Krõõt teab. Murri on ka õues, ta istub murul ja vaatab ühte suurt lindu. Lind vaatab Murrit. Kassid ju püüavad ja söövad linde, aga Murri on väga paks ja laisk. Murri sööb kassikonserve. Lind saab vist aru, et Murri ei ole näljane. Keegi tuleb väravast sisse. See on ju minu vanaisa! Tal on suur pruun kohver käes. Vanaisa kõrval on üks proua. Proual on peas oranž barett, seljas kollane mantel ja kaelas punane sall. Jalas on tal punased saapad. Ma arvan, et see proua ei ole eestlane. Eesti prouad kannavad tumedaid riideid. Kaarupi vanad naised armastavad musta ja pruuni. See proua aga on väga värviline...\n\nJooksen vanaisa juurde.\n\n– Tere, vanaisa! Nii tore, et sa oled siin!\n\n– Tere, Margus! Tore sind ka näha. Las ma tutvustan sulle Martat. Marta on minu sõber. Ta elab Tartus. Aga sa tead seda juba.\n\n– Tere! Väga rõõmustav. Tere tulemast Kaarupisse! Mina olen Margus ja see seal on minu kass Murri. Tulge sisse. Kas soovite teed või kohvi? Mul on ka õunakooki.\n\n***\n\nIstume elutoas ja sööme kooki. Vanaisa joob teed. Ta ei tohi kohvi juua. Vanaisa oli kaks kuud haiglas. Tema arst ütleb, et kohv ei ole talle hea. Aga piparmünditee on väga hea ja tervislik. Vanaisale maitseb tee ja ka minu õunakook. Meie Martaga joome kohvi. Marta joob kohvi ilma piima ja suhkruta – ta armastab musta kohvi. Mina joon kohvi piima ja suhkruga. Räägime elust Kaarupis ja Tartus. Vanaisa on väga õnnelik, talle meeldib Eestis. Kahjuks sõidab ta tagasi Kanadasse. Tema lennuk Torontosse läheb juba ülehomme kell kaks. Aga vanaisa tuleb varsti jälle Eestisse. Sest siin on Marta. Ja siin olen ka mina.\n\nLähen magamistuppa, võtan kirjutuslaualt vanaisa ja Marta kirjad. Toon need kirjad elutuppa ja annan vanaisale. Vanaisa ja Marta loevad vanu kirju. Nad naeravad.\n\n***\n\nLähen pööningule ja toon elutuppa ka vanad fotod. Vaatame fotosid. Ühel pildil on minu vanaisa. Vanaisal on lühikesed heledad juuksed ja suured kõrvad. Tal on lühikesed püksid jalas ja triibuline särk seljas. Vanaisa kõrval on pildil ilus valge koer. See on vist tema koer Muri. Pildil on ka üks maja. Maja kõrval on suured puud. Kas see on meie maja – see maja, kus ma elan praegu? Kas maja oli ka siis kollane? Ma ei tea, sest see pilt on mustvalge.\n\nKahel fotol on Marta. Esimene pilt on suurem. Marta on ilus tüdruk. Tal on kaks patsi. Ta seisab, käed selja taga. Seljas on tal valge kleit, kleidil on suured mustad nööbid. Teine pilt on väike, see on portree. Martal on pikad tumedad juuksed, tal on lill juustes. Marta naeratab.\n\nPildi taga on kiri:\n\nPalju tähti taevas külmal talveööl, palju kalleid sõpru leiad eluteel.\nMälestuseks kallile Mardile.\nMarta, kevad 1944\n\n***\n\nKeegi koputab uksele. Lähen kööki ja teen ukse lahti. Trepil seisab Liisa-Krõõt. Ah jaa, me läheme täna ju jalgrattaga sõitma!\n\nLiisa-Krõõt tuleb tuppa, ma tutvustan teda vanaisale ja Martale. Siis läheme Liisa-Krõõdaga koos välja. Lubame, et me ei lähe täna kaugele. Sõidame jalgrattaga ainult paar tundi. Vanaisa ja Marta istuvad ikka elutoas, joovad teed ja kohvi, räägivad juttu.\n\nLiisa-Krõõt ütleb, et mul on väga tore vanaisa. Olen nõus! Minu vanaisa on kõige parem! Ta on sõbralik ja tal on alati hea tuju. Ma armastan teda väga. Ka Marta on väga sümpaatne. Mul on hea meel, et nad on koos. Ja et nad on nüüd Kaarupis minu juures – vanaisa lapsepõlvekodus.\n\n***\n\nSõidame jalgrattaga läbi metsa. Kas läheme täna ehk Kuldsesse? Küsin Liisa-Krõõdalt, kas talle meeldib Kuldse mõis ja park. Mulle väga meeldib seal, sest pargis on suured puud ja väike järv. Mõisamajas on praegu hotell. Hotelli kohvikus saab väga head kohvi. Kuldsesse on Kaarupist ainult kuus kilomeetrit.\n\nSõidame rattaga ja räägime juttu. Liisa-Krõõt räägib Kaarupi koolist ja oma tööst. Ta õpetab koolis keemiat ja füüsikat. Talle meeldib kool ja meeldivad ka lapsed. Kaarupi kool on väike, seal õpib ainult kolmkümmend last. Kaarupis kõik tunnevad üksteist ja ka lapsed on sellepärast koolis väga head. Sest emad ja isad saavad kohe teada, kui lapsed ei õpi ja teevad pahandust. Mina räägin oma tööst. Praegu mul pole palju tööd. Töötan iga päev ainult kolm või neli tundi. Minu töö on igav. Aga mul on palju vaba aega. Loen palju, mulle meeldivad raamatud. Sõidan rattaga. Õhtul kuulan muusikat, vaatan filmi või käin Merikesel külas. Merike on mu naaber, aga ka hea sõber. Ta teeb väga head kringlit. Ja tema piparmünditee on ka maitsev!\n\n***\n\nJalutame pargis. Linnud laulavad ja päike paistab. Elu on ilus! Pargis on suured tammed. Tamm on minu lemmikpuu. Aga kas te teate, et Tamm on Eestis kõige populaarsem perekonnanimi? Eestis elab praegu umbes viis tuhat kakssada inimest, kelle perekonnanimi on Tamm. Eestis elab viis tuhat tamme... Hahahaa, kui naljakas!\n\nEestis elab muide ainult üks inimene, kelle perekonnanimi on Mustikas – see olen mina! Kõik teised Mustikad elavad Kanadas. Liisa-Krõõda perekonnanimi on Jõgi. Jõgi on ka populaarne perekonnanimi. Eestis on tuhat kolmsada inimest, kelle perekonnanimi on Jõgi. Populaarsed perekonnanimed on veel Kask ja Kuusk. Need on ka puud. Eestis elab palju puid!\n\n***\n\nKõige suurema tamme all on üks valge asi. Mis see on? Lähen vaatama.\n\nTamme all on suur pakk. Pakk ei ole raske. Teen selle lahti. Paki sees on üks suur pilt! See on ilus maal - natüürmort. Natüürmort tähendab prantsuse keeles vist surnud loodust.\n\nMaalil on valge linaga laud. Laual on punane vaas. Vaasis on roosad lilled. Vaasi kõrval on pruun taldrik. Sellel on õunad. Kokku neli õuna.\n\n– Miks see pilt on siin pargis puu all? Kelle maal see on?\n\n– Mida me nüüd teeme, Liisa-Krõõt?\n\n– Ma ei tea. Võtame pildi ja lähme hotelli. Küsime sealt. Võib-olla keegi teab midagi sellest pildist.\n\n– See on hea mõte. Lähme!\n\n***\n\nMõisamaja on ilus vana kivimaja. See ei ole väga suur. Majal on kaks korrust ja veranda. Selles majas on praegu hotell. Verandal on väike kohvik. Hotellis töötab üks mees, kes elab Kaarupis. Liisa-Krõõt tunneb teda. Mehe nimi on Vaino Lepp. Lepp on ka üks puu! Lepad kasvavad minu maja taga metsas. Eesti perekonnanimed on nii naljakad!\n\n– Tere, härra Lepp! Vabandage, kas teil on praegu aega? Meil on üks küsimus. Pargis tamme all oli üks pakk. Selle sees on pilt. Kas see on hotelli oma?\n\n– Tere! Vaatame kohe, mis pilt see on. Teeme paki lahti. Nii... See on ju maal! Maali all on mingi kiri.... Ma ei näe, mis seal on. Oot-oot, kus mu prillid on?!\n\n– See on üks sõna .... see on üks nimi. Subbi. Ja 75.\n\n– Olev Subbi! Olev Subbi oli kuulus Eesti kunstnik. Ta on nüüd surnud. Tema näitus on praegu Tallinnas ühes muuseumis, vist Adamson-Ericu muuseumis.\n\n– Miks see pilt on siin Kuldse pargis? Kas see on Tallinna muuseumist varastatud? Teie hotellis elab varas!\n\n– Meil on korralik hotell! Siin ei ole ühtegi varast. Praegu on siin ainult kolm inimest. Üks noor Rootsi abielupaar – mees ja naine, ja siis üks vanem proua Tallinnast. Kes neist varas on?\n\n– Ei tea. Mida me nüüd teeme? Kas helistame politseisse? Mul on konstaabel Jaak Kilu telefoninumber…\n\n– Ei, meil on korralik hotell! Politsei siia ei tule! Kõigepealt helistame Tallinnasse Adamson-Ericu muuseumisse. Küsime, kas neil on näitusel kõik pildid ikka alles.\n\n– Kohe guugeldan muuseumi telefoni. Oodake... kuus neli neli viis kaheksa kolm kaheksa.\n\n– Üks hetk, kirjutan üles: 6445838. Kohe helistan!\n\n***\n\nVaino Lepp teeb meile kaks tassi kohvi ja helistab siis muuseumisse. Meie istume verandal diivanil, joome kohvi ja ootame. Guugeldame Olev Subbit. Ta oli Eesti kunstnik, ja ta on tõesti väga kuulus! Tema piltidel on loodus – puud ja lilled. Olev Subbi on maalinud ka inimesi. Need on sageli ilusad noored naised. Olev Subbi värvid on rõõmsad ja soojad, tema maalides on palju päikest ja valgust.\n\nTuleb Vaino ja ütleb, et Tallinnas muuseumis on kõik kunstniku pildid alles. Mitte ükski pilt pole kadunud.\n\n– Kas helistame nüüd politseisse?\n\n– Oot-oot. Mul on üks tuttav kunstnik, Lilli Pihlakas. Ta elab Kaarupi ja Kuldse vahel väikses majas jõe ääres. Kas teie ka tunnete teda?\n\n– Muidugi. Lilli Pihlakas töötab Kaarupi koolis. Helistame talle. Ehk tema teab, mis maal see on.\n\n– Helistame!\n\nLilli Pihlakas on kodus. Ta ütleb, et Olev Subbi on väga kuulus kunstnik ja tema maalid on väga kallid. Need maksavad palju, võib-olla isegi viiskümmend tuhat eurot.\n\nLilli Pihlakas teab, et üks mees kingib homme Kaarupi rahvamajale ühe maali. Kas see on Olev Subbi maal? Lilli ei tea seda. Mida nüüd teha? Me ei tea. Vaino Lepp arvab, et ootame ja vaatame. Me jätame maali hotelli ja läheme koju.\n\n***\n\nKodus teeb vanaisa süüa. Ta keedab kartuleid ja küpsetab ahjus kanaliha. Marta teeb kapsa- ja porgandisalatit hapukoore ja majoneesiga. Liisa-Krõõt jääb meile õhtusöögile. Liisa-Krõõt on taimetoitlane, tema ei söö liha, tema sööb ainult salatit ja kartulit. Meie vanaisa ja Martaga sööme kanaliha kartuli ja salatiga. Me kõik joome veini ja meil on väga lõbus. Vanaisa ja Marta räägivad meile Tartust – selles linnas on nii huvitav elu! Marta kutsub mind ja Liisa-Krõõta Tartusse külla.\n\nVarsti on koolis vaheaeg, siis sõidame Tartusse! Liisa-Krõõt tunneb Tartut. Ta oli viis aastat Tartus üliõpilane. Ta ütleb, et Tartus on huvitavad muuseumid, ilusad pargid ja Emajõgi. Tartus on ka teater ja veekeskus ehk spaa.\n\n***\n\nJärgmisel päeval on Delfi portaalis ja Facebookis suur uudis:\n\nKuulsa kunstniku Olev Subbi maal „Natüürmort punase vaasiga“ on kadunud\n\nÄrimees Tõnu Õun, kes on pärit Kaarupist, tahab kinkida Kaarupi rahvamajale kuulsa kunstniku Olev Subbi maali „Natüürmort punase vaasiga“. Kahjuks on maal hetkel kadunud. Keegi ei tea, kus maal on. Maali kirjeldus: Maali keskel on valge laud. Sellel on punane vaas, milles on roosad lilled. Vaasi kõrval on pruun taldrik, millel on õunad. Värvid on heledad ja rõõmsad.\n\nKui te teate, kus see maal on, helistage telefonil 56 56789.\n\n***\n\nHelistan Kuldse hotelli ja räägin Vaino Lepaga. Siis helistan telefonil 56 56789.\n\n– Tere! Tõnu Õun kuuleb.\n\n– Margus Mustikas siin. Helistan teile Kaarupist. Teie maal on praegu Kuldse hotellis.\n\n– Kas tõesti? Head uudised! Ma olin juba väga mures. Suur tänu teile! Mu ema on ka Kuldse hotellis. Sõidan just praegu Kuldsesse. Maal oli ema käes. Aga ta ei tea, kus maal on. Ta ei mäleta mitte midagi. Mis selle maaliga juhtus? Kus maal oli?\n\n– See maal oli eile hotelli taga Kuldse pargis, suure tamme all. Praegu on maal Kuldse hotellis. Seal töötab Vaino Lepp, maal on tema käes.\n\n– Oi-oi! Suur tänu teile. Nüüd on kõik hästi. Ma kingin täna selle maali Kaarupi rahvamajale. Palun tulge täna õhtul rahvamajja. Seal on väike pidu. Teie ja teie perekond on väga oodatud! Pidu algab kell kuus.\n\n– Aitäh kutse eest! Tuleme kindlasti.\n\n***\n\nÕhtul läheme vanaisa ja Martaga Kaarupi rahvamajja. Maja ees on palju rahvast. Ma ei tunne veel kõiki inimesi, kes Kaarupis elavad. Tunnen ainult Merikest. Tutvustan talle vanaisa ja Martat. Merike räägib meile Kaarupi uudiseid. Ta töötab poes ja teab alati kõike.\n\nSiis peatub rahvamaja ees suur must auto. Autost tuleb välja Tõnu Õun oma emaga. Tõnu Õun on umbes kuuskümmend aastat vana. Tal on hall habe ja vuntsid. Tal on seljas triibuline tumehall ülikond. Tõnu Õuna ema on vana daam, kellel on seljas pikk roosa kleit ja peas lilla kübar. Läheme kõik koos rahvamaja saali. Seinal on maal, aga keegi ei näe seda veel, sest maali peal on valge voodilina. Tõnu Õun räägib natuke kunstnikust. Olev Subbi oli kuulus kunstnik, kes elas Tallinnas. Kunstnik oli aastal 1974 ka ühe korra Kaarupis, oma sõpradel külas.\n\nTõnu Õun on rikas ärimees, kes elab Tallinnas, aga ta on sündinud Kaarupis. Tal on hea meel, et Olev Subbi maal on nüüd Kaarupi rahvamaja seinal. Nüüd tõmbab Tõnu Õun valge lina maha. Kõik plaksutavad. Maal on tõesti väga ilus!\n\nSaalis on ka pikk laud, millel on vahuvein, puuviljad ja singivõileivad. Kõik joovad vahuveini ja söövad võileibu. Nüüd tuleb lõpuks ka Liisa-Krõõt. Ta sööb natuke puuvilju: banaani ja viinamarju. Liisa-Krõõt on taimetoitlane, ta ei söö singivõileiba. Vahuvein maitseb meile kõigile.\n\n***\n\nTõnu Õun ja ta ema tulevad meie juurde. Tõnu Õun tervitab meid.\n\n– Tere! Mina olen Tõnu Õun. Aitäh teile, Liisa-Krõõt ja Margus! Tänu teile on see maal täna siin, Kaarupi rahvamaja saalis. See siin on mu ema, proua Hilda Õun. Ta on juba vana. Ta vahel ei tea, kus on tema asjad. See maal on muide väga kallis. Hea, et see nüüd siin on.\n\nHilda Õun naeratab meile ja ütleb:\n\n– Tere, mina olen Tõnu ema. Olin eile Kuldse mõisa pargis. Park on praegu sügisel väga ilus! Mul oli maal pargis kaasas. Ma ei tea, miks. Asi oli nii: jalutan ja jalutan pargis. Suured puud ja ilus järv, päike paistab ja on soe – kõik on nii tore. Siis lähen hotelli ja söön lõunat. Kell neli lähen oma tuppa ja vaatan televiisorit. Siis helistan oma pojale. Räägime Olev Subbi maalist. Järsku mõtlen: aga kus see maal siis on? Maali ei ole. Otsin igalt poolt, aga ei leia. Maali ei olnud mitte kuskil! Olen juba vana ja ei mäleta kõike...\n\nTõnu Õun vaatab oma ema ja ütleb meile:\n\n– See on hea, et ka teie olite eile Kuldse pargis. Nüüd on see ilus natüürmort lõpuks Kaarupi rahvamajas. Loodan, et see meeldib Kaarupi inimestele. Suur tänu teile!\n\nSiis Tõnu Õun naeratab ja annab Liisa-Krõõdale väikese valge ümbriku. Ümbrikus on kinkekaart:\n\nKINKEKAART\n„ROMANTILINE TARTU“\nKAKS ÖÖD HOTELLIS KOOS HOMMIKU- JA ÕHTUSÖÖGIGA\nVEEKESKUSE KÜLASTUS\nKAHE MUUSEUMI JA VANEMUISE TEATRI KÜLASTUS\n\nLiisa-Krõõt ütleb mulle: „Nüüd läheme kindlasti Tartusse!“ Elu on ilus! Marta vaatab meid ja naeratab.\n\nAinult vanaisa on kurb. Tema sõidab homme kell kolmveerand kümme tagasi Torontosse.","word_count":2269,"glossary":[{"et":"värav","en":"gate"},{"et":"kohver","en":"suitcase"},{"et":"sall","en":"scarf"},{"et":"tutvustama","en":"to introduce"},{"et":"tervislik","en":"healthy"},{"et":"patsid","en":"braids, plaits"},{"et":"mõis","en":"manor"},{"et":"tamm","en":"oak"},{"et":"perekonnanimi","en":"surname, family name"},{"et":"pakk","en":"package, parcel"},{"et":"maal","en":"painting"},{"et":"natüürmort","en":"still life (painting)"},{"et":"varas","en":"thief"},{"et":"varastatud","en":"stolen"},{"et":"kunstnik","en":"artist"},{"et":"taimetoitlane","en":"vegetarian"},{"et":"ärimees","en":"businessman"},{"et":"kinkekaart","en":"gift card, gift voucher"},{"et":"ümbrik","en":"envelope"},{"et":"plaksutama","en":"to clap, applaud"}],"questions":[{"type":"mc","q":"Kes tuleb koos vanaisaga väravast sisse?","q_en":"Who comes in through the gate with grandfather?","options":["Liisa-Krõõt","Marta","Merike"],"answer":1,"explanation_en":"The colourful lady with the orange beret is Marta, grandfather's friend from Tartu.","evidence_et":"Las ma tutvustan sulle Martat. Marta on minu sõber."},{"type":"tf","q":"Vanaisa joob kohvi piima ja suhkruga.","q_en":"Grandfather drinks coffee with milk and sugar.","options":["Õige","Vale"],"answer":1,"explanation_en":"False: grandfather may not drink coffee (doctor's orders), he drinks peppermint tea. Margus drinks coffee with milk and sugar; Marta drinks black coffee.","evidence_et":"Vanaisa joob teed. Ta ei tohi kohvi juua."},{"type":"mc","q":"Mis on suure tamme all?","q_en":"What is under the biggest oak tree?","options":["suur pakk, milles on maal","valge koer","vana kiri"],"answer":0,"explanation_en":"A big white package with a painting (a still life) inside.","evidence_et":"Tamme all on suur pakk. ... Paki sees on üks suur pilt!"},{"type":"tf","q":"Tamm on Eestis kõige populaarsem perekonnanimi.","q_en":"Tamm is the most popular surname in Estonia.","options":["Õige","Vale"],"answer":0,"explanation_en":"True: about 5,200 people have the surname Tamm ('oak').","evidence_et":"Tamm on Eestis kõige populaarsem perekonnanimi"},{"type":"mc","q":"Kes töötab Kuldse hotellis?","q_en":"Who works at the Kuldse hotel?","options":["Lilli Pihlakas","Vaino Lepp","Tõnu Õun"],"answer":1,"explanation_en":"Vaino Lepp works at the hotel. Lilli Pihlakas is an artist who works at the Kaarupi school; Tõnu Õun is a businessman.","evidence_et":"Hotellis töötab üks mees, kes elab Kaarupis. ... Mehe nimi on Vaino Lepp."},{"type":"mc","q":"Kelle käes oli maal enne, kui see kadus?","q_en":"Who had the painting before it went missing?","options":["noore Rootsi abielupaari käes","Tõnu Õuna ema Hilda käes","Lilli Pihlaka käes"],"answer":1,"explanation_en":"Tõnu Õun's elderly mother Hilda had it with her in the park and forgot it there. Nobody stole it.","evidence_et":"Maal oli ema käes. Aga ta ei tea, kus maal on."},{"type":"tf","q":"Liisa-Krõõt sööb peol singivõileiba.","q_en":"Liisa-Krõõt eats a ham sandwich at the party.","options":["Õige","Vale"],"answer":1,"explanation_en":"False: she is a vegetarian; she eats some fruit – a banana and grapes.","evidence_et":"Liisa-Krõõt on taimetoitlane, ta ei söö singivõileiba."},{"type":"mc","q":"Mis on ümbrikus, mille Tõnu Õun annab Liisa-Krõõdale?","q_en":"What is in the envelope that Tõnu Õun gives Liisa-Krõõt?","options":["kinkekaart „Romantiline Tartu“","Olev Subbi maal","raha"],"answer":0,"explanation_en":"A gift card 'Romantic Tartu': two nights in a hotel with breakfast and dinner, a water park, two museums and the Vanemuine theatre.","evidence_et":"Ümbrikus on kinkekaart:"}]},{"chapter":4,"title":"KUULUS POISS TALLINNAS","text_et":"Hommikul tõusen vara, juba kell viis. Kas minu äratuskell heliseb? Mul ei ole ju äratuskella, vaid ainult mobiiltelefon. Minu mobla heliseb kell viis. Olen unine. Lähen kööki. Vanaisa ja Marta on juba köögis. Vanaisa keedab kohvi ja teed, Marta teeb võileibu. Laual on kolm kohvitassi ja suur punane taldrik. Taldrikul on kolm tükki õunakooki. Marta paneb võileivad taldrikule. Nüüd on taldrikul ka kolm juustuvõileiba, kolm vorstivõileiba kurgiga ja kolm singivõileiba tomatiga.\n\n– Tule sööma, Margus!\n\n– Aitäh, Marta! Kas sina ei ole unine? Ma olen nii unine! Ma ei ärka kunagi hommikul nii vara…\n\n– Ma ei ole unine. Olen kurb, sest sinu vanaisa sõidab täna Kanadasse.\n\n– Mina olen ka kurb. Aga ta tuleb varsti jälle Eestisse.\n\nVanaisa seisab pliidi ääres. Ta on ka kurb.\n\n***\n\nMe sööme hommikust. Mulle maitsevad võileivad, söön kuus võileiba. Söön ka kaks tükki õunakooki. Marta sööb ainult ühe juustuvõileiva. Vanaisa ei söö mitte midagi. Ta joob teed. Siis võtab vanaisa oma kohvri. Mina võtan vanaisa seljakoti. Me läheme välja. Vanaisa seisab maja trepil ja vaatab meid. Kas teeme kõik koos veel ühe selfi? Teeme pilti minu moblaga.\n\nSiis istume autosse. See on punane rendiauto. Vanaisa sõidab. Marta istub ette vanaisa kõrvale. Mina istun taha. Võtan oma mobla ja saadan meie selfi emale. Kirjutan veel sõnumi:\n\nTervitused Kaarupist! Sõidame praegu Tallinnasse. Vanaisa lend on kell kolmveerand kümme. Vanaisa ja Marta tervitavad!\n\nEestis on kell pool kuus hommikul. Torontos on praegu õhtu, kell on pool üksteist. Kas mu ema magab juba? Ei, ema ei maga. Pinn! Saan emalt sõnumi. Ema kirjutab, et nad olid isaga restoranis, lähevad praegu koju. Nad tervitavad meid. Nad soovivad vanaisale head reisi. Ka ema saadab mulle selfi. Pildil on ema ja isa. Nad on väljas, sest nende taga on Toronto teletorn.\n\n***\n\nKell pool kaheksa jõuame Tallinna lennujaama. Vanaisa viib rendiauto rendifirmasse tagasi. Siis võtame tema kohvri ja seljakoti, läheme lennujaama terminali. Lennujaamas ootame natuke. Lennuk Londonisse läheb alles kell kolmveerand kümme. Joome kohvikus kohvi ja teed. Vanaisa on nüüd näljane. Ta sööb kartulisalatit ja kapsapirukat. Meie Martaga joome ainult kohvi.\n\nVanaisa lendab Tallinnast Londonisse ja siis Londonist Torontosse. Lennuk Torontosse väljub alles kell üheksa õhtul. Tal on Londonis palju aega – seitse tundi! Vanaisale ei meeldi lennujaamad. Vanaisa ütleb, et ta läheb Londoni kesklinna. Ta sõidab lennujaamast kesklinna metrooga – käib muuseumis ja jalutab paar tundi linna peal.\n\nNüüd läheb vanaisa lennukile. Alati on kurb, kui keegi ära sõidab. Marta nutab. Me kallistame vanaisa. Ta lubab, et ta tuleb varsti jälle Eestisse. Nüüd läheb Marta bussiga Tartusse. Jalutame bussipeatusesse, mis on lennujaama taga. Seal on ka trammipeatus. Ütlen Martale head aega ja mõtlen: aga mida mina täna teen? Kas lähen koju või jään Tallinnasse? Siis tuleb tramm. Lähen trammi peale.\n\n***\n\nTrammis on ainult kaks inimest – tüdruk ja poiss. Neil on suured seljakotid. Nad on vist turistid. Nad tulevad minu juurde. Räägime juttu. Räägime inglise keeles, sest nad on turistid ja ei oska eesti keelt.\n\nTüdruku nimi on Mingmei. Ta on pärit Hiinast, aga ta õpib Hamburgi ülikoolis. Ta on kakskümmend kaks aastat vana. Mingmei õpib ajalugu ja psühholoogiat. Poisi nimi on Günther. Ta on sama vana kui mina – kakskümmend kuus. Günther õpib ülikoolis hiina ja vietnami keelt. Talle meeldib ka ajalugu. Praegu on ülikoolis vaheaeg. Nad on Tallinnas viis päeva. Siis sõidavad nad laevaga edasi Soome, Helsingisse.\n\nNad küsivad, kus on Tallinna vanalinn. Kas tramm sõidab sinna? Jah, tramm sõidab küll sinna. Ka mina lähen Tallinna vanalinna. Kas lähme koos? Mul on täna palju aega ja mulle meeldivad vanad majad. Tallinn on rohkem kui kaheksasada aastat vana. Kõige vanem maja siin on peaaegu viissada aastat vana! See on ikka väga vana! Torontos on kõige vanem maja ainult kahesaja-aastane.\n\n***\n\nLäheme trammist välja Viru peatuses. Jalutame mööda Viru tänavat vanalinna. Teeme telefoniga pilte ja räägime juttu. Viru väravad ei olegi väravad, vaid ainult kaks vana torni. Paarsada aastat tagasi olid siin väravad, aga enam ei ole. Müürivahe tänaval on vana kõrge kivisein – see on linnamüür. Tallinna linnamüür on rohkem kui seitsesada aastat vana. Linnamüüris on vanad tornid, neil on kõigil nimed – Neitsitorn, Nunnatorn, Kitsetorn. Tallinna linnamüüris on kokku kolmkümmend kaks torni!\n\nVanalinna kõige romantilisem tänav on Katariina Käik. See on üks väga kitsas tänav, mis on Vene ja Müürivahe tänava vahel. Praegu on seal suveniiripoed ja kohvikud. Jalutame Raekoja platsile. Plats on sama mis väljak. See on vana sõna, mis tuleb saksa keelest. Platz, ütleb Günther ja naeratab.\n\n***\n\nJalutame veel vanalinnas – käime Pikal tänaval, kus on ka ilusad vanad majad. Läheme Suurgildi majasse, kus on praegu ajaloomuuseum. Vaatame Pika jala väravatorni. Värava taga algab Pikk jalg – tänav, mis viib üles Toompeale. Ka Lühike jalg on tänav, aga tegelikult on see üks suur trepp. Käime Toompeal – see on mägi, mis on vanalinnas. Toompea oli mitusada aastat tagasi eraldi linn. Siin on ka ilusad kirikud ja veel palju-palju vanu maju.\n\nMeil on kõhud tühjad. Kas läheme sööma? Jalutame tagasi alla Raekoja platsile. Siin on palju kohvikuid ja restorane. Vaatame ringi. Mingmei ja Günther ütlevad, et siin on kõik väga kallis. Kus on odavad restoranid? Ja kus käivad Eesti noored?\n\n***\n\nKüsime seda ühelt naiselt. Ta ütleb, et üliõpilased ja noored inimesed käivad kõik Telliskivis. Telliskivi? Mis see on? Telliskivi Loomelinnak on Eesti kõige suurem loomekeskus. Seal olid viiskümmend aastat tagasi tehased ja vabrikud. Nüüd on seal kunstigaleriid, muuseumid, klubid, kontserdi- ja teatrisaalid. Ja palju-palju kohvikuid ja restorane. Ja kus see asub? Naine ütleb, et see ei ole kaugel. Raekoja platsilt jala umbes kümme minutit.\n\nJalutame mööda Nunne tänavat. Läheme üle Toompuiestee. Jõuame Balti jaama – see on Eesti kõige suurem rongijaam. Jaama taga on tore Balti jaama turg – seal on ka väga huvitav, aga meil on kõhud tühjad. Oleme väga näljased. Turu taga algabki Telliskivi kvartal ja loomelinnak. Läheme ühte väiksesse restorani, mis on vanas tehases. Tellime süüa. Günther on taimetoitlane, tema tellib köögiviljad kartulipudruga. Mingmei võtab kalasuppi ja musta leiba. Mina armastan seeni – tellin seene-sibula risoto.\n\n***\n\nIstume restoranis, sööme-joome ja räägime juttu. Mingmeile ja Güntherile meeldib Tallinn. Järsku tuleb meie laua juurde üks tüdruk. Ta vaatab mind ja ütleb „Tere!“ Tal on hea meel, et ma olen täna Tallinnas. Ma ütlen, et mul on ka hea meel. Siis tüdruk teeb minuga selfi. Ta on nii õnnelik! Tal on nüüd pilt kuulsa inimesega! Tüdruk lehvitab ja läheb ära.\n\nSiis tuleb restorani veel kaks tüdrukut. Nad näevad mind ja tulevad ka meie laua juurde. Nad teevad minust pilti. Viie minuti pärast tuleb veel üks tüdruk. Ka tema teeb minuga ühe selfi. Siis küsib ta minult autogrammi. Tal on käes postkaart. Kirjutan tema postkaardile oma nime: Margus Mustikas. Tüdruk vaatab seda ja naerab. Ta ütleb, et mul on hea huumor. Siis võtab tüdruk telefoni ja helistab. Ta vaatab tagasi, lehvitab ja naeratab mulle.\n\nKahe minuti pärast tuleb restorani veel üks tüdruk. Ta vaatab ringi, näeb mind ja tuleb meie laua juurde. Temagi küsib minult autogrammi. Kirjutan ka talle oma nime: Margus Mustikas.\n\n***\n\nMingmei ja Günther küsivad, kes need tüdrukud on. Ma ei tea. Aga mida see siis tähendab? Kas ma olen kuulus? Kas ma olen näitleja, kunstnik, laulja või kirjanik? Ma ei ole kirjanik ega näitleja, ma olen itimees. Ma ei ole kuulus, nagu Bill Gates või Steve Jobs. Tallinnas ei tunne mind mitte keegi. See kõik on väga imelik! Ma ei saa aru...\n\nKa üks restorani töötaja tuleb meie laua juurde, võtab oma telefoni ja teeb minuga ühe selfi. Siis ta küsib, mis kell mul täna kontsert on. Mis kontsert? Ma ei tea midagi kontserdist. Ma söön siin lõunat. Ettekandja ütleb, et hea küll, hea küll. Täna ei ole enam pileteid, kõik on otsas. Need kontserdid on nii populaarsed. Aga millal on järgmine kontsert? See on väga imelik! Mida see kõik tähendab? Siis vaatan aknast välja. Akna taga seisab kuus tüdrukut. Nad vaatavad mind, lehvitavad mulle ja räägivad midagi. Siis nad tulevad restorani uksest sisse, nad jooksevad meie laua poole. Tõusen püsti ja jooksen WC-sse. Tüdrukud jooksevad mulle järele. Nad karjuvad: „Oota, Karl-Erik! Oota!“\n\n***\n\nOlen WC-s. Tüdrukud on ukse taga. Mida ma nüüd teen? Helistan Liisa-Krõõdale.\n\n– Liisa-Krõõt, appi!\n\n– Mis on? Kus sa oled?\n\n– Ma olen Tallinnas. Olen praegu Telliskivis ühes restoranis. Siin on mingid hullud tüdrukud. Nad küsivad minult autogrammi ja teevad minuga selfisid. See on väga imelik…\n\n– Mida?\n\n– … ja ma olen praegu WC-s. Tüdrukud on WC ukse taga ja ootavad mind...\n\n– Margus, ma ei usu sind! Kas sa oled haige? Kas sa oled veini joonud?\n\n– … ja need tüdrukud karjuvad: Karl-Erik! Karl-Erik!\n\n– Karl-Erik? Taukar? Hahahaa! Sa oled küll Karl-Erik Taukari moodi. Te olete temaga sarnased.\n\n– Kelle moodi?\n\n– Karl-Erik Taukar on üks Eesti laulja. Ta on väga kuulus.\n\n***\n\nTulen WC-st välja. Tüdrukud seisavad ja naeratavad mulle. Ütlen neile oma nime. Ma olen Margus Mustikas, olen itimees. Elan Kaarupi külas. Ma ei ole laulja. Ma ei ole Karl-Erik Taukar.\n\nTüdrukud karjuvad: „Oi, kui nunnu!“ Nad naeravad. Tüdrukud ei lähe ära. Siis ütleb keegi „Vabandust!“. See on restorani töötaja. Ta ütleb, et Karl-Erik Taukar on praegu tõesti Telliskivi Loomelinnakus. Aga ta istub ühes teises restoranis, siin kõrval. Tüdrukud jooksevad uksest välja. Restorani töötaja vabandab. Ta näitab mulle oma telefonis selle laulja pilti. See poiss on tõesti minu moodi.\n\nRäägin Mingmeile ja Güntherile, et ma näen välja nagu kuulus Eesti laulja. Aga ma ei ole laulja. Naerame. Joome veel ühe kohvi. Siis maksame ja läheme restoranist välja.\n\n***\n\nRestorani ees seisab Karl-Erik Taukar! Ta tuleb meie juurde. Me oleme tõesti väga sarnased! Saame tuttavaks ja räägime juttu. Missugune muusika mulle meeldib? Mulle meeldib Eesti jazz, aga ma ei tunne veel nii hästi Eesti muusikat. Mingmei ja Günther on välismaa turistid, nemad ei tea üldse Eesti muusikat. Karl-Erik Taukar annab meile kolm piletit. Kahe tunni pärast, kell seitse on Vabal Laval tema kontsert. Nii tore! Aga mis on Vaba Lava? Ah et kontserdisaal? Suur tänu, Karl-Erik!\n\nMingmeil ja Güntheril on õhtu vaba. Nad lähevad praegu hotelli. Nad viivad sinna oma seljakotid. Siis nad tulevad Telliskivisse tagasi. Me saame kokku kell pool seitse Vaba Lava ees. Mina helistan Liisa-Krõõdale. Räägin talle, et lähen õhtul kontserdile. Kahju, et Liisa-Krõõt ei ole minuga koos Tallinnas.\n\n***\n\nKell pool seitse tulevad Mingmei ja Günther Vaba Lava ette. Joome kohvikus ühe kohvi ja sööme salatit. Räägin Mingmeile ja Güntherile Eestist – Eesti loodusest, toitudest, oma õunamoosist ja vanaisast.\n\nKell seitse läheme Vaba Lava kontserdisaali. Seal on palju rahvast. Kontsert on väga tore. Mulle meeldib kõige rohkem laul „Tähti täis on öö“. Karl-Erik Taukar laulab:\n\nLiigun teiste tuules,\nmuud ei näe, ei kuule.\nLootusetult aeg kaob käest.\nJuba mitmes õhtu,\nveel ei tea, mis juhtub,\nkui kahtlaselt kõik vaikseks jääb.\nNii kesköö eel sind kohtan jälle,\njuhuslikult leian su.\nSiis haarad käest ja ütled mulle,\ntuled kustuta, tuled kustuta,\ntuled kustuta, tuled kustuta.\nSest tähti täis on öö,\nsee kisub kaasa\nja enda sisse neelata võiks meid.\nTähti täis on öö,\nsee meid haarab\nja meeletusteks annab põhjuseid.\nTähti täis on öö.\n\nKarl-Erik Taukar laulab ja mina mõtlen Liisa-Krõõdale.","word_count":1822,"glossary":[{"et":"äratuskell","en":"alarm clock"},{"et":"mobla","en":"mobile phone (colloquial)"},{"et":"unine","en":"sleepy"},{"et":"seljakott","en":"backpack"},{"et":"rendiauto","en":"rental car"},{"et":"lennujaam","en":"airport"},{"et":"nutma","en":"to cry"},{"et":"kallistama","en":"to hug"},{"et":"vanalinn","en":"old town"},{"et":
