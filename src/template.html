<style>
/* Layout: sticky header (countdown + tabs) over a single 860px study column; each tab is one view. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --sunk: #e9eeee; --ink: #15212c; --muted: #5a6874; --line: #d8e0e3;
  --accent: #2c5cb0; --accent-ink: #ffffff; --soft: #e5edf9;
  --good: #23784a; --good-soft: #e1f2e8; --warn: #a8620c; --warn-soft: #fbefdc; --bad: #b0352d; --bad-soft: #f9e3e1;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #161f28; --sunk: #111920; --ink: #e4ebf0; --muted: #94a2ae; --line: #26323d;
  --accent: #82a6ea; --accent-ink: #0b1220; --soft: #1a2a42;
  --good: #63c58f; --good-soft: #15291f; --warn: #e3a752; --warn-soft: #2d2213; --bad: #ef8178; --bad-soft: #321a19;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #161f28; --sunk: #111920; --ink: #e4ebf0; --muted: #94a2ae; --line: #26323d;
  --accent: #82a6ea; --accent-ink: #0b1220; --soft: #1a2a42;
  --good: #63c58f; --good-soft: #15291f; --warn: #e3a752; --warn-soft: #2d2213; --bad: #ef8178; --bad-soft: #321a19;
  color-scheme: dark }

* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100% }
body { margin: 0; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0 }
h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.01em }
h3 { font-size: 1.15rem; font-weight: 700 }
p { margin: 0 }
a { color: var(--accent) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: .875rem }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 6px; flex-wrap: wrap }
.brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em }
.brand h1 span { color: var(--accent) }
.count { display: flex; align-items: baseline; gap: 8px; font-size: .9rem; color: var(--muted) }
.count b { font-family: var(--mono); font-size: 1.15rem; color: var(--ink) }
.sync { font-size: .75rem; color: var(--muted) }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -6px }
nav.tabs::-webkit-scrollbar { display: none }
nav.tabs button { background: none; border: 0; padding: 10px 10px 12px; cursor: pointer; color: var(--muted); font-weight: 700; white-space: nowrap; border-bottom: 3px solid transparent }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
nav.tabs button .pill { margin-left: 4px }
.timer { display: inline-flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 99px; padding: 3px 4px 3px 12px; font-size: .85rem }
.timer.low { background: var(--warn-soft) }

main { padding-block: 24px 80px; display: grid; gap: 20px }
section.view { display: grid; gap: 20px; min-width: 0 }
section.view > *, main > * { min-width: 0; max-width: 100% }
.card, details, .stat { overflow-wrap: anywhere }
.intro { display: grid; gap: 6px }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0 }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }
.stack { display: grid; gap: 8px }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; text-decoration: none; color: var(--ink) }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.good { background: var(--good); color: var(--accent-ink); border-color: var(--good) }
.btn.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px }
.btn:disabled { opacity: .5; cursor: default }
.btn.sm { padding: 4px 10px; font-size: .85rem }

.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-size: .875rem; font-weight: 700; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--soft); color: var(--accent); border-color: var(--accent) }
.pill { display: inline-block; border-radius: 99px; padding: 1px 8px; font-size: .75rem; font-weight: 700; background: var(--sunk); color: var(--muted); font-family: var(--mono) }
.pill.good { background: var(--good-soft); color: var(--good) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.acc { background: var(--soft); color: var(--accent) }

input[type="text"], textarea, select { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; min-width: 0 }
textarea { min-height: 160px; resize: vertical; line-height: 1.6 }
input.right { border-color: var(--good); background: var(--good-soft) }
input.almost { border-color: var(--warn); background: var(--warn-soft) }
input.wrong { border-color: var(--bad); background: var(--bad-soft) }

.keys { display: flex; gap: 4px; flex-wrap: wrap }
.keys button { width: 34px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 700 }

.fb { border-radius: 8px; padding: 10px 12px; font-size: .95rem }
.fb.right { background: var(--good-soft); color: var(--good) }
.fb.almost { background: var(--warn-soft); color: var(--warn) }
.fb.wrong { background: var(--bad-soft); color: var(--bad) }
.fb b { color: var(--ink) }

/* today */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center }
.big { font-family: var(--display); font-weight: 800; font-size: 4.5rem; line-height: .9; color: var(--accent); letter-spacing: -.04em }
.parts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.part { background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px }
.part b { font-family: var(--display) }
.part .num { color: var(--muted); font-size: .8rem }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; position: relative }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px }
.bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink) }
.days { display: flex; gap: 4px; flex-wrap: wrap }
.days button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--mono); font-weight: 500 }
.days button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.days button.done { border-color: var(--good); color: var(--good) }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer }
.check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--accent); flex: none }
.check.done span { color: var(--muted); text-decoration: line-through }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; cursor: pointer; text-align: left }
.stat b { font-family: var(--display); font-size: 1.8rem; line-height: 1 }

/* flashcard */
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 22px; display: grid; gap: 14px; text-align: center; min-height: 260px; align-content: center }
.flash .word { font-family: var(--display); font-size: 2.3rem; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere }
.flash .forms { font-family: var(--mono); color: var(--muted) }
.flash .ex { font-style: italic }
.progress { display: flex; align-items: center; gap: 10px }
.progress .bar { flex: 1 }

table.list { width: 100%; border-collapse: collapse; font-size: .95rem }
table.list td, table.list th { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top }
table.list th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.scroll { overflow-x: auto; max-width: 100% }
.explain table { border-collapse: collapse; margin: 6px 0 }
.explain td, .explain th { border: 1px solid var(--line); padding: 4px 8px; text-align: left }

/* reading */
.text { background: var(--sunk); border-radius: 8px; padding: 16px 18px; white-space: pre-wrap; line-height: 1.7; font-size: 1.02rem; overflow-wrap: anywhere }
.q { display: grid; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line) }
.q:first-child { border-top: 0 }
.opts { display: grid; gap: 4px }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent }
.opt:hover { background: var(--sunk) }
.opt input { margin-top: 5px; accent-color: var(--accent); flex: none }
.opt.right { background: var(--good-soft); border-color: var(--good) }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad) }
.list-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; width: 100% }
.list-item:hover { border-color: var(--accent) }
.list-item .t { font-weight: 700 }
.gloss { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .9rem }
.gloss span b { font-weight: 700 }

/* writing: business card */
.vcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; max-width: 360px; box-shadow: 0 1px 0 var(--line), 0 6px 18px -10px rgba(20,33,44,.35); display: grid; gap: 2px; font-size: .95rem }
.vcard .n { font-family: var(--display); font-weight: 800; font-size: 1.25rem }
.vcard .r { color: var(--accent); font-weight: 700; margin-bottom: 6px }
.wc { font-family: var(--mono); font-size: .85rem }
.model { background: var(--good-soft); border-radius: 8px; padding: 14px 16px; white-space: pre-wrap; line-height: 1.65 }
.err { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; font-size: .95rem; padding-block: 6px; border-top: 1px solid var(--line) }
.err s { color: var(--bad) }
.err ins { color: var(--good); text-decoration: none; font-weight: 700 }
.err .why { grid-column: 1 / -1; color: var(--muted); font-size: .875rem }

/* chat */
.chat { display: grid; gap: 10px }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; display: grid; gap: 6px }
.msg.ex { background: var(--soft); justify-self: start; border-bottom-left-radius: 4px }
.msg.me { background: var(--sunk); justify-self: end; border-bottom-right-radius: 4px }
.msg .fix { font-size: .875rem; color: var(--warn) }
.msg .q1 { font-weight: 700; font-size: 1.05rem }

details { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 16px }
details summary { cursor: pointer; font-weight: 700; font-family: var(--display) }
details[open] summary { margin-bottom: 10px }
.phr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; font-size: .95rem }
.phr .e { color: var(--muted) }
ul.tight { margin: 0; padding-left: 20px; display: grid; gap: 4px }
.speak { border: 0; background: var(--soft); color: var(--accent); width: 32px; height: 32px; border-radius: 99px; cursor: pointer; display: inline-grid; place-items: center; flex: none }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center }

@media (max-width: 560px) {
  h2 { font-size: 1.4rem }
  .hero { grid-template-columns: 1fr; gap: 8px }
  .big { font-size: 3.4rem }
  .parts { grid-template-columns: repeat(2, 1fr) }
  .flash .word { font-size: 1.8rem }
  .phr, .err { grid-template-columns: 1fr }
  .phr .e { margin-bottom: 6px }
  .count span.long { display: none }
}
@media (prefers-reduced-motion: no-preference) {
  .flash, .fb { animation: rise .18s ease-out }
  @keyframes rise { from { transform: translateY(4px) } to { transform: none } }
}
input[type="password"] { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; min-width: 0 }
[hidden] { display: none !important }
img { max-width: 100% }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Eksamiks <span>valmis</span></h1>
      <div class="row">
        <div id="timer" hidden></div>
        <div class="count"><b id="cd">–</b><span class="long">until A2 exam · Sat 7 Nov, 10:00</span></div>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<script id="data" type="application/json">/*__DATA__*/</script>
<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0/+esm";
window.Anthropic = Anthropic;
window.dispatchEvent(new Event("sdk-ready"));
</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const EXAM = new Date(2026, 10, 7, 10, 0);
const PLAN_START = new Date(2026, 9, 26);
const INTERVALS = [0, 1, 2, 3, 5, 8];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayNum = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 6e4) / 864e5);
const TODAY = dayNum();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };
const norm = s => String(s ?? "").toLowerCase().replace(/[.,!?;:"“”„«»()\[\]]/g, " ").replace(/[–—-]/g, "-").replace(/\s+/g, " ").trim();
const flat = s => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
function grade(given, answers) {
  const g = norm(given);
  if (!g) return "wrong";
  const list = answers.filter(a => a != null && String(a).trim() !== "");
  if (list.some(a => norm(a) === g)) return "right";
  if (list.some(a => flat(a) === flat(given))) return "almost";
  return "wrong";
}
const altsOf = et => {
  const base = String(et).replace(/\([^)]*\)/g, "");
  const parts = base.split(/\s*[\/;]\s*/).map(s => s.trim()).filter(Boolean);
  return parts.length ? parts : [String(et)];
};
const words = s => (String(s).trim().match(/[\p{L}\p{N}][\p{L}\p{N}'’.-]*/gu) || []).length;
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const KEYS = ["õ", "ä", "ö", "ü", "š", "ž"];
let lastInput = null;
document.addEventListener("focusin", e => { if (e.target.matches("input[type=text], textarea")) lastInput = e.target });
const keysHtml = () => `<div class="keys" aria-label="Estonian letters">${KEYS.map(k => `<button type="button" data-key="${k}" tabindex="-1">${k}</button>`).join("")}</div>`;
document.addEventListener("mousedown", e => { if (e.target.closest("[data-key]")) e.preventDefault() });
document.addEventListener("click", e => {
  const k = e.target.closest("[data-key]");
  if (!k || !lastInput) return;
  const el = lastInput, s = el.selectionStart ?? el.value.length, en = el.selectionEnd ?? s;
  el.value = el.value.slice(0, s) + k.dataset.key + el.value.slice(en);
  el.setSelectionRange(s + 1, s + 1); el.focus(); el.dispatchEvent(new Event("input", { bubbles: true }));
});

/* ---------- text to speech (only when the device has an Estonian voice) ---------- */
let etVoice = null;
function pickVoice() { try { etVoice = speechSynthesis.getVoices().find(v => /^et\b/i.test(v.lang)) || null } catch { etVoice = null } }
try { pickVoice(); speechSynthesis.onvoiceschanged = () => { pickVoice(); if (etVoice) render() } } catch {}
const SPK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const clipFor = text => { const k = ["q:", "w:", "g:", "dlg:"].map(p => p + text).find(k => AUDIO[k]); return k ? "audio/" + AUDIO[k] : "" };
const speakBtn = text => clipFor(text) ? `<button class="speak" type="button" data-clip="${esc(clipFor(text))}" title="Listen" aria-label="Listen">${SPK}</button>` : etVoice ? `<button class="speak" type="button" data-say="${esc(text)}" title="Listen" aria-label="Listen">${SPK}</button>` : "";
function say(text, rate = 0.85) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = etVoice; u.lang = "et-EE"; u.rate = rate; speechSynthesis.speak(u) } catch {} }
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) say(b.dataset.say) });
let clip = null;
document.addEventListener("click", e => { const b = e.target.closest("[data-clip]"); if (!b) return; try { clip?.pause(); clip = new Audio(b.dataset.clip); clip.play().catch(() => {}) } catch {} });

/* ---------- state: browser copy for speed, account copy (db) to sync devices ---------- */
const BLANK = () => ({ v: 1, updated: 0, srs: {}, plan: {}, gram: {}, read: {}, mistakes: [], writes: [], intro: "", streak: { last: 0, n: 0 } });
let S = BLANK();
const LS = "eksamiks-valmis-v1";
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(BLANK(), JSON.parse(raw)) } catch {}
let syncMsg = "Progress is saved on this device. Use Settings → Back up to move it to another device.";
function save() {
  S.updated = Date.now();
  if (S.streak.last !== TODAY) { S.streak.n = S.streak.last === TODAY - 1 ? S.streak.n + 1 : 1; S.streak.last = TODAY }
  try { localStorage.setItem(LS, JSON.stringify(S)) } catch {}
}
function setSync(t) { syncMsg = t; const el = $("#sync"); if (el) el.textContent = t }
/* ---------- AI: Claude via the user's own API key (stored on this device only) ---------- */
const KEY_LS = "eksamiks-valmis-key";
const MODEL = "claude-opus-5-5";
let apiKey = "";
try { apiKey = localStorage.getItem(KEY_LS) || "" } catch {}
let sample = null;
function setupAI() {
  sample = null;
  if (!apiKey || !window.Anthropic) return;
  const client = new window.Anthropic({ apiKey, dangerouslyAllowBrowser: true, maxRetries: 1 });
  sample = async (input, schema, effort = "low", system) => {
    const messages = typeof input === "string" ? [{ role: "user", content: input }] : input;
    const res = await client.beta.messages.create({
      model: MODEL, max_tokens: 8000, messages,
      ...(system ? { system } : {}),
      output_config: { effort, format: { type: "json_schema", schema } },
      betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
    });
    if (res.stop_reason === "refusal") throw { code: "refused" };
    if (res.stop_reason === "max_tokens") throw { code: "truncated" };
    const text = res.content.filter(b => b.type === "text").map(b => b.text).join("");

${t.card ? "BUSINESS CARD: " + t.card.card.join(" | ") + "\n" : ""}CONTENT POINTS TO COVER: ${t.points.join("; ")}

"""${x.text}"""

Return ONLY JSON:
{"score": integer 0-10 (rough estimate of this task's quality against the criteria),

async function chatTurn(userText) {
  const s = V.s; if (!sample || s.busy) return;

  if (userText != null) s.chat.push({ role: "user", content: userText, shown: userText });

    const r = await sample(msgs, SCHEMA.examiner, "low", EXAMINER(topic));

    if (userText != null && r.corrected && norm(r.corrected) !== norm(userText)) { addMistake("speaking", r.feedback || "Speaking answer", r.corrected, userText); save() }
    s.draft = "";
  } catch (e) { s.err = aiError(e); if (userText != null) { s.chat.pop(); s.draft = userText } }
  s.busy = false; render();
  const c = $("#s-chat-in"); if (c) c.focus();
}
async function introAI() {
  const s = V.s; if (!sample || s.busy || !S.intro.trim()) return;
  s.busy = true; s.err = ""; render();
  try {
    s.introFb = await sample(`An English-speaking learner wrote a self-introduction to say aloud at the start of the Estonian A2 oral exam (Harno). Correct it and make it natural but keep it simple A2 Estonian, 6-9 short sentences, easy to memorise. Keep their personal facts.
TEXT: """${S.intro}"""
Return JSON: {"errors": [{"wrong": "...", "right": "...", "why": "short English reason"}] (max 8), "corrected": "full polished text", "tip": "one English tip, e.g. a sentence worth adding"}`, SCHEMA.intro, "medium");
  } catch (e) { s.err = aiError(e) }
  s.busy = false; render();
}
document.addEventListener("click", e => {
  const m = e.target.closest("[data-smode]"); if (m) { V.s.mode = m.dataset.smode; V.s.err = ""; render(); return }
  const tp = e.target.closest("[data-stopic]"); if (tp) { V.s.topic = +tp.dataset.stopic; V.s.qi = 0; V.s.showStart = false; render(); return }
  const a = e.target.closest("[data-act]")?.dataset.act; if (!a || !a.startsWith("s-")) return;
  const s = V.s;
  if (a === "s-next") { s.qi++; s.showStart = false; render() }
  if (a === "s-start") { s.showStart = !s.showStart; render() }
  if (a === "s-rpshow") { s.rpShown = !s.rpShown; render() }
  if (a === "s-rpnext") { s.card++; s.rp = {}; s.rpShown = false; render() }
  if (a === "s-chatstart") chatTurn(null);
  if (a === "s-reset") { s.chat = []; s.draft = ""; render() }
  if (a === "s-introai") introAI();
});
document.addEventListener("change", e => { if (e.target.id === "s-ctopic") { V.s.chatTopic = +e.target.value; V.s.chat = []; render() } });
document.addEventListener("submit", e => { if (e.target.dataset.form === "s-chat") { e.preventDefault(); const v = $("#s-chat-in").value.trim(); if (v) chatTurn(v) } });
document.addEventListener("keydown", e => { if (e.target.id === "s-chat-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit() } });

/* ---------- Mistakes ---------- */
V.m = { drill: null, i: 0, res: null, given: "" };
const KIND = { word: "Word", grammar: "Grammar", reading: "Reading", writing: "Writing", speaking: "Speaking" };
VIEWS.mistakes = () => {
  const m = V.m;
  if (m.drill) {
    const d = m.drill[m.i];
    if (!d) { m.drill = null; return VIEWS.mistakes() }
    return `<div class="row"><button class="btn ghost" data-act="m-stop">← Back to the list</button></div>
    <div class="card"><div class="progress"><span class="small muted num">${m.i + 1}/${m.drill.length}</span><div class="bar"><i style="width:${m.i / m.drill.length * 100}%"></i></div><span class="pill">${KIND[d.kind]}</span></div>
      <form class="stack" data-form="m-check"><p style="font-size:1.15rem"><b>${esc(d.prompt)}</b></p>${d.extra ? `<p class="small muted">${esc(d.extra)}</p>` : ""}
      <input type="text" id="m-in" class="${m.res || ""}" value="${esc(m.given)}" ${m.res ? "readonly" : ""} autocomplete="off" spellcheck="false" placeholder="Type the correct answer">
      ${m.res ? `<div class="fb ${m.res}">${m.res === "wrong" ? `Answer: <b>${esc(d.answer)}</b>. It stays on your list.` : "Correct, so it's off your list."}</div><button class="btn primary" type="button" data-act="m-next">Next</button>` : `${keysHtml()}<button class="btn primary">Check</button>`}
      </form></div>`;
  }
  if (!S.mistakes.length) return `<div class="intro"><h2>Mistakes</h2></div><div class="card empty"><h3>No mistakes saved yet</h3><p>Anything you get wrong in Words, Grammar, Reading, Writing or Speaking lands here so you can drill it until it sticks.</p></div>`;
  return `<div class="intro"><h2>Mistakes</h2><p class="muted">Everything you got wrong, newest first. Drill them: a correct answer removes the item.</p></div>
  <div class="row"><button class="btn primary" data-act="m-drill">Drill ${Math.min(20, S.mistakes.length)} mistakes</button><button class="btn ghost" data-act="m-clear">${V.m.confirm ? "Tap again to clear all" : "Clear all"}</button></div>
  <div class="card"><div class="scroll"><table class="list"><thead><tr><th>Type</th><th>Question</th><th>Correct</th><th>You wrote</th></tr></thead><tbody>
  ${S.mistakes.slice(0, 120).map(x => `<tr><td><span class="pill">${KIND[x.kind] || x.kind}</span></td><td>${esc(x.prompt)}${x.extra ? `<div class="small muted">${esc(x.extra)}</div>` : ""}</td><td><b style="color:var(--good)">${esc(x.answer)}</b></td><td class="muted">${esc(x.given)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
};
function misCheck() {
  const m = V.m;
  if (m.res) { m.i++; m.res = null; m.given = ""; render(); return }
  const d = m.drill[m.i]; m.given = $("#m-in").value; m.res = grade(m.given, [d.answer]);
  if (m.res !== "wrong") { S.mistakes = S.mistakes.filter(x => x !== d && !(x.kind === d.kind && x.prompt === d.prompt)); save() }
  render();
}
AFTER.mistakes = () => { const i = $("#m-in"); if (i && !V.m.res) i.focus() };
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]")?.dataset.act; if (!a || !a.startsWith("m-")) return;
  if (a === "m-drill") { V.m = { drill: shuffle(S.mistakes.filter(x => x.answer)).slice(0, 20), i: 0, res: null, given: "" }; render() }
  if (a === "m-next") misCheck();
  if (a === "m-stop") { V.m.drill = null; render() }
  if (a === "m-clear") { if (V.m.confirm) { S.mistakes = []; V.m.confirm = false; save() } else V.m.confirm = true; render() }
});

/* ---------- Guide ---------- */
VIEWS.guide = () => {
  const ex = R.exam || {};
  const parts = (ex.parts || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  return `<div class="intro"><h2>The A2 exam, in short</h2><p class="muted">${esc(ex.date_note || "")}</p></div>
  <div class="card"><div class="grid2">
    <div class="stack"><span class="label">To pass</span><p>${esc(ex.pass_rule)}</p></div>
    <div class="stack"><span class="label">Allowed</span><p>${esc(ex.allowed)}</p></div>
  </div></div>
  ${parts.map(p => `<div class="card"><div class="row between"><h3>${esc(p.name_en)} <span class="muted small">${esc(p.name_et)}</span></h3><span class="row"><span class="pill acc num">${esc(p.minutes)} min</span><span class="pill num">${esc(p.points)} pts</span></span></div>
    <ul class="tight">${(p.tasks || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    ${(p.tips || []).length ? `<div class="stack"><span class="label">Tips</span><ul class="tight">${p.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}</div>`).join("")}
  ${ex.speaking_format ? `<div class="card"><span class="label">Speaking format</span><p>${esc(ex.speaking_format)}</p></div>` : ""}
  ${(ex.topics || []).length ? `<div class="card"><span class="label">The 15 exam topics</span><div class="row">${ex.topics.map(t => `<span class="pill" style="font-family:var(--body);font-size:.85rem">${esc(t)}</span>`).join("")}</div></div>` : ""}
  ${(R.strategy || []).length ? `<div class="stack"><h3>Strategy</h3><div class="grid2">${R.strategy.map(s => `<div class="card"><b>${esc(s.title)}</b><p class="small">${esc(s.tip)}</p></div>`).join("")}</div></div>` : ""}
  ${phraseBank(Object.keys(PB))}
  ${ex.results_and_retakes ? `<div class="card"><span class="label">Results and retakes</span><p>${esc(ex.results_and_retakes)}</p></div>` : ""}
  ${(R.resources || []).length ? `<div class="card"><span class="label">Free resources</span><div class="stack">${R.resources.map(r => `<div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a><div class="small muted">${esc(r.why)}</div></div>`).join("")}</div></div>` : ""}
  ${(R.notes || []).length ? `<p class="small muted">${R.notes.map(esc).join(" ")}</p>` : ""}
  ${(R.sources || []).length ? `<details><summary>Sources</summary><ul class="tight small">${R.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ul></details>` : ""}`;
};

/* ---------- Settings ---------- */
V.set = { msg: "", busy: false, backup: "", confirmReset: false };
VIEWS.settings = () => {
  const st = V.set;
  return `<div class="intro"><h2>Settings</h2></div>
  <div class="card">
    <h3>AI feedback</h3>
    <p><b>With a Claude subscription (Pro or Max), you don't need a key.</b> The “Check with Claude” and “Start in Claude” buttons open Claude with your text and the examiner instructions filled in. The prompt is also copied, so if Claude opens empty, paste it in.</p>
    <p class="muted"><b>Optional, for instant feedback inside this app:</b> writing feedback, the self-introduction check and the AI examiner use Claude (${MODEL}) through your own Anthropic API key. Create one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. The key is stored only on this device and sent only to Anthropic. A writing check costs roughly 2–5 US cents. API keys are billed separately from a Claude subscription.</p>
    <input type="password" id="set-key" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(apiKey)}">
    <div class="row"><button class="btn primary" data-act="set-save" ${st.busy ? "disabled" : ""}>${st.busy ? "Testing…" : "Save and test key"}</button>${apiKey ? `<button class="btn ghost" data-act="set-clear">Remove key</button>` : ""}<span class="pill ${sample ? "good" : ""}">${sample ? "AI on" : apiKey && !window.Anthropic ? "Loading…" : "AI off"}</span></div>
    ${st.msg ? `<div class="fb ${st.ok ? "right" : "wrong"}">${esc(st.msg)}</div>` : ""}
  </div>
  <div class="card">
    <h3>Back up or move your progress</h3>
    <p class="muted">Progress lives on this device. To move it, copy the backup here and paste it into Settings on the other device.</p>
    <div class="row"><button class="btn" data-act="set-export">Copy backup</button><button class="btn" data-act="set-import">Restore from pasted backup</button></div>
    <textarea id="set-backup" style="min-height:90px" spellcheck="false" placeholder="Paste a backup here to restore it">${esc(st.backup)}</textarea>
  </div>
  <div class="card">
    <h3>Start over</h3>
    <p class="muted">Deletes all progress on this device: word boxes, plan ticks, mistakes and saved texts.</p>
    <div class="row"><button class="btn bad" data-act="set-reset">${st.confirmReset ? "Tap again to delete everything" : "Reset progress"}</button></div>
  </div>
  <p class="small muted">Eksamiks valmis · works offline once loaded · AI features need internet.</p>`;
};
async function testKey(key) {
  const st = V.set; st.busy = true; st.msg = ""; render();
  try {
    if (!window.Anthropic) throw { code: "sdk" };
    const c = new window.Anthropic({ apiKey: key, dangerouslyAllowBrowser: true, maxRetries: 0 });
    await c.messages.create({ model: MODEL, max_tokens: 16, output_config: { effort: "low" }, messages: [{ role: "user", content: "Say OK." }] });
    apiKey = key; try { localStorage.setItem(KEY_LS, key) } catch {}
    setupAI(); st.ok = true; st.msg = "Key works. AI feedback is on.";
  } catch (e) { st.ok = false; st.msg = e?.code === "sdk" ? "The Claude library hasn't loaded. Connect to the internet and reopen the app." : aiError(e) }
  st.busy = false; render();
}
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-act]")?.dataset.act; if (!a || !a.startsWith("set-")) return;
  const st = V.set;
  if (a === "set-save") { const k = $("#set-key").value.trim(); if (k) testKey(k) }
  if (a === "set-clear") { apiKey = ""; try { localStorage.removeItem(KEY_LS) } catch {} setupAI(); st.msg = ""; render() }
  if (a === "set-export") {
    st.backup = JSON.stringify(S); render();
    const ta = $("#set-backup");
    try { await navigator.clipboard.writeText(st.backup); st.ok = true; st.msg = ""; ta.insertAdjacentHTML("beforebegin", '<div class="fb right">Backup copied. Paste it into Settings on the other device.</div>') }
    catch { ta.focus(); ta.select() }
  }
  if (a === "set-import") {
    try { const d = JSON.parse($("#set-backup").value); if (!d || typeof d !== "object" || !d.srs) throw 0; S = Object.assign(BLANK(), d); save(); st.backup = ""; $("#set-backup").value = ""; render(); $("#set-backup").insertAdjacentHTML("beforebegin", '<div class="fb right">Progress restored.</div>') }
    catch { $("#set-backup").insertAdjacentHTML("beforebegin", '<div class="fb wrong">That isn\'t a valid backup. Copy the whole text from the other device and try again.</div>') }
  }
  if (a === "set-reset") { if (st.confirmReset) { S = BLANK(); st.confirmReset = false; save(); try { localStorage.removeItem(LS) } catch {} } else st.confirmReset = true; render() }
});
document.addEventListener("input", e => { if (e.target.id === "set-backup") V.set.backup = e.target.value });

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
</body>
</html>
